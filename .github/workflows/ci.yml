name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python · ruff
    runs-on: ubuntu-latest
    steps:
      # The tree has never been ruff-clean (CLAUDE.md §1), so the gate is "no new
      # findings": tests/ruff_ratchet.py compares against the first parent, which
      # for a pull_request merge commit is the base branch tip (as contract-compat).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ".[dev]"
      - name: ruff · no new findings against the base (BLOCKING)
        run: |
          mkdir -p "$RUNNER_TEMP/ruff-base"
          git archive HEAD^1 -- pyproject.toml '*.py' | tar -x -C "$RUNNER_TEMP/ruff-base"
          python tests/ruff_ratchet.py --base-dir "$RUNNER_TEMP/ruff-base"
      # docs/v3/checklist/README.md: the design checklist is regenerated with every change it
      # reflects, and no declared status may contradict what the code shows.
      - name: design checklist · current and consistent (BLOCKING)
        run: python tests/design_checklist.py --check

  python-type:
    name: Python · mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ".[dev]"
      - name: Typecheck · whole tree (report)
        run: mypy --install-types --non-interactive backend/services backend/libs || true
        # ^ `|| true` while strict surface is small — drop once mypy passes clean.
        #   (basemodel moved under backend/libs/ in the libs-layer refactor.)
      - name: Strict typecheck · core libs + services (BLOCKING)
        # These surfaces are kept strict-clean (disallow_untyped_defs +
        # disallow_any_generics). This FAILS the build on any new untyped def or
        # bare generic in them. --ignore-missing-imports keeps it reproducible
        # without installing every service's runtime deps.
        #
        # Each surface is checked in its OWN mypy invocation: the services are not
        # importable packages and several share top-level module basenames
        # (config.py, app.py, state.py, graph.py, …). Passing them together makes
        # mypy collide those basenames and resolve `import config` to the wrong
        # service — spurious attr-defined errors. Per-surface runs avoid that.
        # `set -e` (GH Actions default bash -eo pipefail) fails the job on the
        # first surface that regresses.
        run: |
          for target in \
            backend/libs/basemodel backend/libs/database_connector backend/libs/shared \
            backend/libs/contracts \
            backend/services/kb_backend backend/services/workflow_runtime \
            backend/services/auth_api backend/services/model_service \
            backend/services/sandbox_executor \
            backend/services/platform_workers \
            backend/services/indicator_api \
            backend/services/api; do
            echo "== mypy strict: $target =="
            mypy --disallow-untyped-defs --disallow-any-generics \
                 --ignore-missing-imports --follow-imports=silent \
                 "$target"
          done

  # One job per service suite, in that service's Python with only its own
  # requirements.txt: no single environment can import every service (the
  # OpenTelemetry and boto3 pins conflict), so there is no "whole tree" run.
  # Mirrors `make test-unit`, which runs the same suites in the built images.
  python-test:
    name: Python · unit (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: workflow_runtime
            python: "3.11"
            install: -r backend/services/workflow_runtime/requirements.txt
          - suite: kb_backend
            python: "3.13"
            install: -r backend/services/kb_backend/requirements.txt
            apt: libpq-dev
          - suite: platform_workers
            python: "3.12"
            install: -r backend/services/platform_workers/requirements.txt
          # libs/contracts (NOP-150) in the kb-backend environment: it has PyYAML for
          # the seed test and pins pydantic, which the generated/ staleness check needs.
          - suite: contracts
            python: "3.13"
            install: -r backend/services/kb_backend/requirements.txt
            apt: libpq-dev
          - suite: sandbox_executor
            python: "3.11"
            install: -r backend/services/sandbox_executor/requirements.txt
          - suite: auth_api
            python: "3.12"
            install: -r backend/services/auth_api/requirements.txt
          - suite: kb_worker
            python: "3.11"
            # Same system libraries and CPU torch wheel as its Dockerfile;
            # docling imports fail without them.
            apt: libgl1 libglib2.0-0 poppler-utils tesseract-ocr
            pre: torch torchvision --index-url https://download.pytorch.org/whl/cpu
            install: -r deploy/docker/kb-worker/requirements.txt
          - suite: model_service
            python: "3.11"
            install: -r backend/services/model_service/requirements.txt
          - suite: indicator_api
            python: "3.11"
            install: -r backend/services/indicator_api/requirements.txt
          # The `api` block (ADR-28); its suite also holds the OpenAPI to tab 4 A2 (ADR-48).
          - suite: api
            python: "3.12"
            install: -r backend/services/api/requirements.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System libraries
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}
      - name: Pre-install
        if: matrix.pre
        run: pip install ${{ matrix.pre }}
      - name: Install the service and the test tooling
        run: pip install ${{ matrix.install }} -r requirements-test.txt
      - name: Run the suite
        # Per-suite coverage is only one service's share of the tree, so the
        # threshold is enforced on the combined report (coverage job below).
        env:
          OTEL_SDK_DISABLED: "true"
          COVERAGE_FILE: .coverage.${{ matrix.suite }}
        run: pytest -m unit tests/unit/${{ matrix.suite }} --cov --cov-report= --cov-fail-under=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-data-${{ matrix.suite }}
          path: .coverage.${{ matrix.suite }}
          include-hidden-files: true
          if-no-files-found: ignore

  python-coverage:
    name: Python · coverage (combined)
    needs: python-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "coverage[toml]>=7"
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: Combine and gate
        # fail_under lives in pyproject.toml [tool.coverage.report].
        run: |
          coverage combine .coverage.*
          coverage xml -o coverage.xml
          coverage report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: coverage.xml

  # Testcontainers needs a Docker daemon, which GitHub's Ubuntu runners have.
  # Same suites as `make test-integration`.
  python-integration:
    name: Python · integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: workflow_runtime
            python: "3.11"
            install: -r backend/services/workflow_runtime/requirements.txt -r tests/integration/workflow_runtime/requirements.txt
            sandbox: true
          - suite: sandbox_executor
            python: "3.11"
            install: -r backend/services/sandbox_executor/requirements.txt
            sandbox: true
            # A real container per test; same split as SUITE_PYTEST_ARGS in tests/run_suites.py.
            pytest_args: -n 4 --dist loadgroup
          # The Contract v1 mock (NOP-151) started as a real server, in the same
          # environment as the contracts unit suite.
          - suite: contracts
            python: "3.13"
            install: -r backend/services/kb_backend/requirements.txt
            apt: libpq-dev
          # The api against the V3 DDL (backend/alembic/sql) as its svc_* roles.
          - suite: api
            python: "3.12"
            install: -r backend/services/api/requirements.txt
          # The V3 DDL (backend/alembic/sql) and the ORM that mirrors it, on PostgreSQL 16.
          - suite: migrate
            python: "3.11"
            install: '"sqlalchemy[asyncio]==2.0.35"'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System packages
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}
      - name: Build the sandbox-runner image the sandbox tests start
        if: matrix.sandbox
        run: docker build -t sandbox-runner:latest backend/services/sandbox_executor/sandbox_runner
      - name: Install the service and the integration tooling
        run: pip install ${{ matrix.install }} -r requirements-integration.txt
      - name: Run the suite
        env:
          OTEL_SDK_DISABLED: "true"
          SANDBOX_RUNNER_IMAGE: sandbox-runner:latest
        run: pytest -m integration ${{ matrix.pytest_args }} tests/integration/${{ matrix.suite }}

  eval-gate:
    name: Eval · offline gate (policy + SQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install eval deps
        # The offline tier is pure Python over the REAL guards (sql_guard,
        # security_visitor, the tool-executor path check) and the REAL metric
        # compiler. sqlparse is the only third-party import on that path — no
        # model, no warehouse, no stack — which is what lets it gate every pull
        # request instead of being a nightly nobody reads.
        run: pip install sqlparse
      - name: Run offline evaluation
        run: python -m model.eval.run --tier offline --out eval-report.json
      - name: Gate on thresholds (BLOCKING)
        # Fails the build when policy_violation_rate or false_refusal_rate rises
        # above 0, or sql_accuracy drops below 1.0 — all three are deterministic,
        # so any movement is a regression rather than noise. It also fails when a
        # metric is MISSING, because an eval that silently did not run must not
        # read as a pass.
        run: python -m model.eval.gate --report eval-report.json --tier offline
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-offline
          path: eval-report.json

  contract-compat:
    # NOP-152: a breaking change to the published contract (libs/contracts/generated)
    # that raises no version blocks the merge. Rules: libs/contracts/COMPATIBILITY.md.
    name: Contract · compatibility (BLOCKING)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # A pull_request checks out the merge commit; its first parent is the base
      # branch tip it was merged onto, so the diff is exactly what this PR brings
      # into the base as it stands now.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Published contract of the base branch
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          if git cat-file -e HEAD^1:backend/libs/contracts/generated 2>/dev/null; then
            git archive HEAD^1 backend/libs/contracts/generated | tar -x -C "$RUNNER_TEMP/base"
          fi
      - name: Compare (stdlib only, no install)
        env:
          PYTHONPATH: backend
        run: |
          set +e
          python -m libs.contracts.compat \
            --base "$RUNNER_TEMP/base/backend/libs/contracts/generated" \
            --head backend/libs/contracts/generated
          code=$?
          # 2: the base branch has no published contract yet (before NOP-150 merges).
          if [ "$code" -eq 2 ]; then
            echo "::notice::base branch has no libs/contracts/generated, nothing to compare"
            exit 0
          fi
          exit "$code"

  frontend-lint:
    name: Frontend · tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  frontend-test:
    name: Frontend · vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/

  k8s-validate:
    name: K8s · manifest validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validators
        run: |
          pip install ".[test]"
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - name: Schema-validate every manifest against the k8s API
        run: kubeconform -strict -summary -ignore-missing-schemas deploy/k8s/
      - name: Structure, pod security and drift checks
        run: pytest tests/unit/workflow_runtime/test_k8s_manifests.py -q

  quality-gates:
    # Phase 0 guardrails for the SRS (architecture + dead code + strict types).
    # import-linter is BLOCKING (its contracts pass today, so this prevents new
    # Dependency-Rule violations). The rest are REPORT-ONLY (`|| true`) because
    # they have a known baseline to burn down — flip them to blocking per phase.
    name: Quality · arch + dead-code + strict (report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install import-linter vulture
      - name: Architecture contracts (import-linter · BLOCKING)
        run: lint-imports
        env:
          PYTHONPATH: backend   # .importlinter root_packages (libs, services) live under backend/
      - name: Dead code · Python (vulture · report)
        run: vulture || true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Dead code · TypeScript (knip · report)
        run: npm run deadcode || true
      - name: Strict typecheck (incremental · report)
        run: npm run typecheck:strict || true
      - name: Prettier format check (report)
        run: npm run format:check || true

  security-scan:
    # Supply-chain guardrails: known-CVE dependencies + filesystem vuln/secret/
    # misconfig scan. REPORT-ONLY for now (`|| true` / exit-code 0) because there
    # is an existing baseline to burn down — flip pip-audit to blocking and set
    # trivy `exit-code: 1` on HIGH,CRITICAL once the baseline is clean.
    name: Security · deps CVE + fs scan (report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pip-audit
      - name: Dependency CVE scan (pip-audit · report)
        # Audit every service's pinned deps. `-r` per requirements.txt; `|| true`
        # so a known CVE doesn't block the pipeline yet. Drop `|| true` per file
        # as each is triaged/patched.
        run: |
          for req in $(git ls-files '*requirements*.txt'); do
            echo "::group::pip-audit $req"
            pip-audit -r "$req" --desc on || true
            echo "::endgroup::"
          done
      - name: Filesystem vuln + secret + misconfig scan (trivy · report)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"   # report-only; set to "1" to block once baseline is clean
          ignore-unfixed: true
