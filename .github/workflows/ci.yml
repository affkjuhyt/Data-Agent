name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python · ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  python-type:
    name: Python · mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install mypy
      - name: Typecheck · whole tree (report)
        run: mypy --install-types --non-interactive backend/services backend/libs || true
        # ^ `|| true` while strict surface is small — drop once mypy passes clean.
        #   (basemodel moved under backend/libs/ in the libs-layer refactor.)
      - name: Strict typecheck · core libs + services (BLOCKING)
        # These surfaces are kept strict-clean (disallow_untyped_defs +
        # disallow_any_generics). This FAILS the build on any new untyped def or
        # bare generic in them. --ignore-missing-imports keeps it reproducible
        # without installing every service's runtime deps.
        #
        # Each surface is checked in its OWN mypy invocation: the services are not
        # importable packages and several share top-level module basenames
        # (config.py, app.py, state.py, graph.py, …). Passing them together makes
        # mypy collide those basenames and resolve `import config` to the wrong
        # service — spurious attr-defined errors. Per-surface runs avoid that.
        # `set -e` (GH Actions default bash -eo pipefail) fails the job on the
        # first surface that regresses.
        run: |
          for target in \
            backend/libs/basemodel backend/libs/database_connector backend/libs/shared \
            backend/services/kb_backend backend/services/workflow_runtime \
            backend/services/auth_api backend/services/flow_builder backend/services/model_service \
            backend/services/release_worker backend/services/sandbox_executor \
            backend/services/kb-ingestion-worker backend/services/platform-workers; do
            echo "== mypy strict: $target =="
            mypy --disallow-untyped-defs --disallow-any-generics \
                 --ignore-missing-imports --follow-imports=silent "$target"
          done

  python-test:
    name: Python · pytest (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test + service deps
        # `[test]` covers pytest/testcontainers; service requirements.txt files
        # bring the runtime deps the integration tests import in-process
        # (hvac for auth_api, etc). Expand this list as more service tests land.
        #
        # alembic + asyncpg are needed for tests/integration/test_alembic_migrations.py
        # which runs the migration chain through asyncpg (the same driver
        # production migrate uses). Catches errors like "cannot insert
        # multiple commands into a prepared statement" that psycopg2 hides.
        run: |
          pip install -e ".[test]"
          pip install -r backend/services/auth_api/requirements.txt
          pip install alembic sqlalchemy[asyncio] asyncpg pydantic
      - name: Run pytest
        run: pytest -m "unit or integration" --cov --cov-report=xml --cov-report=term -n auto
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

  eval-gate:
    name: Eval · offline gate (policy + SQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install eval deps
        # The offline tier is pure Python over the REAL guards (sql_guard,
        # security_visitor, the tool-executor path check) and the REAL metric
        # compiler. sqlparse is the only third-party import on that path — no
        # model, no warehouse, no stack — which is what lets it gate every pull
        # request instead of being a nightly nobody reads.
        run: pip install sqlparse
      - name: Run offline evaluation
        run: python -m model.eval.run --tier offline --out eval-report.json
      - name: Gate on thresholds (BLOCKING)
        # Fails the build when policy_violation_rate or false_refusal_rate rises
        # above 0, or sql_accuracy drops below 1.0 — all three are deterministic,
        # so any movement is a regression rather than noise. It also fails when a
        # metric is MISSING, because an eval that silently did not run must not
        # read as a pass.
        run: python -m model.eval.gate --report eval-report.json --tier offline
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-offline
          path: eval-report.json

  frontend-lint:
    name: Frontend · eslint + tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  frontend-test:
    name: Frontend · vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/

  k8s-validate:
    name: K8s · manifest validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validators
        run: |
          pip install "kubernetes>=31.0" pyyaml pytest
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - name: Schema-validate every manifest against the k8s API
        run: kubeconform -strict -summary -ignore-missing-schemas deploy/k8s/
      - name: Structure, pod security and drift checks
        run: pytest tests/unit/test_k8s_manifests.py -q

  quality-gates:
    # Phase 0 guardrails for the SRS (architecture + dead code + strict types).
    # import-linter is BLOCKING (its contracts pass today, so this prevents new
    # Dependency-Rule violations). The rest are REPORT-ONLY (`|| true`) because
    # they have a known baseline to burn down — flip them to blocking per phase.
    name: Quality · arch + dead-code + strict (report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install import-linter vulture
      - name: Architecture contracts (import-linter · BLOCKING)
        run: lint-imports
        env:
          PYTHONPATH: backend   # .importlinter root_packages (libs, services) live under backend/
      - name: Dead code · Python (vulture · report)
        run: vulture || true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Dead code · TypeScript (knip · report)
        run: npm run deadcode || true
      - name: Strict typecheck (incremental · report)
        run: npm run typecheck:strict || true
      - name: Prettier format check (report)
        run: npm run format:check || true

  security-scan:
    # Supply-chain guardrails: known-CVE dependencies + filesystem vuln/secret/
    # misconfig scan. REPORT-ONLY for now (`|| true` / exit-code 0) because there
    # is an existing baseline to burn down — flip pip-audit to blocking and set
    # trivy `exit-code: 1` on HIGH,CRITICAL once the baseline is clean.
    name: Security · deps CVE + fs scan (report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pip-audit
      - name: Dependency CVE scan (pip-audit · report)
        # Audit every service's pinned deps. `-r` per requirements.txt; `|| true`
        # so a known CVE doesn't block the pipeline yet. Drop `|| true` per file
        # as each is triaged/patched.
        run: |
          for req in $(git ls-files '*requirements*.txt'); do
            echo "::group::pip-audit $req"
            pip-audit -r "$req" --desc on || true
            echo "::endgroup::"
          done
      - name: Filesystem vuln + secret + misconfig scan (trivy · report)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"   # report-only; set to "1" to block once baseline is clean
          ignore-unfixed: true
