# Local "lite" override — shrinks the memory-hungry services so the stack fits in
# a typical Docker Desktop / WSL2 VM. The committed values in docker-compose.yml
# are prod tuning (Neo4j 4g heap + 3g pagecache ≈ 7GB) that overwhelms a dev
# laptop and crashes the Docker engine. Use with:
#
#   docker compose --env-file .env \
#     -f infra/docker-compose.yml -f infra/docker-compose.local-lite.yml \
#     up -d <services>
services:
  # The base compose points kb-backend at the shared `dataagent` DB, which already
  # has the platform schema from sql/init.sql — its `idx_role_permissions_role`
  # collides with the KB ORM's same-named index on create_all. main.py is designed
  # around a dedicated `aeroflow_kb` DB (it self-creates it), so use that here.
  kb-backend:
    environment:
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-dev123}@postgres/aeroflow_kb
      # Base compose omits these, so main.py falls back to wrong defaults
      # (minioadmin creds, etc.). Mirror the kb-ingestion-worker settings.
      MINIO_URL: http://${MINIO_ROOT_USER:-minio}:${MINIO_ROOT_PASSWORD:-minio_secret}@minio:9000
      MONGO_URL: mongodb://mongo:27017/dataagent
      KAFKA_URL: kafka:9092

  neo4j:
    environment:
      NEO4J_server_memory_heap_initial__size: '512m'
      NEO4J_server_memory_heap_max__size: '1g'
      NEO4J_server_memory_pagecache_size: '512m'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: '2G'
        reservations:
          cpus: '1.0'
          memory: '512M'
