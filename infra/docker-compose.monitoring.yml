# KB CCU observability + the gateway as the real entry point (KB-SCALE-10K.md #8).
# Attaches to the shared network so Prometheus can scrape kb-gateway + model-service.
#
#   docker compose -f infra/docker-compose.monitoring.yml --env-file infra/.env.kb-testing \
#     --profile monitoring up -d --build
#
# Then: Grafana http://localhost:3000 (anonymous admin) → dashboard "KB — High CCU".
#       Prometheus http://localhost:9090 · gateway http://localhost:8010
name: kb_monitoring

networks:
  default:
    external: true
    name: data-agent-network

services:
  # The Go edge/BFF as the real front door — instrumented (/metrics) + protective.
  # Rate/DDoS limits default OFF here so a load test measures raw capacity; set the
  # KB_GATEWAY_* envs > 0 to demo throttling.
  kb-gateway:
    build:
      context: ..
      dockerfile: services/kb-gateway/Dockerfile
    image: kb-gateway:latest
    container_name: kb-gateway
    restart: unless-stopped
    environment:
      KB_BACKEND_URL: http://kb-backend:8000
      KB_COMPUTE_URL: http://kb-compute:8600
      KB_GATEWAY_RATE_RPS: "${KB_GATEWAY_RATE_RPS:-0}"
      KB_GATEWAY_GLOBAL_RPS: "${KB_GATEWAY_GLOBAL_RPS:-0}"
      KB_GATEWAY_IP_RPS: "${KB_GATEWAY_IP_RPS:-0}"
      KB_GATEWAY_MAX_CONCURRENT: "${KB_GATEWAY_MAX_CONCURRENT:-0}"
      # High-CCU connection pooling to kb-backend (avoids EOF from port churn).
      KB_GATEWAY_MAX_IDLE_PER_HOST: "${KB_GATEWAY_MAX_IDLE_PER_HOST:-2000}"
    ports:
      - "8010:8000"
    profiles: [monitoring]
    deploy:
      resources:
        limits:
          memory: 512M

  # Probes the host LLM (ollama) and exposes generation perf as /metrics.
  llm-exporter:
    build:
      context: ..
      dockerfile: services/llm-exporter/Dockerfile
    image: llm-exporter:latest
    container_name: llm-exporter
    restart: unless-stopped
    environment:
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:11434}"
      LLM_MODEL: "${LLM_MODEL:-qwen2.5:3b}"
      PROBE_INTERVAL: "${LLM_PROBE_INTERVAL:-30}"
      PROBE_CONCURRENCY: "${LLM_PROBE_CONCURRENCY:-3}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: [monitoring]
    deploy:
      resources:
        limits:
          memory: 128M

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: dataagent-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2h"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: [monitoring]
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:11.2.0
    container_name: dataagent-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    profiles: [monitoring]
    deploy:
      resources:
        limits:
          memory: 256M
