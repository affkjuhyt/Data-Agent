# Local LLM override — llama-server chạy trên host, LiteLLM gọi qua host-gateway
#
# Bước 1: Start llama-server trên host trước
#   bash model/llama-server/start-llama.sh
#
# Bước 2: Start stack với file này
#   docker compose -f docker/docker-compose.yml \
#                  -f docker/docker-compose.local.yml \
#                  -f docker/docker-compose.llm.yml up -d --build

services:
  litellm:
    extra_hosts:
      - "host.docker.internal:host-gateway"
