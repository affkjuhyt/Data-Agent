# Declarative (DB-less) Kong config for the kb-ui-testing stack.
#
# Loaded at boot via KONG_DATABASE=off + KONG_DECLARATIVE_CONFIG, so there is NO
# kong-migration step and NO admin-API configuration call — `docker compose up`
# brings Kong up already configured (unlike the kb-e2e stack, which uses a
# DB-backed Kong configured imperatively by kb-e2e.ps1).
#
# Chain:  browser (npm run dev :3000) → Kong :8000 → kb-backend :8000 (in-network)
#   aeroflow-jwks verifies the Keycloak RS256 JWT and injects the X-* identity
#   headers kb-backend's authenticate() requires; cors lets the :3000 dev server
#   preflight before the JWT plugin runs.
_format_version: "3.0"
_transform: true

services:
  - name: kb-backend
    url: http://kb-backend:8000
    connect_timeout: 5000
    # Generous read_timeout: SSE endpoints under /api/pipeline stream for a long
    # time and can be quiet between events. The backend also sends heartbeats, but
    # this keeps Kong from dropping a slow upstream. Only affects a SILENT upstream;
    # normal fast requests are unaffected.
    read_timeout: 3600000
    routes:
      - name: kb-backend-route
        # The real router prefixes: /api/data (data.py), /api/fleet (fleet.py),
        # /api/pipeline (ingestion SSE + light-rag), /api/knowledge (everything else).
        paths:
          - /api/data
          - /api/knowledge
          - /api/fleet
          - /api/pipeline
        strip_path: false
        methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        plugins:
          - name: cors
            config:
              origins: ["http://localhost:3000"]
              methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
              headers: [Authorization, Content-Type]
              credentials: true
              max_age: 3600
    plugins:
      - name: aeroflow-jwks
        config:
          # Kong fetches JWKS by service DNS; issuer is validated against the
          # public URL the browser used to obtain the token.
          jwks_uri: http://keycloak:8080/realms/aeroflow/protocol/openid-connect/certs
          issuer: http://localhost:8080/realms/aeroflow
          jwks_refresh_interval: 300
          grace_period: 600
