# ─── Auth-Lite stack ──────────────────────────────────────────────────────────
# The smallest stack that exercises the REAL identity chain end-to-end:
#
#   browser/curl → Keycloak (login, RS256 JWT)
#                → Kong (aeroflow-jwks: verify sig/iss/exp, inject X-* headers)
#                → kb-backend router (get_ui_context → require_perm)
#
# It deliberately OMITS the data-plane stores (Qdrant, Neo4j, Mongo, MinIO,
# Kafka, model-service, ingestion worker) that make the full stack ~27 GiB.
# kb-backend runs with KB_LITE=true so it boots on Postgres alone.
#
# Footprint: postgres + keycloak + kong(+migration) + kb-backend ≈ 1.5–2 GiB.
#
# Bring up (from repo root) with the helper, which also configures Kong:
#   pwsh infra/auth-lite.ps1
#
# …or by hand (from infra/):
#   docker compose -f docker-compose.auth-lite.yml up -d --build
#   # then configure Kong — see auth-lite.ps1 Configure-Kong, or run the
#   # JSON PUTs against the admin API on http://localhost:8900
#
# Add the dev frontend (Keycloak browser login on :5173):
#   docker compose -f docker-compose.auth-lite.yml --profile ui up -d
#
# Test users (realm-export.local.json). The *.aeroflow.local users require TOTP
# setup so they CANNOT use the password grant; use the helios-* users which have
# no required actions — ideal for `curl`/password-grant testing:
#   helios-admin    / H3lios@Admin01!   role=platform-admin   tenant=b0000…0002
#   helios-engineer / H3lios@Eng001!    role=ai-engineer      tenant=b0000…0002
#   helios-viewer   / H3lios@View01!    role=executive-viewer tenant=b0000…0002

name: aeroflow-auth-lite

networks:
  default:
    name: auth-lite-network

volumes:
  pg_data:

services:
  # ── PostgreSQL — backs Keycloak (schema: keycloak), Kong (schema: kong),
  #    and kb-backend (separate DB: aeroflow_kb, self-created by main.py).
  postgres:
    image: postgres:16-alpine
    container_name: authlite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev123}
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: ${POSTGRES_DB:-dataagent}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-dataagent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Keycloak — issues RS256 JWTs. iss is derived from the request Host, so
  #    tokens fetched via localhost:8080 carry iss=http://localhost:8080/realms/aeroflow
  #    (matches the issuer Kong is configured with). Uses the lite realm export.
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: authlite-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dataagent}
      KC_DB_USERNAME: ${POSTGRES_USER:-admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-dev123}
      # Use the default `public` schema. Keycloak/Liquibase does NOT create a
      # named schema itself (it errors "schema does not exist"), and this
      # self-contained lite Postgres ships no init SQL to pre-create one. Kong
      # lives in its own `kong` schema (created by kong migrations) and
      # kb-backend is in a separate DB, so there is no collision.
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.local.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Kong — gateway. Custom aeroflow-jwks plugin verifies the JWT and injects
  #    X-Kong-Verified / X-User-Id / X-Tenant-Id / X-User-Roles / X-Role-Id.
  #    Admin API is published on 8900 (host) so the helper can configure it.
  kong-migration:
    build:
      context: ..
      dockerfile: infra/kong/Dockerfile
    container_name: authlite-kong-migration
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_PORT: 5432
      KONG_PG_DATABASE: ${POSTGRES_DB:-dataagent}
      KONG_PG_USER: ${POSTGRES_USER:-admin}
      KONG_PG_PASSWORD: ${POSTGRES_PASSWORD:-dev123}
      KONG_PG_SCHEMA: kong
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  kong:
    build:
      context: ..
      dockerfile: infra/kong/Dockerfile
    container_name: authlite-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_PORT: 5432
      KONG_PG_DATABASE: ${POSTGRES_DB:-dataagent}
      KONG_PG_USER: ${POSTGRES_USER:-admin}
      KONG_PG_PASSWORD: ${POSTGRES_PASSWORD:-dev123}
      KONG_PG_SCHEMA: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_PLUGINS: bundled,aeroflow-jwks
    ports:
      - "8000:8000"   # proxy — all API traffic enters here
      - "8900:8001"   # admin  — used by auth-lite.ps1 to register the route/plugin
    depends_on:
      postgres:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── KB backend — the router under test. KB_LITE=true → boots on Postgres
  #    alone. KB_DEV_AUTH is intentionally UNSET → fail-closed: any request that
  #    did not pass through Kong (no X-Kong-Verified) gets 401. Published on 8050
  #    so you can confirm that fail-closed behaviour directly, bypassing Kong.
  kb-backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.kb
    container_name: authlite-kb-backend
    restart: unless-stopped
    environment:
      KB_LITE: "true"
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-dev123}@postgres/aeroflow_kb
    ports:
      - "8050:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend (optional) — Vite dev server for real browser login via Keycloak.
  #    Enable with:  docker compose -f docker-compose.auth-lite.yml --profile ui up -d
  frontend:
    profiles: ["ui"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    container_name: authlite-frontend
    restart: unless-stopped
    volumes:
      # repo root (one level up from infra/) → /app for live hot-reload;
      # keep the image's installed node_modules (don't shadow with host's).
      - ..:/app
      - /app/node_modules
    ports:
      - "5173:3000"
    environment:
      VITE_MOCK_AUTH: "false"                  # use real Keycloak login, not the demo bypass
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: aeroflow
      VITE_KEYCLOAK_CLIENT: aeroflow-frontend
      VITE_API_URL: http://localhost:8000      # API calls go THROUGH Kong (the code reads VITE_API_URL)
    depends_on:
      keycloak:
        condition: service_started
      kong:
        condition: service_healthy
