model_list:
  - model_name: llama3
    litellm_params:
      model: ollama/llama3
      api_base: http://llama:11434

  - model_name: planner
    litellm_params:
      model: openai/haiku
      api_base: http://host.docker.internal:8089/v1
      api_key: not-needed

  - model_name: responder
    litellm_params:
      model: openai/sonnet
      api_base: http://host.docker.internal:8089/v1
      api_key: not-needed

  - model_name: guardrail
    litellm_params:
      model: openai/haiku
      api_base: http://host.docker.internal:8089/v1
      api_key: not-needed

  - model_name: rewriter
    litellm_params:
      model: openai/haiku
      api_base: http://host.docker.internal:8089/v1
      api_key: not-needed

  - model_name: suggester
    litellm_params:
      model: openai/haiku
      api_base: http://host.docker.internal:8089/v1
      api_key: not-needed

  - model_name: judge
    litellm_params:
      model: openai/haiku
      api_base: http://host.docker.internal:8089/v1
      api_key: not-needed

  - model_name: embedder
    litellm_params:
      model: openai/bge-m3
      api_base: http://model-service:8001/v1
      api_key: not-needed

  # Orchestrator level — ToT planner + summary (Claude via proxy-ai on host)
  - model_name: orchestrator-planner
    litellm_params:
      model: openai/sonnet
      api_base: http://host.docker.internal:8089/v1
      api_key: not-needed

  - model_name: orchestrator-summary
    litellm_params:
      model: openai/haiku
      api_base: http://host.docker.internal:8089/v1
      api_key: not-needed

  # Local LLM via llama.cpp server (CPU-only, fallback)
  - model_name: local-qwen
    litellm_params:
      model: openai/qwen3-8b-instruct
      api_base: http://host.docker.internal:8088/v1
      api_key: not-needed
      extra_body:
        enable_thinking: false

  - model_name: local
    litellm_params:
      model: openai/qwen3-8b-instruct
      api_base: http://host.docker.internal:8088/v1
      api_key: not-needed
      extra_body:
        enable_thinking: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  request_timeout: 600
  set_verbose: false
  json_logs: true
  # KHÔNG bật "langfuse" ở đây — proxy này log MỖI completion call thành 1
  # trace "litellm-acompletion" RIÊNG BIỆT, không biết gì về trace_id/OTEL
  # context của orchestrator/workflow-runtime, nên tạo ra hàng loạt trace rời
  # rạc thay vì nối vào đúng trace của request. Tracing giờ do app-level xử lý
  # (services/orchestrator, services/workflow-runtime — xem observability.py
  # mỗi service: @observe() decorator + langfuse.langchain.CallbackHandler).
  cache: true
  cache_params:
    type: redis
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
