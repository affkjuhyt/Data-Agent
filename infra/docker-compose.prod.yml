# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml — production HARDENING overlay  (REVIEW DRAFT)
# ─────────────────────────────────────────────────────────────────────────────
# Layers on top of the base file (and the HA identity from security.yml).
# It only changes fields an overlay can change cleanly: per-key `environment`,
# `command`, extra `volumes`, and `restart`. See the "CANNOT do via overlay"
# note at the bottom for the two hardening steps that require editing the base
# file during the compose-consolidation phase.
#
# Usage — full hardened stack for one feature (e.g. kb):
#   docker compose \
#     -f infra/docker-compose.yml \
#     -f infra/docker-compose.security.yml \   # HA Keycloak + isolated Kong admin
#     -f infra/docker-compose.prod.yml \        # this file: secrets + TLS + no-trust
#     -f infra/docker-compose.app.yml \         # (add for runtime: sandbox etc.)
#     --profile kb up -d --scale keycloak=0
#
#   --scale keycloak=0 suppresses the base single-node Keycloak so only the
#   security.yml HA nodes (keycloak-node1/2 + keycloak-lb) run.
#
# All secrets below use ${VAR:?message}: `docker compose up` FAILS FAST if the
# variable is missing instead of silently falling back to a dev default.
# Provide them via a real .env / secrets manager — never commit them.
# ─────────────────────────────────────────────────────────────────────────────
services:
  postgres:
    restart: always
    environment:
      # Remove the base file's POSTGRES_HOST_AUTH_METHOD: trust — require a real
      # password and modern SCRAM auth for every connection.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
    # WAL archiving for point-in-time recovery (was docker-compose.storage.yml,
    # folded here since it's a prod-only concern). `archive_command` writes WAL
    # segments to /backups/wal; the postgres-backup sidecar below prunes them.
    # `test ! -f` keeps archiving idempotent on Postgres' retry. max_wal_senders
    # is set so a future streaming replica can attach without a restart.
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /backups/wal/%f && cp %p /backups/wal/%f'
      -c max_wal_senders=3
      -c max_replication_slots=3
    # Overlay MERGES volumes with the base file — these APPEND to base's four
    # init scripts (they don't replace them). 05-grants creates the
    # runtime_writer role that workflow-runtime's RUNTIME_DB_URL connects as.
    volumes:
      - postgres_backups:/backups
      - ./sql/grant-runtime-writer.sql:/docker-entrypoint-initdb.d/05-grants.sql:ro

  # ─── Postgres logical backup sidecar (was docker-compose.storage.yml) ───────
  # pg_dump every BACKUP_INTERVAL_HOURS (default 6h), pruned at
  # BACKUP_RETENTION_DAYS (default 7). WAL is archived by Postgres itself
  # (archive_command above); this sidecar additionally prunes old WAL.
  # For PITR: restore latest dump + replay WAL to a target timestamp. See
  # docs/disaster-recovery.md "Postgres restore". NOT a replacement for
  # streaming replication — use pgBackRest / a managed service for real prod.
  postgres-backup:
    image: postgres:16-alpine
    container_name: dataagent-postgres-backup
    restart: always
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      PGDATABASE: ${POSTGRES_DB:-dataagent}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    # Plain shell loop instead of cron — one process, fewer moving parts.
    command: >
      sh -c '
        set -eu
        mkdir -p /backups/dumps /backups/wal
        echo "[backup] retention=${BACKUP_RETENTION_DAYS}d interval=${BACKUP_INTERVAL_HOURS}h"
        while :; do
          ts=$$(date +%Y%m%d_%H%M%S)
          dump=/backups/dumps/dump_$${ts}.sql.gz
          echo "[backup] $$(date -Iseconds) writing $${dump}"
          # `|| true` on purpose: a pipeline reports the exit status of gzip,
          # never of pg_dump, so this line cannot tell you whether the dump
          # worked — and under `set -e` a real gzip failure (disk full) would
          # kill the loop for good, silently ending all future backups.
          # (No apostrophes in these comments: the whole command is a
          # single-quoted sh -c argument, and one would close it.)
          pg_dump --format=plain --no-owner --no-privileges | gzip > "$${dump}.tmp" || true
          # So verify the artifact instead of trusting an exit code: it must
          # decompress, and it must carry the completion marker that pg_dump
          # writes last. A dump cut short stays byte-for-byte plausible right
          # up until the day you restore it.
          if gzip -t "$${dump}.tmp" 2>/dev/null && gunzip -c "$${dump}.tmp" | tail -5 | grep -q "PostgreSQL database dump complete"; then
            mv "$${dump}.tmp" "$${dump}"
            echo "[backup] OK size=$$(stat -c%s "$${dump}") bytes"
          else
            echo "[backup] FAILED — dump incomplete, leaving previous dumps in place"
            rm -f "$${dump}.tmp"
          fi
          find /backups/dumps -name "dump_*.sql.gz" -mtime +$${BACKUP_RETENTION_DAYS} -delete
          find /backups/wal -type f -mtime +$${BACKUP_RETENTION_DAYS} -delete
          sleep $$((BACKUP_INTERVAL_HOURS * 3600))
        done
      '

  redis:
    restart: always
    # Custom redis.conf (was docker-compose.storage.yml). bind 0.0.0.0 +
    # protected-mode no, NO requirepass — Langfuse must not send AUTH (see the
    # REDIS_AUTH note in the base file's langfuse-worker block).
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

  mongo:
    restart: always

  minio:
    restart: always
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in production}

  kafka:
    restart: always
    environment:
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?KAFKA_ADMIN_PASSWORD must be set in production}

  neo4j:
    restart: always
    environment:
      # Base runs Neo4j with AUTH none — require credentials in production.
      NEO4J_AUTH: ${NEO4J_AUTH:?NEO4J_AUTH must be set in production, e.g. neo4j/<strong-password>}

      # Base defaults are dev-sized; production gets the full graph allocation.
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_SIZE:-4g}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_SIZE:-4g}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-3g}
    deploy:
      resources:
        limits:
          cpus: ${NEO4J_CPUS:-4.0}
          memory: ${NEO4J_MEMORY:-10G}
        reservations:
          cpus: ${NEO4J_CPUS:-4.0}
          memory: ${NEO4J_MEMORY:-10G}

  # OpenBao with TLS. Base mounts ../infra/openbao at /openbao/config, so
  # config.prod.hcl (created alongside this file) is available in-container.
  # We add the certs mount and switch the config file.
  openbao:
    restart: always
    # Base mounts only config.hcl into /openbao/config; add the prod file and
    # let the entrypoint load the directory (see openbao in docker-compose.yml).
    command: server
    volumes:
      - openbao_data:/openbao/data
      - ./openbao/config.prod.hcl:/openbao/config/config.prod.hcl:ro
      - ./openbao:/openbao/scripts:ro
    environment:
      BAO_ADDR: https://127.0.0.1:8200
    volumes:
      - ../infra/certs:/openbao/certs:ro

  kong:
    restart: always

  keycloak:
    restart: always
    environment:
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set in production}

# ─────────────────────────────────────────────────────────────────────────────
# CANNOT be done via overlay — do these in the base file during consolidation:
#
#   1. Remove host-published infra ports. Compose MERGES `ports` (a `ports: []`
#      override does NOT clear them), so stripping 5432/9092/9001/9200/8300/…
#      from the host must be edited directly in docker-compose.yml. Keep only
#      Kong proxy :8000 (and the Keycloak LB) exposed.
#
#   2. Remove the `:-dev123` / `:-minio_secret` / `:-sk-dev` interpolation
#      DEFAULTS baked into the base file's ${VAR:-default} references. An overlay
#      cannot change another service's interpolation default, only its own env.
#
#   3. Close the Kafka INTERNAL PLAINTEXT listener (:9094, principal ANONYMOUS =
#      super-user). Requires giving kb-backend + kb-ingestion-worker SASL creds
#      first, then dropping INTERNAL from KAFKA_LISTENERS — a coordinated change,
#      tracked as its own step.
# ─────────────────────────────────────────────────────────────────────────────

# Top-level volumes MERGE with the base file. postgres_backups is prod-only
# (the backup sidecar + WAL archive dir), so it's declared here, not in base.
volumes:
  postgres_backups:
