# Alembic schema migration — the k8s equivalent of the `migrate` service in
# infra/docker-compose.local.yml / .dev.yml.
#
# Compose gets ordering for free: `depends_on: {migrate: service_completed_
# successfully}` holds the app containers until the migration exits 0. A
# Deployment has no such edge — apply the directory and every pod starts
# immediately, against whatever schema happens to be there. Two halves fix that:
#
#   1. THIS Job, which runs `alembic upgrade head` exactly once per apply.
#   2. A `wait-for-migrations` initContainer in each runtime Deployment, which
#      blocks until the database actually reports itself at head. That one also
#      covers the case a Job cannot: a pod rescheduled during a rolling upgrade
#      must not serve traffic on the old schema.
#
# Both use the same image and the same DATABASE_URL, so there is one definition
# of "migrated" and it is the database's own answer, not a manifest's ordering.
#
# RE-RUNNING: a Job's pod template is immutable, so `kubectl apply` over a
# completed Job fails. Delete it first — the README's upgrade flow does this:
#
#   kubectl delete job dataagent-migrate --ignore-not-found
#   kubectl apply -f deploy/k8s/migrate-job.yaml
#   kubectl wait --for=condition=complete job/dataagent-migrate --timeout=10m
#
# ttlSecondsAfterFinished below also has the cluster reap it an hour after it
# finishes, so a later `kubectl apply -f deploy/k8s/` usually just works.
apiVersion: batch/v1
kind: Job
metadata:
  name: dataagent-migrate
  labels: { app: dataagent-migrate, app.kubernetes.io/part-of: dataagent }
spec:
  # A failed migration is a stop-and-look event, not something to hammer at: a
  # partially-applied revision retried blindly is how a schema ends up in a
  # state no revision describes. Two attempts covers a transient DB restart.
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: dataagent-migrate }
    spec:
      restartPolicy: Never
      containers:
        - name: alembic
          image: REGISTRY/dataagent-alembic:latest   # built from alembic/Dockerfile
          # `upgrade head`, singular: the revision graph has exactly one head
          # (f1r2e3s4h5n6 as of writing — the merge revision c75156d1bd53 joined
          # the last fork). `heads` would silently paper over a new fork; this
          # fails loudly instead, which is what you want before a deploy.
          command: ["alembic", "-c", "alembic/alembic.ini", "upgrade", "head"]
          envFrom:
            # DATABASE_URL — postgresql+asyncpg://... Migrations run through
            # asyncpg in production and the tests pin that on purpose
            # (tests/integration/test_alembic_migrations.py): some SQL that
            # works on psycopg2 is rejected by asyncpg.
            - secretRef: { name: dataagent-secrets }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
