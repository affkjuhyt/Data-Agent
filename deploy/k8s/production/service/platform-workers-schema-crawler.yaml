apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-workers-schema-crawler
  namespace: dataagent-service
  labels:
    app: platform-workers-schema-crawler
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-workers-schema-crawler-env
  namespace: dataagent-service
  labels:
    app: platform-workers-schema-crawler
    app.kubernetes.io/part-of: dataagent
data:
  WORKER: schema-crawler
  OTEL_SERVICE_NAME: platform-workers-schema-crawler
  DB_HOST: postgres.dataagent-database.svc.cluster.local
  DB_PORT: '8300'
  # NOBYPASSRLS: scans walk the tenants and writes run in a tenant_session (common/db).
  DB_USER: app_user
  KAFKA_SASL_USERNAME: schema-crawler-worker
  KAFKA_DDL_TOPIC: ddl.changes
  KAFKA_GROUP_ID: schema-crawler-worker-group
  CRAWL_INTERVAL_SECONDS: '86400'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-workers-schema-crawler
  namespace: dataagent-service
  labels:
    app: platform-workers-schema-crawler
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-workers-schema-crawler
  template:
    metadata:
      labels:
        app: platform-workers-schema-crawler
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: platform-workers-schema-crawler
        image: dataagent/platform-workers:latest
        envFrom:
        - configMapRef:
            name: dataagent-config
        - configMapRef:
            name: platform-workers-schema-crawler-env
        - secretRef:
            name: platform-workers-schema-crawler-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        command:
        - python
        - -u
        - -m
        - services.platform_workers
      volumes:
      - name: tmp
        emptyDir: {}
      enableServiceLinks: false
      serviceAccountName: platform-workers-schema-crawler
