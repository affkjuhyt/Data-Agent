apiVersion: v1
kind: ServiceAccount
metadata:
  name: kb-structured-data
  namespace: dataagent-service
  labels:
    app: kb-structured-data
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kb-structured-data-env
  namespace: dataagent-service
  labels:
    app: kb-structured-data
    app.kubernetes.io/part-of: dataagent
data:
  LLM_MODEL: agent-fast
  HF_HOME: /cache
  USE_VLM: 'false'
  GOLD_CHUNK_CONCURRENCY: '1'
  SILVER_CONCURRENCY: '1'

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kb-structured-data-cache
  namespace: dataagent-service
  labels:
    app: kb-structured-data
    app.kubernetes.io/part-of: dataagent
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kb-structured-data
  namespace: dataagent-service
  labels:
    app: kb-structured-data
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kb-structured-data
  template:
    metadata:
      labels:
        app: kb-structured-data
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: kb-structured-data
        image: dataagent/kb-worker:latest
        envFrom:
        - configMapRef:
            name: dataagent-config
        - configMapRef:
            name: kb-structured-data-env
        - secretRef:
            name: kb-structured-data-secrets
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: cache
          mountPath: /cache
        - name: tmp
          mountPath: /tmp
        command:
        - python
        - -m
        - services.kb_backend.workers.structured_data.main
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: kb-structured-data-cache
      - name: tmp
        emptyDir: {}
      enableServiceLinks: false
      serviceAccountName: kb-structured-data
