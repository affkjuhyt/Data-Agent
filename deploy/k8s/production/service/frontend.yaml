apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: dataagent-service
  labels:
    app: frontend
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-env
  namespace: dataagent-service
  labels:
    app: frontend
    app.kubernetes.io/part-of: dataagent
data:
  VITE_KEYCLOAK_REALM: aeroflow
  VITE_KEYCLOAK_CLIENT: aeroflow-frontend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dataagent-service
  labels:
    app: frontend
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: frontend
        image: dataagent/frontend:latest
        ports:
        - containerPort: 8280
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8280
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 8280
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        # The built app with the install's settings (frontend/Dockerfile writes runtime/config.js
        # at start, GEN-05).
        - name: runtime-config
          mountPath: /app/dist/runtime
        # vite preview bundles vite.config.ts into node_modules/.vite-temp before it serves.
        - name: vite-temp
          mountPath: /app/node_modules/.vite-temp
        envFrom:
        - configMapRef:
            name: frontend-env
        - secretRef:
            name: frontend-secrets
        # The built app (frontend/Dockerfile), not the Vite dev server: the install's settings are
        # written to dist/runtime/config.js first (GEN-05).
        command:
        - sh
        - -c
        - node scripts/write-runtime-config.mjs && exec npm run preview -- --host 0.0.0.0 --port 8280
      volumes:
      - name: tmp
        emptyDir: {}
      - name: runtime-config
        emptyDir: {}
      - name: vite-temp
        emptyDir: {}
      enableServiceLinks: false
      serviceAccountName: frontend

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dataagent-service
  labels:
    app: frontend
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: frontend
  ports:
  - port: 8280
    targetPort: 8280
    name: http
  type: ClusterIP
