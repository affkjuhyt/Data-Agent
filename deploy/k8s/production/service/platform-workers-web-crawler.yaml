apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-workers-web-crawler
  namespace: dataagent-service
  labels:
    app: platform-workers-web-crawler
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-workers-web-crawler-env
  namespace: dataagent-service
  labels:
    app: platform-workers-web-crawler
    app.kubernetes.io/part-of: dataagent
data:
  WORKER: web-crawler
  OTEL_SERVICE_NAME: platform-workers-web-crawler
  DB_HOST: postgres.dataagent-database.svc.cluster.local
  DB_PORT: '8300'
  MINIO_BUCKET: knowledge-base
  KAFKA_SASL_USERNAME: web-crawler-worker
  POLL_INTERVAL_SECONDS: '5'
  MAX_PARALLEL_RUNS: '3'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-workers-web-crawler
  namespace: dataagent-service
  labels:
    app: platform-workers-web-crawler
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-workers-web-crawler
  template:
    metadata:
      labels:
        app: platform-workers-web-crawler
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: platform-workers-web-crawler
        image: dataagent/platform-workers:latest
        envFrom:
        - configMapRef:
            name: dataagent-config
        - configMapRef:
            name: platform-workers-web-crawler-env
        - secretRef:
            name: platform-workers-web-crawler-secrets
        resources:
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            cpu: 2000m
            memory: 3Gi
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        command:
        - python
        - -u
        - -m
        - services.platform_workers
      volumes:
      - name: tmp
        emptyDir: {}
      enableServiceLinks: false
      serviceAccountName: platform-workers-web-crawler
