---
# The egress proxy (09 §4.4): the crawler's only way out. Squid resolves each destination itself and
# refuses an internal address (private, loopback, link-local, CGNAT, multicast, reserved) by that
# resolution, which is where a crawl request through it is pinned; only ports 80 and 443, nothing
# cached, every request logged to stdout (the "log egress proxy" of AC-14-01-09, AC-14-06-04).
# Its NetworkPolicy lets only the crawler in and only this pod out to the internet (80, 443).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: egress-proxy
  namespace: dataagent-service
  labels:
    app: egress-proxy
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-proxy-config
  namespace: dataagent-service
  labels:
    app: egress-proxy
    app.kubernetes.io/part-of: dataagent
data:
  squid.conf: |
    http_port 8130
    # Destinations no request may reach, by the address the proxy itself resolved: private, loopback,
    # link-local, CGNAT, benchmark, multicast and reserved IPv4, and the IPv6 forms that carry an IPv4
    # address inside them (NAT64, 6to4, Teredo), which would otherwise reach the same hosts. Squid
    # keeps IPv4 as IPv4-mapped IPv6, so a mapped address is checked against the IPv4 ranges; listing
    # ::ffff:0:0/96 would mean all of IPv4 (Squid drops it with a warning).
    acl internal dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12
    acl internal dst 192.0.0.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4
    acl internal dst 240.0.0.0/4
    acl internal dst ::/128 ::1/128 64:ff9b::/96 100::/64 2001::/32 2002::/16
    acl internal dst fc00::/7 fe80::/10 ff00::/8
    # Any address at all: it matches only once the destination has resolved, so a name that does
    # not resolve, or a lookup that fails, falls through to the final deny instead of out.
    acl resolved dst all
    acl web_ports port 80 443
    acl tls_port port 443
    acl CONNECT method CONNECT
    http_access deny internal
    http_access deny !web_ports
    http_access deny CONNECT !tls_port
    http_access allow resolved
    http_access deny all
    # A forwarder, not a cache: nothing kept, no client address passed on.
    cache deny all
    cache_mem 0 MB
    forwarded_for delete
    # The ICMP helper needs a raw socket the pod is not given.
    pinger_enable off
    access_log stdio:/dev/stdout
    cache_log stdio:/dev/stderr
    pid_filename /tmp/squid.pid
    coredump_dir /tmp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  namespace: dataagent-service
  labels:
    app: egress-proxy
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: egress-proxy
  template:
    metadata:
      labels:
        app: egress-proxy
        app.kubernetes.io/part-of: dataagent
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 13
        runAsGroup: 13
        fsGroup: 13
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
      - name: egress-proxy
        image: docker.io/ubuntu/squid:6.6-24.04_beta
        command: ["squid", "-N", "-f", "/etc/egress-proxy/squid.conf"]
        ports:
        - containerPort: 8130
          name: proxy
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          tcpSocket:
            port: 8130
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8130
          initialDelaySeconds: 10
          periodSeconds: 30
        volumeMounts:
        - name: config
          mountPath: /etc/egress-proxy
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: run
          mountPath: /var/run
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: egress-proxy-config
      - name: tmp
        emptyDir: {}
      - name: run
        emptyDir: {}
      serviceAccountName: egress-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  namespace: dataagent-service
  labels:
    app: egress-proxy
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: egress-proxy
  ports:
  - name: proxy
    port: 8130
    targetPort: 8130
