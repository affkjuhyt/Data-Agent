# worker-ingest consumes ingest.outbox and materializes PostgreSQL source tables into workspace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-ingest
  namespace: dataagent-service
  labels:
    app: worker-ingest
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-ingest-env
  namespace: dataagent-service
  labels:
    app: worker-ingest
    app.kubernetes.io/part-of: dataagent
data:
  OTEL_SERVICE_NAME: worker-ingest
  WORKER_INGEST_POLL_SECONDS: "0.5"
  WORKER_INGEST_BATCH: "10"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ingest
  namespace: dataagent-service
  labels:
    app: worker-ingest
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker-ingest
  template:
    metadata:
      labels:
        app: worker-ingest
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: wait-for-migrations
        image: dataagent/migrate:latest
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          heads="$(python -B -m alembic -c alembic/alembic.ini heads | sed -n 's/ (head)$//p')"
          [ -n "$heads" ] || exit 1
          until python -B -c 'import os,sys,psycopg; url="postgresql://"+os.environ[sys.argv[1]].split("://",1)[1]; conn=psycopg.connect(url,connect_timeout=5,prepare_threshold=None); applied={row[0] for row in conn.execute("SELECT version_num FROM public.alembic_version")}; conn.close(); sys.exit(applied != set(sys.argv[2].split()))' DATAAGENT_DB_URL__SVC_INGEST "$heads" 2>/dev/null; do sleep 2; done
        envFrom: [{secretRef: {name: worker-ingest-secrets}}]
        resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 250m, memory: 256Mi}}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
      containers:
      - name: worker-ingest
        image: dataagent/worker-ingest:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "services.worker_ingest.main"]
        envFrom:
        - configMapRef: {name: dataagent-config}
        - configMapRef: {name: worker-ingest-env}
        - secretRef: {name: worker-ingest-secrets}
        resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {cpu: "1", memory: 512Mi}}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
      enableServiceLinks: false
      serviceAccountName: worker-ingest
