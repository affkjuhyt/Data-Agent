apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-workers-audit
  namespace: dataagent-service
  labels:
    app: platform-workers-audit
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-workers-audit-env
  namespace: dataagent-service
  labels:
    app: platform-workers-audit
    app.kubernetes.io/part-of: dataagent
data:
  WORKER: audit
  OTEL_SERVICE_NAME: platform-workers-audit
  DB_HOST: postgres.dataagent-database.svc.cluster.local
  DB_PORT: '8300'
  # NOBYPASSRLS: the worker scopes each write with app.tenant_id (common/db.set_tenant).
  DB_USER: app_user
  KAFKA_SASL_USERNAME: audit-consumer
  KAFKA_DATA_ACCESS_TOPIC: audit.data.access
  KAFKA_GROUP_ID: audit-consumer-group
  POLL_INTERVAL_SECONDS: '10'
  STATE_FILE: /state/last_event_time.txt

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audit-bridge-state
  namespace: dataagent-service
  labels:
    app: audit-bridge-state
    app.kubernetes.io/part-of: dataagent
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-workers-audit
  namespace: dataagent-service
  labels:
    app: platform-workers-audit
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-workers-audit
  template:
    metadata:
      labels:
        app: platform-workers-audit
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: platform-workers-audit
        image: dataagent/platform-workers:latest
        envFrom:
        - configMapRef:
            name: dataagent-config
        - configMapRef:
            name: platform-workers-audit-env
        - secretRef:
            name: platform-workers-audit-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: state
          mountPath: /state
        - name: tmp
          mountPath: /tmp
        command:
        - python
        - -u
        - -m
        - services.platform_workers
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: audit-bridge-state
      - name: tmp
        emptyDir: {}
      enableServiceLinks: false
      serviceAccountName: platform-workers-audit
