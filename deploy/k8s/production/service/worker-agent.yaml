# worker-agent (ADR-28): answers the questions the api records (qa.outbox question.received),
# docs/v3/06-api-v1.md §6. No port and no Service: it only reads and writes the database.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-agent
  namespace: dataagent-service
  labels:
    app: worker-agent
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-agent-env
  namespace: dataagent-service
  labels:
    app: worker-agent
    app.kubernetes.io/part-of: dataagent
data:
  OTEL_SERVICE_NAME: worker-agent
  WORKER_AGENT_POLL_SECONDS: "0.5"
  WORKER_AGENT_BATCH: "10"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-agent
  namespace: dataagent-service
  labels:
    app: worker-agent
    app.kubernetes.io/part-of: dataagent
spec:
  # Replicas may grow: outbox rows are claimed FOR UPDATE SKIP LOCKED, so two never take the same one.
  replicas: 1
  selector:
    matchLabels:
      app: worker-agent
  template:
    metadata:
      labels:
        app: worker-agent
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: wait-for-migrations
        image: dataagent/migrate:latest
        command:
        - sh
        - -c
        - |
          # Waits as svc_qa, not as the migrator: the head comes from the revision files in this
          # image (offline, no database) and the applied revision from alembic_version, which
          # db-init lets every svc_ role read. `alembic current` would need the owner's URL.
          # python -B: the root filesystem is read-only, so no bytecode is written.
          heads="$(python -B -m alembic -c alembic/alembic.ini heads | sed -n 's/ (head)$//p')"
          [ -n "$heads" ] || { echo "no alembic head in the image"; exit 1; }
          until python -B -c '
          import os, sys, psycopg
          url = "postgresql://" + os.environ[sys.argv[1]].split("://", 1)[1]
          with psycopg.connect(url, connect_timeout=5, prepare_threshold=None) as conn:
              applied = {row[0] for row in conn.execute("SELECT version_num FROM public.alembic_version")}
          sys.exit(applied != set(sys.argv[2].split()))
          ' DATAAGENT_DB_URL__SVC_QA "$heads" 2>/dev/null; do echo waiting for schema; sleep 2; done
        envFrom:
        - secretRef:
            name: worker-agent-secrets
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      containers:
      - name: worker-agent
        image: dataagent/worker-agent:latest
        command: ["python", "-m", "services.worker_agent.main"]
        envFrom:
        - configMapRef:
            name: dataagent-config
        - configMapRef:
            name: worker-agent-env
        - secretRef:
            name: worker-agent-secrets
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tmp
        emptyDir: {}
      enableServiceLinks: false
      serviceAccountName: worker-agent
---
# eval-nightly (UC-07-06): requests the nightly run of every active context eval set at 02:00
# Hà Nội time; worker-agent answers them from eval.outbox. Same image, its own account and secret
# (only the svc_eval URL). A run already started that night is not requested again
# (nightly_evals.MIN_GAP), so a retried or hand-started Job does not run a set twice.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eval-nightly
  namespace: dataagent-service
  labels:
    app: eval-nightly
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: eval-nightly
  namespace: dataagent-service
  labels:
    app: eval-nightly
    app.kubernetes.io/part-of: dataagent
spec:
  schedule: 0 2 * * *
  timeZone: Asia/Ho_Chi_Minh
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: eval-nightly
            app.kubernetes.io/part-of: dataagent
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
          containers:
          - name: eval-nightly
            image: dataagent/worker-agent:latest
            command: ["python", "-m", "services.worker_agent.nightly_evals"]
            envFrom:
            - configMapRef:
                name: dataagent-config
            - secretRef:
                name: eval-nightly-secrets
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 250m
                memory: 256Mi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              privileged: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
          volumes:
          - name: tmp
            emptyDir: {}
          enableServiceLinks: false
          serviceAccountName: eval-nightly
