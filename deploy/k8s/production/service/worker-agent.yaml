# worker-agent (ADR-28): answers the questions the api records (qa.outbox question.received),
# docs/v3/06-api-v1.md §6. No port and no Service: it only reads and writes the database.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-agent
  namespace: dataagent-service
  labels:
    app: worker-agent
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-agent-env
  namespace: dataagent-service
  labels:
    app: worker-agent
    app.kubernetes.io/part-of: dataagent
data:
  # PL-05: the port libs/metrics serves /metrics on (the Service below).
  METRICS_PORT: '8291'
  # Document answers (UC-05-04): the question is embedded by the TEI the chunks were embedded
  # with and the pool is ordered by the TEI reranker; without them retrieval is keyword-only.
  DOCUMENT_EMBED_URL: __DOCUMENT_EMBED_URL__
  DOCUMENT_RERANK_URL: __DOCUMENT_RERANK_URL__
  OTEL_SERVICE_NAME: worker-agent
  # Every schedule's clock (ADR-33, schedules/clock.py): the worker keeps the Temporal Schedules in
  # step with the data and runs their firings, the nightly eval run among them.
  TEMPORAL_ADDRESS: temporal.dataagent-service.svc.cluster.local:8380
  TEMPORAL_NAMESPACE: dataagent
  WORKER_AGENT_POLL_SECONDS: "0.5"
  # AE-01: which engine answers a question (router.py). router: one certified metric goes to the
  # governed path, the agent gets why / several metrics / documents / deep; agentic: the agent
  # first for every question (before AE-01, the rollback); governed: never the agent.
  ASK_ENGINE: router
  # PL-12: what a model call costs (turn_trace.price), in the unit the organisation's
  # max_cost_per_run is set in: a hosted model by its tokens, the models served on our GPUs ("*")
  # by the seconds a call holds the GPU. 0.0006 a second is about 2.2 an hour of a GPU.
  LLM_PRICES: '{"*": {"per_second": 0.0006}}'
  WORKER_AGENT_BATCH: "10"
  # The dynamic agent's analysis code runs in the python-sandbox pod (libs/code_sandbox):
  # off leaves the `analyze` tool out, local runs it in this pod (a trusted install only).
  AGENT_PYTHON_SANDBOX: service
  AGENT_SANDBOX_URL: http://python-sandbox.dataagent-service.svc.cluster.local:8140
  # Forecast fits run in the ml-forecast pod (libs/forecast_fit); unset, worker-agent fits in-process,
  # which its image cannot (no statsforecast): the forecast is then refused as unavailable.
  FORECAST_SERVICE_URL: http://ml-forecast.dataagent-service.svc.cluster.local:8150
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-agent
  namespace: dataagent-service
  labels:
    app: worker-agent
    app.kubernetes.io/part-of: dataagent
spec:
  # Replicas may grow: outbox rows are claimed FOR UPDATE SKIP LOCKED, so two never take the same one.
  replicas: 1
  selector:
    matchLabels:
      app: worker-agent
  template:
    metadata:
      labels:
        app: worker-agent
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: wait-for-migrations
        image: dataagent/migrate:latest
        command:
        - sh
        - -c
        - |
          # Waits as svc_qa, not as the migrator: the head comes from the revision files in this
          # image (offline, no database) and the applied revision from alembic_version, which
          # db-init lets every svc_ role read. `alembic current` would need the owner's URL.
          # python -B: the root filesystem is read-only, so no bytecode is written.
          heads="$(python -B -m alembic -c alembic/alembic.ini heads | sed -n 's/ (head)$//p')"
          [ -n "$heads" ] || { echo "no alembic head in the image"; exit 1; }
          until python -B -c '
          import os, sys, psycopg
          url = "postgresql://" + os.environ[sys.argv[1]].split("://", 1)[1]
          with psycopg.connect(url, connect_timeout=5, prepare_threshold=None) as conn:
              applied = {row[0] for row in conn.execute("SELECT version_num FROM public.alembic_version")}
          sys.exit(applied != set(sys.argv[2].split()))
          ' DATAAGENT_DB_URL__SVC_QA "$heads" 2>/dev/null; do echo waiting for schema; sleep 2; done
        envFrom:
        - secretRef:
            name: worker-agent-secrets
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      containers:
      - name: worker-agent
        image: dataagent/worker-agent:latest
        command: ["python", "-m", "services.worker_agent.main"]
        # PL-05: /metrics for Prometheus (libs/metrics); nothing else listens here.
        ports:
        - containerPort: 8291
          name: metrics
        envFrom:
        - configMapRef:
            name: dataagent-config
        - configMapRef:
            name: worker-agent-env
        - secretRef:
            name: worker-agent-secrets
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            # DF-05: a dataset version's snapshot peaks at ~180 MiB on top of the worker
            # (model/eval/snapshot-poc2.md); the request stays, so nothing more is reserved.
            memory: 768Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tmp
        emptyDir: {}
      enableServiceLinks: false
      serviceAccountName: worker-agent
---
apiVersion: v1
kind: Service
metadata:
  name: worker-agent
  namespace: dataagent-service
  labels:
    app: worker-agent
    app.kubernetes.io/part-of: dataagent
spec:
  # PL-05: Prometheus' way in; the worker serves nothing but its metrics.
  selector:
    app: worker-agent
  ports:
  - name: metrics
    port: 8291
    targetPort: 8291
