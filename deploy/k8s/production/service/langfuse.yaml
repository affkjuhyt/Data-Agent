apiVersion: v1
kind: ServiceAccount
metadata:
  name: langfuse
  namespace: dataagent-service
  labels:
    app: langfuse
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-env
  namespace: dataagent-service
  labels:
    app: langfuse
    app.kubernetes.io/part-of: dataagent
data:
  TELEMETRY_ENABLED: 'false'
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse.dataagent-database.svc.cluster.local:8371
  CLICKHOUSE_URL: http://clickhouse.dataagent-database.svc.cluster.local:8370
  CLICKHOUSE_CLUSTER_ENABLED: 'false'
  REDIS_HOST: redis.dataagent-database.svc.cluster.local
  REDIS_PORT: '8320'
  REDIS_CONNECTION_STRING: redis://redis.dataagent-database.svc.cluster.local:8320
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio.dataagent-database.svc.cluster.local:8360
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio.dataagent-database.svc.cluster.local:8360
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  AUTH_DISABLE_SIGNUP: 'true'
  LANGFUSE_INIT_ORG_ID: gtel-org
  LANGFUSE_INIT_ORG_NAME: GTEL
  LANGFUSE_INIT_PROJECT_ID: data-agent-proj
  LANGFUSE_INIT_PROJECT_NAME: data-agent
  LANGFUSE_INIT_USER_NAME: Admin
  PORT: '8420'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse
  namespace: dataagent-service
  labels:
    app: langfuse
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse
  template:
    metadata:
      labels:
        app: langfuse
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: langfuse
        image: docker.io/langfuse/langfuse:3
        ports:
        - containerPort: 8420
          name: http
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            # Memory reverted to 2Gi: 1Gi OOM-killed Langfuse's Next.js
            # server on startup ("JavaScript heap out of memory") every
            # time, leaving a permanently crash-looping pod behind a stuck
            # rollout — the trace-viewer UI hit that pod ~half the time via
            # round-robin, which is what made it "cực kỳ chậm". CPU stays
            # halved (that wasn't the crash cause and it's off the request
            # path); headroom goes to kong/workflow-runtime/model-service.
            cpu: 500m
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /api/public/health
            port: 8420
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/public/health
            port: 8420
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: langfuse-env
        - secretRef:
            name: langfuse-secrets
      volumes:
      - name: tmp
        emptyDir: {}
      enableServiceLinks: false
      serviceAccountName: langfuse

---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: dataagent-service
  labels:
    app: langfuse
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: langfuse
  ports:
  - port: 8420
    targetPort: 8420
    name: http
  type: ClusterIP
