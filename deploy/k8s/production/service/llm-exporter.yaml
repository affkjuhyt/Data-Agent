apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-exporter
  namespace: dataagent-service
  labels:
    app: llm-exporter
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-exporter-env
  namespace: dataagent-service
  labels:
    app: llm-exporter
    app.kubernetes.io/part-of: dataagent
data:
  LLM_MODEL: agent-main
  PROBE_INTERVAL: '30'
  PROBE_CONCURRENCY: '3'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-exporter
  namespace: dataagent-service
  labels:
    app: llm-exporter
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-exporter
  template:
    metadata:
      labels:
        app: llm-exporter
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: llm-exporter
        image: dataagent/llm_exporter:latest
        ports:
        - containerPort: 8270
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /metrics
            port: 8270
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /metrics
            port: 8270
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: llm-exporter-env
        command:
        - uvicorn
        - exporter:app
        - --host
        - 0.0.0.0
        - --port
        - '8270'
      volumes:
      - name: tmp
        emptyDir: {}
      enableServiceLinks: false
      serviceAccountName: llm-exporter

---
apiVersion: v1
kind: Service
metadata:
  name: llm-exporter
  namespace: dataagent-service
  labels:
    app: llm-exporter
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: llm-exporter
  ports:
  - port: 8270
    targetPort: 8270
    name: metrics
  type: ClusterIP
