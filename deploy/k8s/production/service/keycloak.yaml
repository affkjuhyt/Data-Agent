apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: dataagent-service
  labels:
    app: keycloak
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-env
  namespace: dataagent-service
  labels:
    app: keycloak
    app.kubernetes.io/part-of: dataagent
data:
  KC_DB: postgres
  # Same class of bug as KONG_PG_USER: unset, Keycloak defaults to
  # connecting as role "keycloak", which doesn't exist — only "admin" does.
  KC_DB_USERNAME: admin
  KC_DB_URL: jdbc:postgresql://postgres.dataagent-database.svc.cluster.local:8300/dataagent
  KC_DB_SCHEMA: keycloak
  KC_HTTP_ENABLED: 'true'
  KC_HOSTNAME_STRICT: 'false'
  KC_PROXY: edge
  KC_HEALTH_ENABLED: 'true'
  KC_CACHE: ispn
  KC_CACHE_STACK: kubernetes
  JAVA_OPTS_APPEND: -Djgroups.dns.query=keycloak.dataagent.svc.cluster.local
  JAVA_OPTS_KC_HEAP: -Xms512m -Xmx1g
  KC_HTTP_PORT: '8110'
  KC_HTTP_MANAGEMENT_PORT: '8111'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: dataagent-service
  labels:
    app: keycloak
    app.kubernetes.io/part-of: dataagent
spec:
  # JGroups/Infinispan clustering (session + authorization-code replication
  # across replicas) requires working pod discovery (DNS_PING/KUBE_PING).
  # On this cluster it silently fails — both pods log "no members
  # discovered... creating cluster as coordinator" and each forms its own
  # isolated 1-node cluster. With 2 replicas behind a non-sticky
  # ClusterIP/NodePort, the authorization code issued by pod A during
  # /auth is invisible to pod B, so a token exchange landing on the other
  # pod 400s with invalid_grant. Single physical node anyway (no real HA
  # from 2 replicas on the same node) — pin to 1 until clustering is
  # actually fixed.
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: keycloak
        # Built from deploy/docker/keycloak/Dockerfile — `kc.sh build --db=postgres`
        # baked in, so --optimized below can skip re-augmenting (and writing
        # to /opt/keycloak) at every boot under readOnlyRootFilesystem.
        image: dataagent/keycloak:latest
        imagePullPolicy: IfNotPresent
        args:
        - start
        - --optimized
        - --import-realm
        ports:
        - containerPort: 8110
          name: http
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1Gi
        readinessProbe:
          httpGet:
            # Keycloak 24.0.5 never actually opens the separate management
            # port (8111) despite KC_HEALTH_ENABLED=true baked in at image
            # build time — health endpoints are served on the main port here.
            path: /health/ready
            port: 8110
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            # Keycloak 24.0.5 never actually opens the separate management
            # port (8111) despite KC_HEALTH_ENABLED=true baked in at image
            # build time — health endpoints are served on the main port here.
            path: /health/ready
            port: 8110
          initialDelaySeconds: 90
          periodSeconds: 20
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: realm
          mountPath: /opt/keycloak/data/import
          readOnly: true
        - name: kcdata
          mountPath: /opt/keycloak/data/tmp
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: keycloak-env
        - secretRef:
            name: keycloak-secrets
      volumes:
      - name: realm
        configMap:
          name: keycloak-realm
      - name: kcdata
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      enableServiceLinks: false
      serviceAccountName: keycloak

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: dataagent-service
  labels:
    app: keycloak
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: keycloak
  ports:
  - port: 8110
    targetPort: 8110
    nodePort: 30110
    name: http
  - port: 8111
    targetPort: 8111
    name: health
  # Browsers need to reach Keycloak directly for the login redirect —
  # single-node appliance mode, no ingress controller — see kong.yaml.
  type: NodePort
