apiVersion: v1
kind: ConfigMap
metadata:
  name: dataagent-config
  namespace: dataagent-service
  labels:
    app.kubernetes.io/part-of: dataagent
data:
  #Postgres
  POSTGRES_DB: dataagent
  POSTGRES_USER: admin
  POSTGRES_HOST: postgres.dataagent-database.svc.cluster.local

  #Mongo
  MONGODB_URL: mongodb://mongo.dataagent-database.svc.cluster.local:8310/dataagent
  MONGO_URL: mongodb://mongo.dataagent-database.svc.cluster.local:8310/dataagent

  #Redis
  REDIS_URL: redis://redis.dataagent-database.svc.cluster.local:8320

  #Qdrant
  QDRANT_URL: http://qdrant.dataagent-database.svc.cluster.local:8330

  #Neo4j
  NEO4J_URI: bolt://neo4j.dataagent-database.svc.cluster.local:8341
  NEO4J_URL: bolt://neo4j.dataagent-database.svc.cluster.local:8341

  #Minio
  MINIO_ENDPOINT: http://minio.dataagent-database.svc.cluster.local:8360
  MINIO_BUCKET: knowledge-base

  #Openbao
  OPENBAO_ADDR: http://openbao.dataagent-database.svc.cluster.local:8120

  #Kafka
  KAFKA_BOOTSTRAP_SERVERS: kafka.dataagent-database.svc.cluster.local:8350
  KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
  KAFKA_SASL_MECHANISM: PLAIN
  KAFKA_URL: kafka.dataagent-database.svc.cluster.local:8352

  #Litellm
  LITELLM_BASE_URL: http://litellm.dataagent-service.svc.cluster.local:8500

  #Model Service
  MODEL_SERVICE_URL: http://model-service.dataagent-service.svc.cluster.local:8230

  #Workflow Run Time
  WORKFLOW_RUNTIME_URL: http://workflow-runtime.dataagent-service.svc.cluster.local:8240

  #Sandbox-executor
  SANDBOX_EXECUTOR_URL: http://sandbox-executor.dataagent-service.svc.cluster.local:8260

  #Knowledge-Base
  KB_ENDPOINT: http://kb-backend.dataagent-service.svc.cluster.local:8220

  #Kong
  KONG_ADMIN_URL: http://kong-admin.dataagent-service.svc.cluster.local:8101

  #KeyCloak
  KEYCLOAK_URL: http://keycloak.dataagent-service.svc.cluster.local:8110
  KC_URL: http://keycloak.dataagent-service.svc.cluster.local:8110
  # kong-setup.sh builds the aeroflow-jwks plugin's jwks_uri from this var,
  # separately from KEYCLOAK_URL above — its fallback default is the short
  # name keycloak on 8080, Keycloak's stock port. The Service exposes Keycloak
  # on 8110/8111 only (service/keycloak.yaml), no 8080 at all — without this
  # override every JWT-verified route 503s with "JWKS unavailable:
  # connection refused" the moment Kong's cached JWKS entry expires.
  KEYCLOAK_NETWORK_URL: http://keycloak.dataagent-service.svc.cluster.local:8110
  KEYCLOAK_REALM: aeroflow
  KC_REALM: aeroflow

  # kong-setup.sh's Kong-upstream host fields for these 3 services default
  # to the backend/services/<name> directory names (underscores). k8s
  # Service objects can't contain underscores (DNS-1035), so the Services
  # are named with hyphens — override here so Kong's upstream DNS lookup resolves.
  # Without this, JWT/CORS checks can pass fine (they don't touch the
  # upstream) but the request 503s the moment Kong actually proxies it.
  WORKFLOW_RUNTIME_HOST: workflow-runtime
  AUTH_API_HOST: auth-api
  API_HOST: api

  #Langfuse
  LANGFUSE_HOST: http://langfuse.dataagent-service.svc.cluster.local:8420

  #Otel / Jaeger
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger.dataagent-service.svc.cluster.local:8431
  OTEL_SDK_DISABLED: 'false'

  #LLM
  REMOTE_EMBED_URL: http://10.10.55.101:8003
  REMOTE_RERANK_URL: http://10.10.55.101:8004
  REMOTE_LLM_URL: http://10.10.55.101:8002
  REMOTE_LLM_MODEL: agent-fast
  EMBEDDING_DIM: '1024'
  RUNTIME_ALLOWED_SERVICES: ''

  #Others
  KB_ALLOWED_SERVICES: workflow_runtime

---
