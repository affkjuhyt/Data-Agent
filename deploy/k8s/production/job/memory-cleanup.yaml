---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: memory-cleanup
  namespace: dataagent-service
  labels:
    app: memory-cleanup
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: memory-cleanup-env
  namespace: dataagent-service
  labels:
    app: memory-cleanup
    app.kubernetes.io/part-of: dataagent
data:
  MEMORY_RETENTION_DAYS: '90'
  MEMORY_CLEANUP_BATCH_SIZE: '1000'
---
# Daily retention for agent memory: hard-deletes AgentMemories tombstones and
# expired rows, expires EpisodicMemory and archives the lowest-importance rows
# over each (tenant, domain)'s MemoryRetentionConfig cap. The tables use FORCE
# ROW LEVEL SECURITY per tenant, so DATABASE_URL must be a role that bypasses
# RLS (the same admin role workflow-runtime uses); with an RLS-bound role every
# DELETE matches nothing and the job "succeeds" without cleaning anything.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: memory-cleanup
  namespace: dataagent-service
  labels:
    app: memory-cleanup
    app.kubernetes.io/part-of: dataagent
spec:
  schedule: 30 3 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: memory-cleanup
            app.kubernetes.io/part-of: dataagent
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
          containers:
          - name: memory-cleanup
            image: dataagent/workflow_runtime:latest
            command:
            - python
            - services/workflow_runtime/jobs/memory_cleanup.py
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              privileged: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            envFrom:
            - configMapRef:
                name: memory-cleanup-env
            - secretRef:
                name: memory-cleanup-secrets
          volumes:
          - name: tmp
            emptyDir: {}
          enableServiceLinks: false
          serviceAccountName: memory-cleanup
