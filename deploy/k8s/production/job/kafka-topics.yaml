apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-topics
  namespace: dataagent-service
  labels:
    app: kafka-topics
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-topics-env
  namespace: dataagent-service
  labels:
    app: kafka-topics
    app.kubernetes.io/part-of: dataagent
data:
  INGEST_PARTITIONS: '3'

---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: dataagent-service
  labels:
    app: kafka-topics
    app.kubernetes.io/part-of: dataagent
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: kafka-topics
        app.kubernetes.io/part-of: dataagent
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - name: kafka-topics
        image: apache/kafka:3.7.0
        command:
        - bash
        - -c
        - |
          # INTERNAL:8352 has no SASL — those connections are ANONYMOUS, and
          # KAFKA_SUPER_USERS (kafka.yaml) lists User:ANONYMOUS as a
          # superuser, so this Job gets full admin rights (topic + ACL
          # management) here without needing any broker credentials.
          B=kafka.dataagent-database.svc.cluster.local:8352
          KT=/opt/kafka/bin/kafka-topics.sh
          KA=/opt/kafka/bin/kafka-acls.sh

          until $KT --bootstrap-server "$B" --list >/dev/null 2>&1; do echo waiting for kafka; sleep 3; done

          for t in kb.promote.silver kb.promote.gold kb.structured.propose; do
            $KT --bootstrap-server "$B" --create --if-not-exists --topic "$t" --partitions "$INGEST_PARTITIONS" --replication-factor 1
            $KT --bootstrap-server "$B" --alter --topic "$t" --partitions "$INGEST_PARTITIONS" || true
          done

          # Ported from deploy/docker/kafka/kafka-setup.sh — same topics +
          # ACLs the docker-compose deployment sets up, missing here until
          # now (workflow_runtime's audit.data.access WRITE has no ACL grant
          # otherwise: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND is 'false', so
          # the produce silently stalls — metadata refresh keeps retrying
          # the authorization failure instead of raising it — until the
          # client's own 60s timeout, taking the whole request down with it).
          $KT --bootstrap-server "$B" --create --if-not-exists --topic audit.data.access --partitions 6 --replication-factor 1 --config retention.ms=7776000000 --config cleanup.policy=delete
          $KT --bootstrap-server "$B" --create --if-not-exists --topic memory.extraction.requested --partitions 3 --replication-factor 1 --config retention.ms=604800000 --config cleanup.policy=delete
          $KT --bootstrap-server "$B" --create --if-not-exists --topic memory.extraction.dlq --partitions 1 --replication-factor 1 --config retention.ms=2592000000 --config cleanup.policy=delete
          $KT --bootstrap-server "$B" --create --if-not-exists --topic ddl.changes --partitions 3 --replication-factor 1 --config retention.ms=604800000 --config cleanup.policy=delete

          $KA --bootstrap-server "$B" --add --allow-principal User:workflow_runtime --operation Write --operation Describe --topic audit.data.access
          $KA --bootstrap-server "$B" --add --allow-principal User:audit-consumer --operation Read --operation Describe --topic audit.data.access
          $KA --bootstrap-server "$B" --add --allow-principal User:audit-consumer --operation Read --group audit-consumer-group

          # Release management was removed. --create/--add above are idempotent and
          # never undo an earlier run, so drop its topics and every ACL on them (and
          # on its consumer group) explicitly; both are no-ops once they are gone.
          for t in release.pipeline.triggered release.pipeline.status release.rollback.initiated; do
            $KT --bootstrap-server "$B" --delete --if-exists --topic "$t"
            $KA --bootstrap-server "$B" --remove --force --topic "$t"
          done
          $KA --bootstrap-server "$B" --remove --force --group release_worker-group

          $KA --bootstrap-server "$B" --add --allow-principal User:workflow_runtime --operation Write --operation Describe --topic memory.extraction.requested
          $KA --bootstrap-server "$B" --add --allow-principal User:memory-consumer --operation Read --operation Describe --topic memory.extraction.requested
          $KA --bootstrap-server "$B" --add --allow-principal User:memory-consumer --operation Write --operation Describe --topic memory.extraction.dlq
          $KA --bootstrap-server "$B" --add --allow-principal User:memory-consumer --operation Read --group memory-consumer-group

          $KA --bootstrap-server "$B" --add --allow-principal User:schema-crawler-worker --operation Read --operation Describe --topic ddl.changes
          $KA --bootstrap-server "$B" --add --allow-principal User:schema-crawler-worker --operation Read --group schema-crawler-worker-group
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: kafka-topics-env
      volumes:
      - name: tmp
        emptyDir: {}
      enableServiceLinks: false
      serviceAccountName: kafka-topics
