apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-topics
  namespace: dataagent-service
  labels:
    app: kafka-topics
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-topics-env
  namespace: dataagent-service
  labels:
    app: kafka-topics
    app.kubernetes.io/part-of: dataagent
data: {}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: dataagent-service
  labels:
    app: kafka-topics
    app.kubernetes.io/part-of: dataagent
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: kafka-topics
        app.kubernetes.io/part-of: dataagent
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - name: kafka-topics
        image: apache/kafka:3.7.0
        command:
        - bash
        - -c
        - |
          # INTERNAL:8352 has no SASL — those connections are ANONYMOUS, and
          # KAFKA_SUPER_USERS (kafka.yaml) lists User:ANONYMOUS as a
          # superuser, so this Job gets full admin rights (topic + ACL
          # management) here without needing any broker credentials.
          B=kafka.dataagent-database.svc.cluster.local:8352
          KT=/opt/kafka/bin/kafka-topics.sh
          KA=/opt/kafka/bin/kafka-acls.sh

          until $KT --bootstrap-server "$B" --list >/dev/null 2>&1; do echo waiting for kafka; sleep 3; done

          # The legacy knowledge base (kb-backend, kb-worker, web-crawler) was removed (KB-08): drop its
          # topics and every ACL on them; no-ops once they are gone.
          for t in kb.promote.silver kb.promote.gold kb.structured.propose kb.resolve.conflict kb.ingestion.dlq; do
            $KT --bootstrap-server "$B" --delete --if-exists --topic "$t"
            $KA --bootstrap-server "$B" --remove --force --topic "$t"
          done

          # The platform workers (audit, memory, schema-crawler) and workflow-runtime, the only
          # clients of these topics, were removed: drop the topics, every ACL on them and the
          # consumer groups; no-ops once they are gone.
          for t in audit.data.access memory.extraction.requested memory.extraction.dlq ddl.changes; do
            $KT --bootstrap-server "$B" --delete --if-exists --topic "$t"
            $KA --bootstrap-server "$B" --remove --force --topic "$t"
          done
          for g in audit-consumer-group memory-consumer-group schema-crawler-worker-group; do
            $KA --bootstrap-server "$B" --remove --force --group "$g"
          done

          # Release management was removed. Drop its topics and every ACL on them (and
          # on its consumer group) explicitly; both are no-ops once they are gone.
          for t in release.pipeline.triggered release.pipeline.status release.rollback.initiated; do
            $KT --bootstrap-server "$B" --delete --if-exists --topic "$t"
            $KA --bootstrap-server "$B" --remove --force --topic "$t"
          done
          $KA --bootstrap-server "$B" --remove --force --group release_worker-group
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: kafka-topics-env
      volumes:
      - name: tmp
        emptyDir: {}
      serviceAccountName: kafka-topics
