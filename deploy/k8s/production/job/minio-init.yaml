apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio-init
  namespace: dataagent-service
  labels:
    app: minio-init
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-init-env
  namespace: dataagent-service
  labels:
    app: minio-init
    app.kubernetes.io/part-of: dataagent
data:
  MINIO_BUCKETS: langfuse sandbox-audit da-results da-exports da-ingest da-raw-docs da-doc-derived
  # Raw is immutable (S2-02, ADR-V2-21): object lock, settable only at bucket creation.
  # COMPLIANCE: no one, root included, deletes an object before its retention ends.
  RAW_RETENTION_MODE: COMPLIANCE
  RAW_RETENTION_DAYS: '3650'
  MC_CONFIG_DIR: /tmp/mc

---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: dataagent-service
  labels:
    app: minio-init
    app.kubernetes.io/part-of: dataagent
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: minio-init
        app.kubernetes.io/part-of: dataagent
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - name: minio-init
        image: bitnamilegacy/minio:2024.12.18-debian-12-r0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          export PATH="/opt/bitnami/minio-client/bin:$PATH"
          until mc alias set local http://minio.dataagent-database.svc.cluster.local:8360 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do echo waiting for minio; sleep 2; done
          for b in $MINIO_BUCKETS; do mc mb --ignore-existing "local/$b"; done
          # BR-86: an answer export is downloadable for 24 hours; the file does not outlive it.
          mc ilm rule add --expire-days 1 local/da-exports >/dev/null 2>&1 || mc ilm rule ls local/da-exports
          # worker-agent's own user: PutObject on da-exports (the other grants follow); it never holds root.
          printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject"],"Resource":["arn:aws:s3:::da-exports/*"]}]}' > /tmp/worker-agent-exports.json
          mc admin policy create local worker-agent-exports /tmp/worker-agent-exports.json
          # Upload analysis runs as worker-agent and must read the immutable upload object.
          # Keep this separate from the export policy so the worker cannot write or delete uploads.
          printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::da-ingest/*"]}]}' > /tmp/worker-agent-ingest.json
          mc admin policy create local worker-agent-ingest-v1 /tmp/worker-agent-ingest.json
          mc admin user add local worker-agent "$WORKER_AGENT_MINIO_PASSWORD"
          mc admin policy attach local worker-agent-exports --user worker-agent || mc admin user info local worker-agent
          mc admin policy attach local worker-agent-ingest-v1 --user worker-agent || mc admin user info local worker-agent
          # Session report drafts (worker_agent/session_reports.py) go under session-reports/ of
          # da-results, which the api reads and serves; the worker writes them and never reads one.
          printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject"],"Resource":["arn:aws:s3:::da-results/session-reports/*"]}]}' > /tmp/worker-agent-reports.json
          mc admin policy create local worker-agent-reports /tmp/worker-agent-reports.json
          mc admin policy attach local worker-agent-reports --user worker-agent || mc admin user info local worker-agent
          # UC-10-02 / AC-10-02-07: a period's snapshot cannot be deleted or rewritten before its
          # retention ends; worker-agent may add files there and nothing else.
          mc mb --ignore-existing --with-lock local/da-period-close
          mc retention set --default "$RAW_RETENTION_MODE" "${RAW_RETENTION_DAYS}d" local/da-period-close
          printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject"],"Resource":["arn:aws:s3:::da-period-close/*"]}]}' > /tmp/worker-agent-period.json
          mc admin policy create local worker-agent-period-v1 /tmp/worker-agent-period.json
          mc admin policy attach local worker-agent-period-v1 --user worker-agent || mc admin user info local worker-agent
          mc mb --ignore-existing --with-lock local/raw
          # BR-150: crawled originals are immutable and kept 400 days (crawl_page.retain_until).
          mc mb --ignore-existing --with-lock local/da-raw-crawl
          mc retention set --default "$RAW_RETENTION_MODE" 400d local/da-raw-crawl
          # The crawler's own user: it stores and re-reads originals, it never deletes one.
          printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject","s3:GetObject"],"Resource":["arn:aws:s3:::da-raw-crawl/*"]}]}' > /tmp/crawler-raw.json
          mc admin policy create local crawler-raw /tmp/crawler-raw.json
          mc admin user add local crawler "$CRAWLER_MINIO_PASSWORD"
          mc admin policy attach local crawler-raw --user crawler || mc admin user info local crawler
          mc retention set --default "$RAW_RETENTION_MODE" "${RAW_RETENTION_DAYS}d" local/raw
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: minio-init-env
        - secretRef:
            name: minio-init-secrets
      volumes:
      - name: tmp
        emptyDir: {}
      serviceAccountName: minio-init
