apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio-init
  namespace: dataagent-service
  labels:
    app: minio-init
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-init-env
  namespace: dataagent-service
  labels:
    app: minio-init
    app.kubernetes.io/part-of: dataagent
data:
  MINIO_BUCKETS: knowledge-base langfuse sandbox-audit
  MC_CONFIG_DIR: /tmp/mc

---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: dataagent-service
  labels:
    app: minio-init
    app.kubernetes.io/part-of: dataagent
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: minio-init
        app.kubernetes.io/part-of: dataagent
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - name: minio-init
        image: minio/mc
        command:
        - sh
        - -c
        - |
          until mc alias set local http://minio.dataagent-database.svc.cluster.local:8360 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do echo waiting for minio; sleep 2; done
          for b in $MINIO_BUCKETS; do mc mb --ignore-existing "local/$b"; done
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: minio-init-env
        - secretRef:
            name: minio-init-secrets
      volumes:
      - name: tmp
        emptyDir: {}
      serviceAccountName: minio-init
