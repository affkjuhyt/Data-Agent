  labels:
    app.kubernetes.io/part-of: dataagent
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
  - Ingress
  ingress:
  - from:
    # V3 blocks (KB-02).
    - podSelector:
        matchLabels:
          app: api
    ports:
    - protocol: TCP
      port: 8400

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  namespace: dataagent-service
  labels:
    app.kubernetes.io/part-of: dataagent
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: kong
    ports:
    - protocol: TCP
      port: 8280
  # frontend is also NodePort (30280, see service/frontend.yaml) on this
  # single-node cluster — browsers load the UI directly, not through Kong.
  # No `from` = all sources, same pattern as allow-ingress-controller-to-kong.
  - ports:
    - protocol: TCP
      port: 8280

