apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: dataagent-service
  labels:
    app.kubernetes.io/part-of: dataagent
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: dataagent-service
  labels:
    app.kubernetes.io/part-of: dataagent
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-platform
  namespace: dataagent-service
  labels:
    app.kubernetes.io/part-of: dataagent
spec:
  # Every pod but the egress proxy: NetworkPolicies only add, so this would hand the proxy the
  # whole cluster and its own policy's "internal ranges excepted" would hold nothing back.
  podSelector:
    matchExpressions:
    - key: app
      operator: NotIn
      values: [egress-proxy]
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: dataagent-service
    - namespaceSelector:
        matchLabels:
          name: dataagent-database

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kong
  namespace: dataagent-service
  labels:
    app.kubernetes.io/part-of: dataagent
spec:
  podSelector:
    matchLabels:
      app: kong
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    - podSelector:
        matchLabels:
          app: kong-migration
    - podSelector:
        matchLabels:
          app: setup
    ports:
    - protocol: TCP
      port: 8100

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak
  namespace: dataagent-service
  labels:
    app.kubernetes.io/part-of: dataagent
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: kong
    - podSelector:
        matchLabels:
          app: frontend
    - podSelector:
        matchLabels:
          app: setup
    # V3 blocks (KB-02).
    - podSelector:
        matchLabels:
          app: api
    ports:
    - protocol: TCP
      port: 8110
  # keycloak is also NodePort (30110, see service/keycloak.yaml) on this
  # single-node cluster — no ingress controller to front it, and the browser
  # needs to reach it directly for the login redirect. No `from` = all
  # sources, same pattern as allow-ingress-controller-to-kong.
  - ports:
    - protocol: TCP
      port: 8110
    - protocol: TCP
      port: 8111

