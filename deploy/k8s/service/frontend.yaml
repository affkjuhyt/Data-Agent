apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: dataagent-service
  labels:
    app: frontend
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-env
  namespace: dataagent-service
  labels:
    app: frontend
    app.kubernetes.io/part-of: dataagent
data:
  VITE_KEYCLOAK_REALM: aeroflow
  VITE_KEYCLOAK_CLIENT: aeroflow-frontend
  # frontend/vite.config.ts's hmr.clientPort — this pod is reached at this
  # NodePort (service/frontend.yaml), not the :8280 vite listens on inside
  # the container; without this the HMR websocket tries the wrong port and
  # the browser can never reach it.
  VITE_HMR_CLIENT_PORT: '30280'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dataagent-service
  labels:
    app: frontend
    app.kubernetes.io/part-of: dataagent
spec:
  # `vite preview` serves a static, already-built dist/ — no per-process
  # module graph like the dev server has, so unlike that server this is safe
  # to scale past 1 replica behind the Service's plain round-robin (every
  # replica serves byte-identical files from the same image).
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: frontend
        image: dataagent/frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8280
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8280
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 8280
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        # vite preview writes here; the root filesystem is read-only.
        - name: vite-temp
          mountPath: /app/node_modules/.vite-temp
        envFrom:
        - configMapRef:
            name: frontend-env
        - secretRef:
            name: frontend-secrets
        command:
        - npm
        - run
        - preview
        - --
        - --host
        - 0.0.0.0
        - --port
        - '8280'
      volumes:
      - name: tmp
        emptyDir: {}
      - name: vite-temp
        emptyDir: {}
      serviceAccountName: frontend

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dataagent-service
  labels:
    app: frontend
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: frontend
  ports:
  - port: 8280
    targetPort: 8280
    nodePort: 30280
    name: http
  # Single-node appliance mode, no ingress controller — see kong.yaml.
  type: NodePort
