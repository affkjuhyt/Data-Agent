apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-api
  namespace: dataagent-service
  labels:
    app: auth-api
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-api-env
  namespace: dataagent-service
  labels:
    app: auth-api
    app.kubernetes.io/part-of: dataagent
data:
  OTEL_SERVICE_NAME: auth-api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: dataagent-service
  labels:
    app: auth-api
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: auth-api
        image: dataagent/auth_api:latest
        ports:
        - containerPort: 8200
          name: http
        envFrom:
        - configMapRef:
            name: dataagent-config
        - configMapRef:
            name: auth-api-env
        - secretRef:
            name: auth-api-secrets
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /api/auth/health
            port: 8200
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/auth/health
            port: 8200
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        command:
        - uvicorn
        - main:app
        - --host
        - 0.0.0.0
        - --port
        - '8200'
      volumes:
      - name: tmp
        emptyDir: {}
      serviceAccountName: auth-api

---
apiVersion: v1
kind: Service
metadata:
  name: auth-api
  namespace: dataagent-service
  labels:
    app: auth-api
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: auth-api
  ports:
  - port: 8200
    targetPort: 8200
    name: http
  type: ClusterIP
