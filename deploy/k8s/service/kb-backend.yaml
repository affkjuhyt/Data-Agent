apiVersion: v1
kind: ServiceAccount
metadata:
  name: kb-backend
  namespace: dataagent-service
  labels:
    app: kb-backend
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kb-backend-env
  namespace: dataagent-service
  labels:
    app: kb-backend
    app.kubernetes.io/part-of: dataagent
data:
  OTEL_SERVICE_NAME: kb-backend
  UVICORN_WORKERS: '4'
  QDRANT_PASS1_LIMIT: '3'
  QDRANT_PASS2_LIMIT: '2'
  RRF_TOP_N: '20'
  RERANK_TOP_N: '5'
  NEO4J_MAX_HOPS: '1'
  NEO4J_MAX_NEIGHBOURS: '5'
  DEGRADE_BUDGET_MS: '0'
  DOC_NARROWING: '1'
  DOC_PASS_TOP_M: '3'
  DOC_PASS_CHUNK_LIMIT: '5'
  QUERY_ALIAS_RESOLVE: '1'
  TYPE_AWARE: '1'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kb-backend
  namespace: dataagent-service
  labels:
    app: kb-backend
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kb-backend
  template:
    metadata:
      labels:
        app: kb-backend
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: kb-backend
        image: dataagent/kb-backend:latest
        ports:
        - containerPort: 8220
          name: http
        envFrom:
        - configMapRef:
            name: dataagent-config
        - configMapRef:
            name: kb-backend-env
        - secretRef:
            name: kb-backend-secrets
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /health
            port: 8220
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8220
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        command:
        - sh
        - -c
        - exec uvicorn services.kb_backend.main:app --host 0.0.0.0 --port 8220 --workers "${UVICORN_WORKERS:-1}"
          --log-level info
      volumes:
      - name: tmp
        emptyDir: {}
      serviceAccountName: kb-backend

---
apiVersion: v1
kind: Service
metadata:
  name: kb-backend
  namespace: dataagent-service
  labels:
    app: kb-backend
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: kb-backend
  ports:
  - port: 8220
    targetPort: 8220
    name: http
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kb-backend
  namespace: dataagent-service
  labels:
    app: kb-backend
    app.kubernetes.io/part-of: dataagent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kb-backend
  minReplicas: 3
  maxReplicas: 12
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
