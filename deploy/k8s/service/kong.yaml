apiVersion: v1
kind: ServiceAccount
metadata:
  name: kong
  namespace: dataagent-service
  labels:
    app: kong
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-env
  namespace: dataagent-service
  labels:
    app: kong
    app.kubernetes.io/part-of: dataagent
data:
  KONG_DATABASE: postgres
  KONG_PG_HOST: postgres.dataagent-database.svc.cluster.local
  KONG_PG_PORT: '8300'
  KONG_PG_SCHEMA: kong
  KONG_PG_USER: admin
  KONG_PG_DATABASE: dataagent
  KONG_PROXY_ACCESS_LOG: /dev/stdout
  KONG_ADMIN_ACCESS_LOG: /dev/stdout
  KONG_PROXY_ERROR_LOG: /dev/stderr
  KONG_ADMIN_ERROR_LOG: /dev/stderr
  KONG_ADMIN_LISTEN: 0.0.0.0:8101
  KONG_PROXY_LISTEN: 0.0.0.0:8100
  KONG_PLUGINS: bundled,aeroflow-jwks
  KONG_MEM_CACHE_SIZE: 128m
  # Unset, Kong defaults nginx worker_processes to the NODE's CPU count (32
  # here), not the pod's cpu limit ('1') — 32 workers x 128m cache alone is
  # multiple GB, which is what was actually OOMKilling this pod, not a too-low
  # memory limit.
  KONG_NGINX_WORKER_PROCESSES: '2'
  KONG_PREFIX: /kong_prefix

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: dataagent-service
  labels:
    app: kong
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: kong
        image: dataagent/kong:latest
        ports:
        - containerPort: 8100
          name: proxy
        - containerPort: 8101
          name: admin
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: '1'
            # 512Mi OOMKilled it under KONG_MEM_CACHE_SIZE=128m + the Lua VM
            # + nginx workers overhead.
            memory: 768Mi
        readinessProbe:
          httpGet:
            path: /status
            port: 8101
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /status
            port: 8101
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: prefix
          mountPath: /kong_prefix
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: kong-env
        - secretRef:
            name: kong-secrets
      volumes:
      - name: prefix
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      serviceAccountName: kong

---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: dataagent-service
  labels:
    app: kong
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: kong
  ports:
  - port: 8100
    targetPort: 8100
    nodePort: 30100
    name: proxy
  # No ingress controller on this single-node cluster (traefik/servicelb are
  # disabled — see deploy/k8s/install-k3s.sh) and deploy/k8s/README.md leaves
  # ingress cluster-specific on purpose. NodePort is the appliance-mode
  # equivalent: reachable at http://<node-ip>:30100.
  type: NodePort

---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: dataagent-service
  labels:
    app: kong-admin
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: kong
  ports:
  - port: 8101
    targetPort: 8101
    name: admin
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kong
  namespace: dataagent-service
  labels:
    app: kong
    app.kubernetes.io/part-of: dataagent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kong
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
