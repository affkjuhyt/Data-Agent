apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow-runtime
  namespace: dataagent-service
  labels:
    app: workflow-runtime
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-runtime-env
  namespace: dataagent-service
  labels:
    app: workflow-runtime
    app.kubernetes.io/part-of: dataagent
data:
  OTEL_SERVICE_NAME: workflow-runtime
  KAFKA_SASL_USERNAME: workflow_runtime
  ORCHESTRATOR_MAX_CONCURRENT_TURNS: '8'
  MTLS_CLIENT_CERT: ''
  MTLS_CLIENT_KEY: ''
  MTLS_CA_CERT: ''

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-runtime
  namespace: dataagent-service
  labels:
    app: workflow-runtime
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workflow-runtime
  template:
    metadata:
      labels:
        app: workflow-runtime
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: workflow-runtime
        image: dataagent/workflow_runtime:latest
        ports:
        - containerPort: 8240
          name: http
        envFrom:
        - configMapRef:
            name: dataagent-config
        - configMapRef:
            name: workflow-runtime-env
        - secretRef:
            name: workflow-runtime-secrets
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /health
            port: 8240
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8240
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: tmp
          mountPath: /tmp
        command:
        - uvicorn
        - main:app
        - --host
        - 0.0.0.0
        - --port
        - '8240'
      initContainers:
      - name: wait-for-migrations
        image: dataagent/migrate:latest
        command:
        - sh
        - -c
        - until alembic -c alembic/alembic.ini current 2>/dev/null | grep -q '(head)'; do echo waiting
          for schema; sleep 5; done
        envFrom:
        - secretRef:
            name: workflow-runtime-secrets
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      serviceAccountName: workflow-runtime

---
apiVersion: v1
kind: Service
metadata:
  name: workflow-runtime
  namespace: dataagent-service
  labels:
    app: workflow-runtime
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: workflow-runtime
  ports:
  - port: 8240
    targetPort: 8240
    name: http
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workflow-runtime
  namespace: dataagent-service
  labels:
    app: workflow-runtime
    app.kubernetes.io/part-of: dataagent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workflow-runtime
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
