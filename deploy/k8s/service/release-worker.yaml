apiVersion: v1
kind: ServiceAccount
metadata:
  name: release-worker
  namespace: dataagent-service
  labels:
    app: release-worker
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: release-worker-env
  namespace: dataagent-service
  labels:
    app: release-worker
    app.kubernetes.io/part-of: dataagent
data:
  OTEL_SERVICE_NAME: release-worker
  KAFKA_USERNAME: release_worker
  KAFKA_BOOTSTRAP: kafka.dataagent-database.svc.cluster.local:8350

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-worker
  namespace: dataagent-service
  labels:
    app: release-worker
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: release-worker
  template:
    metadata:
      labels:
        app: release-worker
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: release-worker
        image: REGISTRY/dataagent/release_worker:latest
        ports:
        - containerPort: 8210
          name: http
        envFrom:
        - configMapRef:
            name: dataagent-config
        - configMapRef:
            name: release-worker-env
        - secretRef:
            name: release-worker-secrets
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8210
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8210
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      serviceAccountName: release-worker

---
apiVersion: v1
kind: Service
metadata:
  name: release-worker
  namespace: dataagent-service
  labels:
    app: release-worker
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: release-worker
  ports:
  - port: 8210
    targetPort: 8210
    name: http
  type: ClusterIP
