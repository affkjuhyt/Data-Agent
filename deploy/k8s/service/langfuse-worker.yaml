apiVersion: v1
kind: ServiceAccount
metadata:
  name: langfuse-worker
  namespace: dataagent-service
  labels:
    app: langfuse-worker
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-worker-env
  namespace: dataagent-service
  labels:
    app: langfuse-worker
    app.kubernetes.io/part-of: dataagent
data:
  TELEMETRY_ENABLED: 'false'
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse.dataagent-database.svc.cluster.local:8371
  CLICKHOUSE_URL: http://clickhouse.dataagent-database.svc.cluster.local:8370
  CLICKHOUSE_CLUSTER_ENABLED: 'false'
  REDIS_HOST: redis
  REDIS_PORT: '8320'
  REDIS_CONNECTION_STRING: redis://redis.dataagent-database.svc.cluster.local:8320
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio.dataagent-database.svc.cluster.local:8360
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio.dataagent-database.svc.cluster.local:8360
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  PORT: '8421'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  namespace: dataagent-service
  labels:
    app: langfuse-worker
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-worker
  template:
    metadata:
      labels:
        app: langfuse-worker
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: langfuse-worker
        image: docker.io/langfuse/langfuse-worker:3
        ports:
        - containerPort: 8421
          name: http
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 2Gi
        readinessProbe:
          tcpSocket:
            port: 8421
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8421
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: langfuse-worker-env
        - secretRef:
            name: langfuse-worker-secrets
      volumes:
      - name: tmp
        emptyDir: {}
      serviceAccountName: langfuse-worker
