apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  namespace: dataagent-service
  labels:
    app: litellm
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-env
  namespace: dataagent-service
  labels:
    app: litellm
    app.kubernetes.io/part-of: dataagent
data:
  HF_HOME: /tmp/hf

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: dataagent-service
  labels:
    app: litellm
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main-stable
        args:
        - --config
        - /app/config.yaml
        - --port
        - '8500'
        ports:
        - containerPort: 8500
          name: http
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /health/liveliness
            port: 8500
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: 8500
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: hf-cache
          mountPath: /tmp/hf
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: litellm-env
        - secretRef:
            name: litellm-secrets
      volumes:
      - name: hf-cache
        emptyDir:
          sizeLimit: 2Gi
      - name: config
        configMap:
          name: litellm-config
      - name: tmp
        emptyDir: {}
      serviceAccountName: litellm

---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: dataagent-service
  labels:
    app: litellm
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: litellm
  ports:
  - port: 8500
    targetPort: 8500
    name: http
  type: ClusterIP
