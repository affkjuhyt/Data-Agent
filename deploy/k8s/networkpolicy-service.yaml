---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kong
  namespace: dataagent-service
  labels:
    app.kubernetes.io/part-of: dataagent
spec:
  podSelector:
    matchLabels:
      app: kong
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    - podSelector:
        matchLabels:
          app: kong-migration
    - podSelector:
        matchLabels:
          app: setup
    ports:
    - protocol: TCP
      port: 8100

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak
  namespace: dataagent-service
  labels:
    app.kubernetes.io/part-of: dataagent
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: kong
    - podSelector:
        matchLabels:
          app: auth-api
    - podSelector:
        matchLabels:
          app: frontend
    - podSelector:
        matchLabels:
          app: setup
    - podSelector:
        matchLabels:
          app: platform-workers-audit
    ports:
    - protocol: TCP
      port: 8110
  # keycloak is also NodePort (30110, see service/keycloak.yaml) on this
  # single-node cluster — no ingress controller to front it, and the browser
  # needs to reach it directly for the login redirect. No `from` = all
  # sources, same pattern as allow-ingress-controller-to-kong.
  - ports:
    - protocol: TCP
      port: 8110
    - protocol: TCP
      port: 8111

