  namespace: dataagent-service
  labels:
    app.kubernetes.io/part-of: dataagent
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: dataagent-service
    - namespaceSelector:
        matchLabels:
          name: dataagent-database

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kong
  namespace: dataagent-service
  labels:
    app.kubernetes.io/part-of: dataagent
spec:
  podSelector:
    matchLabels:
      app: kong
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    - podSelector:
        matchLabels:
          app: kong-migration
    - podSelector:
        matchLabels:
          app: setup
    ports:
    - protocol: TCP
      port: 8100

