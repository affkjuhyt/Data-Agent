---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-remote-llm
  namespace: dataagent-service
  labels:
    app.kubernetes.io/part-of: dataagent
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - model-service
      - litellm
      - llm-exporter
      - kb-ingestion-worker
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 10.10.55.101/32
    ports:
    - protocol: TCP
      port: 8002
    - protocol: TCP
      port: 8003
    - protocol: TCP
      port: 8004
