apiVersion: v1
kind: ServiceAccount
metadata:
  name: setup
  namespace: dataagent-service
  labels:
    app: setup
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: setup-env
  namespace: dataagent-service
  labels:
    app: setup
    app.kubernetes.io/part-of: dataagent
data:
  ENABLE_ADMIN_KEY_AUTH: '0'
  KONG_ADMIN_SUBNET: ''

---
apiVersion: batch/v1
kind: Job
metadata:
  name: setup
  namespace: dataagent-service
  labels:
    app: setup
    app.kubernetes.io/part-of: dataagent
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: setup
        app.kubernetes.io/part-of: dataagent
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - name: setup
        # Built from deploy/docker/setup/Dockerfile (bash/curl baked in at
        # build time) — this pod has no egress to install them at runtime.
        image: REGISTRY/dataagent/setup:latest
        command:
        - sh
        - -c
        - |
          until curl -sf "$KEYCLOAK_URL/realms/$KEYCLOAK_REALM" >/dev/null; do echo waiting for keycloak; sleep 3; done
          until curl -sf "$KONG_ADMIN_URL" >/dev/null; do echo waiting for kong admin; sleep 3; done
          bash /scripts/keycloak/setup-audience-mappers.sh
          bash /scripts/kong/kong-setup.sh
        envFrom:
        - configMapRef:
            name: dataagent-config
        - configMapRef:
            name: setup-env
        - secretRef:
            name: setup-secrets
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: kong
          mountPath: /scripts/kong
          readOnly: true
        - name: keycloak
          mountPath: /scripts/keycloak
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: certs
          mountPath: /scripts/certs
      volumes:
      - name: kong
        configMap:
          name: kong-scripts
      - name: keycloak
        configMap:
          name: keycloak-scripts
      - name: tmp
        emptyDir: {}
      - name: certs
        emptyDir: {}
      serviceAccountName: setup
