apiVersion: v1
kind: ServiceAccount
metadata:
  name: seed
  namespace: dataagent-service
  labels:
    app: seed
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seed-env
  namespace: dataagent-service
  labels:
    app: seed
    app.kubernetes.io/part-of: dataagent
data:
  PGHOST: postgres
  PGPORT: '8300'

---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: dataagent-service
  labels:
    app: seed
    app.kubernetes.io/part-of: dataagent
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: seed
        app.kubernetes.io/part-of: dataagent
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
      - name: seed
        image: postgres:16-alpine
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgres -U "$POSTGRES_USER" >/dev/null 2>&1; do echo waiting for postgres; sleep 2; done
          psql -v ON_ERROR_STOP=1 -f /seed/seed.sql
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: seed-env
        - secretRef:
            name: seed-secrets
      volumes:
      - name: seed
        configMap:
          name: seed-sql
      - name: tmp
        emptyDir: {}
      serviceAccountName: seed
