apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-init
  namespace: dataagent-service
  labels:
    app: db-init
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-env
  namespace: dataagent-service
  labels:
    app: db-init
    app.kubernetes.io/part-of: dataagent
data:
  PGHOST: postgres
  WAIT_FOR_TABLE: Agents
  PGPORT: '8300'

---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: dataagent-service
  labels:
    app: db-init
    app.kubernetes.io/part-of: dataagent
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: db-init
        app.kubernetes.io/part-of: dataagent
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
      - name: db-init
        image: postgres:16-alpine
        command:
        - sh
        - -c
        - |
          until psql -tAc "SELECT 1 FROM information_schema.tables WHERE table_name = 'Agents'" 2>/dev/null | grep -q 1; do
            echo waiting for migrations; sleep 3
          done
          for f in /sql/*.sql; do echo applying $f; psql -v ON_ERROR_STOP=1 -f "$f"; done
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: sql
          mountPath: /sql
          readOnly: true
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: db-init-env
        - secretRef:
            name: db-init-secrets
      volumes:
      - name: sql
        configMap:
          name: db-init-sql
      - name: tmp
        emptyDir: {}
      serviceAccountName: db-init
