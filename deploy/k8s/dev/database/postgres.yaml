---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: dataagent-database
  labels:
    app: postgres
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-env
  namespace: dataagent-database
  labels:
    app: postgres
    app.kubernetes.io/part-of: dataagent
data:
  POSTGRES_HOST_AUTH_METHOD: scram-sha-256
  POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
  PGDATA: /var/lib/postgresql/data/pgdata
  PGPORT: '8300'
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: dataagent-database
  labels:
    app: postgres
    app.kubernetes.io/part-of: dataagent
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: dataagent
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: postgres
        image: postgres:16-alpine
        args:
        - postgres
        - -c
        - wal_level=replica
        - -c
        - max_wal_senders=3
        - -c
        - max_replication_slots=3
        ports:
        - containerPort: 8300
          name: http
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 2Gi
        readinessProbe:
          tcpSocket:
            port: 8300
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8300
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: initdb
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: dataagent-config
        - configMapRef:
            name: postgres-env
        - secretRef:
            name: postgres-secrets
      volumes:
      - name: initdb
        configMap:
          name: postgres-initdb
      - name: run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      serviceAccountName: postgres
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dataagent-database
  labels:
    app: postgres
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: postgres
  ports:
  - port: 8300
    targetPort: 8300
    name: postgres
  clusterIP: None
