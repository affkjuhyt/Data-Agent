---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neo4j
  namespace: dataagent-database
  labels:
    app: neo4j
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: neo4j-env
  namespace: dataagent-database
  labels:
    app: neo4j
    app.kubernetes.io/part-of: dataagent
data:
  NEO4J_server_memory_heap_initial__size: 2g
  NEO4J_server_memory_heap_max__size: 2g
  NEO4J_server_memory_pagecache_size: 1g
  NEO4J_server_jvm_additional: -XX:+ExitOnOutOfMemoryError
  NEO4J_dbms_cypher_forbid__exhaustive__shortestpath: 'true'
  NEO4J_dbms_routing_driver_connection_pool_max__size: '50'
  NEO4J_db_track__query__cpu__time: 'true'
  NEO4J_db_logs_query_transaction_enabled: VERBOSE
  NEO4J_server_http_listen__address: :8340
  NEO4J_server_https_enabled: 'false'
  NEO4J_server_bolt_listen__address: :8341
  NEO4J_server_bolt_advertised__address: neo4j.dataagent-database.svc.cluster.local:8341
  NEO4J_PLUGINS: '["apoc"]'
  NEO4J_apoc_export_file_enabled: 'true'
  NEO4J_apoc_import_file_enabled: 'true'
  NEO4J_apoc_import_file_use__neo4j__config: 'true'
  NEO4J_dbms_security_procedures_unrestricted: apoc.*
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: dataagent-database
  labels:
    app: neo4j
    app.kubernetes.io/part-of: dataagent
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
        app.kubernetes.io/part-of: dataagent
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: neo4j
        image: neo4j:5.20
        ports:
        - containerPort: 8340
          name: http
        - containerPort: 8341
          name: bolt
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: '2'
            memory: 4Gi
        readinessProbe:
          httpGet:
            path: /
            port: 8340
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 8340
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /data
        - name: logs
          mountPath: /logs
        - name: run
          mountPath: /var/lib/neo4j/run
        - name: tmp
          mountPath: /tmp
        - name: plugins
          mountPath: /var/lib/neo4j/plugins
        - name: conf
          mountPath: /var/lib/neo4j/conf
        envFrom:
        - configMapRef:
            name: neo4j-env
        - secretRef:
            name: neo4j-secrets
      volumes:
      - name: run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: plugins
        emptyDir: {}
      - name: conf
        emptyDir: {}
      serviceAccountName: neo4j
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
  - metadata:
      name: logs
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: dataagent-database
  labels:
    app: neo4j
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: neo4j
  ports:
  - port: 8340
    targetPort: 8340
    name: http
  - port: 8341
    targetPort: 8341
    name: bolt
  clusterIP: None
