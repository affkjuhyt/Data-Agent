---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgbouncer
  namespace: dataagent-database
  labels:
    app: pgbouncer
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-env
  namespace: dataagent-database
  labels:
    app: pgbouncer
    app.kubernetes.io/part-of: dataagent
data:
  DB_HOST: postgres
  DB_PORT: '8300'
  LISTEN_PORT: '8390'
  POOL_MODE: transaction
  MAX_CLIENT_CONN: '10000'
  DEFAULT_POOL_SIZE: '20'
  MIN_POOL_SIZE: '5'
  RESERVE_POOL_SIZE: '5'
  AUTH_TYPE: scram-sha-256
  DB_USER: pgbouncer_auth
  AUTH_QUERY: SELECT usename, passwd FROM public.pgbouncer_get_auth($1)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: dataagent-database
  labels:
    app: pgbouncer
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
        app.kubernetes.io/part-of: dataagent
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: pgbouncer
        image: edoburu/pgbouncer:latest
        ports:
        - containerPort: 8390
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 8390
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8390
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /etc/pgbouncer
        envFrom:
        - configMapRef:
            name: pgbouncer-env
        - secretRef:
            name: pgbouncer-secrets
      volumes:
      - name: tmp
        emptyDir: {}
      - name: config
        emptyDir: {}
      serviceAccountName: pgbouncer
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: dataagent-database
  labels:
    app: pgbouncer
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: pgbouncer
  ports:
  - port: 8390
    targetPort: 8390
    name: pgbouncer
  type: ClusterIP
