---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka
  namespace: dataagent-database
  labels:
    app: kafka
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-env
  namespace: dataagent-database
  labels:
    app: kafka
    app.kubernetes.io/part-of: dataagent
data:
  KAFKA_NODE_ID: '1'
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-0.kafka.dataagent-database.svc.cluster.local:8351
  KAFKA_LISTENERS: SASL_PLAINTEXT://:8350,CONTROLLER://:8351,INTERNAL://:8352
  KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka.dataagent-database.svc.cluster.local:8350,INTERNAL://kafka.dataagent-database.svc.cluster.local:8352
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
  KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
  KAFKA_CLUSTER_ID: dataagent-kafka-cluster-1
  KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
  KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
  KAFKA_SUPER_USERS: User:admin;User:ANONYMOUS
  KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/jaas/kafka-broker-jaas.config
  KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
  # The image's log.dirs defaults to /tmp/kafka-logs, not the PVC mounted at
  # /var/lib/kafka/data, so every pod restart wiped topics, ACLs, offsets and
  # messages (the ACLs live in the KRaft metadata log, so a restart also
  # silently cut off every SASL client until kafka-topics was re-run).
  KAFKA_LOG_DIRS: /var/lib/kafka/data
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: dataagent-database
  labels:
    app: kafka
    app.kubernetes.io/part-of: dataagent
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        app.kubernetes.io/part-of: dataagent
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      initContainers:
      - name: copy-config
        image: apache/kafka:3.7.0
        command:
        - sh
        - -c
        - cp -r /opt/kafka/config/. /config-writable/
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /config-writable
      containers:
      - name: kafka
        image: apache/kafka:3.7.0
        ports:
        - containerPort: 8350
          name: sasl
        - containerPort: 8351
          name: ctrl
        - containerPort: 8352
          name: internal
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 2Gi
        readinessProbe:
          tcpSocket:
            port: 8352
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8352
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: jaas
          mountPath: /etc/kafka/jaas
          readOnly: true
        - name: data
          mountPath: /var/lib/kafka/data
        - name: config
          mountPath: /opt/kafka/config
        - name: logs
          mountPath: /opt/kafka/logs
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: kafka-env
        - secretRef:
            name: kafka-secrets
      volumes:
      - name: jaas
        secret:
          secretName: kafka-jaas
      - name: tmp
        emptyDir: {}
      - name: config
        emptyDir: {}
      - name: logs
        emptyDir: {}
      enableServiceLinks: false
      serviceAccountName: kafka
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: dataagent-database
  labels:
    app: kafka
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: kafka
  ports:
  - port: 8350
    targetPort: 8350
    name: sasl
  - port: 8351
    targetPort: 8351
    name: ctrl
  - port: 8352
    targetPort: 8352
    name: internal
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-nodeport
  namespace: dataagent-database
  labels:
    app: kafka
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: kafka
  ports:
  - port: 8350
    targetPort: 8350
    nodePort: 30350
    name: sasl
  - port: 8351
    targetPort: 8351
    nodePort: 30351
    name: ctrl
  - port: 8352
    targetPort: 8352
    nodePort: 30352
    name: internal
  type: NodePort
