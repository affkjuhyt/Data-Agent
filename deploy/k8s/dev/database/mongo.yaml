---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongo
  namespace: dataagent-database
  labels:
    app: mongo
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-env
  namespace: dataagent-database
  labels:
    app: mongo
    app.kubernetes.io/part-of: dataagent
data:
  MONGO_INITDB_DATABASE: dataagent
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: dataagent-database
  labels:
    app: mongo
    app.kubernetes.io/part-of: dataagent
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
        app.kubernetes.io/part-of: dataagent
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: mongo
        image: mongo:7.0
        args:
        - mongod
        - --wiredTigerCacheSizeGB
        - '0.5'
        - --bind_ip_all
        - --port
        - '8310'
        ports:
        - containerPort: 8310
          name: http
        resources:
          # The scheduler reserves this, not what the pod uses: the dev stores reserved twice to twenty
          # times their use (95 Mi measured 01/11/2026), and the one-node cluster could not fit the
          # full stack. The limit is unchanged, so the store still grows into it.
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          tcpSocket:
            port: 8310
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8310
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /data/db
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: mongo-env
      volumes:
      - name: tmp
        emptyDir: {}
      serviceAccountName: mongo
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: dataagent-database
  labels:
    app: mongo
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: mongo
  ports:
  - port: 8310
    targetPort: 8310
    name: mongo
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-nodeport
  namespace: dataagent-database
  labels:
    app: mongo
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: mongo
  ports:
  - port: 8310
    targetPort: 8310
    nodePort: 30310
    name: mongo
  type: NodePort
