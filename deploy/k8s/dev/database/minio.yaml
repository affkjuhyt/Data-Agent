---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio
  namespace: dataagent-database
  labels:
    app: minio
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-env
  namespace: dataagent-database
  labels:
    app: minio
    app.kubernetes.io/part-of: dataagent
data:
  MINIO_API_PORT_NUMBER: "8360"
  MINIO_CONSOLE_PORT_NUMBER: "8361"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: dataagent-database
  labels:
    app: minio
    app.kubernetes.io/part-of: dataagent
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        app.kubernetes.io/part-of: dataagent
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: minio
        # The upstream Community images were removed from the public registries.
        # Keep the dev deployment on the archived, reproducible Bitnami image.
        image: bitnamilegacy/minio:2024.12.18-debian-12-r0
        imagePullPolicy: IfNotPresent
        command:
        - /opt/bitnami/scripts/minio/run.sh
        ports:
        - containerPort: 8360
          name: api
        - containerPort: 8361
          name: console
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 8360
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /minio/health/ready
            port: 8360
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /bitnami/minio/data
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: minio-env
        - secretRef:
            name: minio-secrets
      volumes:
      - name: tmp
        emptyDir: {}
      serviceAccountName: minio
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: dataagent-database
  labels:
    app: minio
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: minio
  ports:
  - port: 8360
    targetPort: 8360
    nodePort: 30360
    name: api
  - port: 8361
    targetPort: 8361
    nodePort: 30361
    name: console
  type: NodePort
