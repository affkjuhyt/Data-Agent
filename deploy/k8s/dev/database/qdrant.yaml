---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qdrant
  namespace: dataagent-database
  labels:
    app: qdrant
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qdrant-env
  namespace: dataagent-database
  labels:
    app: qdrant
    app.kubernetes.io/part-of: dataagent
data:
  QDRANT__CLUSTER__ENABLED: 'false'
  QDRANT__SERVICE__HTTP_PORT: '8330'
  QDRANT__SERVICE__GRPC_PORT: '8331'
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: dataagent-database
  labels:
    app: qdrant
    app.kubernetes.io/part-of: dataagent
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
        app.kubernetes.io/part-of: dataagent
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.13.6
        ports:
        - containerPort: 8330
          name: http
        - containerPort: 8331
          name: grpc
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8330
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /readyz
            port: 8330
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /qdrant/storage
        - name: tmp
          mountPath: /tmp
        - name: snapshots
          mountPath: /qdrant/snapshots
        envFrom:
        - configMapRef:
            name: qdrant-env
      volumes:
      - name: tmp
        emptyDir: {}
      - name: snapshots
        emptyDir: {}
      serviceAccountName: qdrant
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: dataagent-database
  labels:
    app: qdrant
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: qdrant
  ports:
  - port: 8330
    targetPort: 8330
    name: http
  - port: 8331
    targetPort: 8331
    name: grpc
  type: ClusterIP
