---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: dataagent-database
  labels:
    app: openbao
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-env
  namespace: dataagent-database
  labels:
    app: openbao
    app.kubernetes.io/part-of: dataagent
data:
  BAO_SKIP_DROP_ROOT: 'true'
  BAO_ADDR: http://127.0.0.1:8120
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
  namespace: dataagent-database
  labels:
    app: openbao-config
    app.kubernetes.io/part-of: dataagent
data:
  config.hcl: |
    storage "file" {
      path = "/openbao/data"
    }

    listener "tcp" {
      address     = "0.0.0.0:8120"
      tls_disable = 1
    }

    api_addr = "http://openbao.dataagent-database.svc.cluster.local:8120"
    ui       = true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao
  namespace: dataagent-database
  labels:
    app: openbao
    app.kubernetes.io/part-of: dataagent
spec:
  serviceName: openbao
  replicas: 1
  selector:
    matchLabels:
      app: openbao
  template:
    metadata:
      labels:
        app: openbao
        app.kubernetes.io/part-of: dataagent
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: openbao
        image: openbao/openbao:latest
        args:
        - server
        - -config=/openbao/config/config.hcl
        ports:
        - containerPort: 8120
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200
            port: 8120
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200
            port: 8120
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /openbao/data
        - name: config
          mountPath: /openbao/config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: openbao-env
      volumes:
      - name: config
        configMap:
          name: openbao-config
      - name: tmp
        emptyDir: {}
      enableServiceLinks: false
      serviceAccountName: openbao
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: dataagent-database
  labels:
    app: openbao
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: openbao
  ports:
  - port: 8120
    targetPort: 8120
    nodePort: 30120
    name: http
  type: NodePort
