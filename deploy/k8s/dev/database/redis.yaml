---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: dataagent-database
  labels:
    app: redis-config
    app.kubernetes.io/part-of: dataagent
data:
  redis.conf: |
    bind 0.0.0.0
    port 8320
    protected-mode no
    maxmemory 512mb
    maxmemory-policy allkeys-lru
    save 900 1
    save 300 10
    save 60 10000
    dir /data
    loglevel notice
    timeout 300
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: dataagent-database
  labels:
    app: redis
    app.kubernetes.io/part-of: dataagent
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: dataagent-database
  labels:
    app: redis
    app.kubernetes.io/part-of: dataagent
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/part-of: dataagent
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: redis
        image: redis:7-alpine
        args:
        - redis-server
        - /etc/redis/redis.conf
        ports:
        - containerPort: 8320
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 8320
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8320
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/redis
          readOnly: true
        - name: tmp
          mountPath: /tmp
        envFrom: []
      volumes:
      - name: config
        configMap:
          name: redis-config
      - name: tmp
        emptyDir: {}
      serviceAccountName: redis
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: dataagent-database
  labels:
    app: redis
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: redis
  ports:
  - port: 8320
    targetPort: 8320
    name: redis
  clusterIP: None
