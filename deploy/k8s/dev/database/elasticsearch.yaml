---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elasticsearch
  namespace: dataagent-database
  labels:
    app: elasticsearch
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-env
  namespace: dataagent-database
  labels:
    app: elasticsearch
    app.kubernetes.io/part-of: dataagent
data:
  discovery.type: single-node
  xpack.security.enabled: 'false'
  ES_JAVA_OPTS: -Xms512m -Xmx512m
  http.port: '8380'
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: dataagent-database
  labels:
    app: elasticsearch
    app.kubernetes.io/part-of: dataagent
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
        app.kubernetes.io/part-of: dataagent
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      initContainers:
      - name: copy-config
        image: elasticsearch:8.12.0
        command:
        - sh
        - -c
        - cp -r /usr/share/elasticsearch/config/. /config-writable/
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /config-writable
      containers:
      - name: elasticsearch
        image: elasticsearch:8.12.0
        ports:
        - containerPort: 8380
          name: http
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /_cluster/health
            port: 8380
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /_cluster/health
            port: 8380
          initialDelaySeconds: 90
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
        - name: config
          mountPath: /usr/share/elasticsearch/config
        - name: logs
          mountPath: /usr/share/elasticsearch/logs
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: elasticsearch-env
      volumes:
      - name: tmp
        emptyDir: {}
      - name: config
        emptyDir: {}
      - name: logs
        emptyDir: {}
      enableServiceLinks: false
      serviceAccountName: elasticsearch
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: dataagent-database
  labels:
    app: elasticsearch
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: elasticsearch
  ports:
  - port: 8380
    targetPort: 8380
    nodePort: 30380
    name: http
  type: NodePort
