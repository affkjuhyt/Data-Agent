---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kong
  namespace: dataagent-service
  labels:
    app: kong
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-env
  namespace: dataagent-service
  labels:
    app: kong
    app.kubernetes.io/part-of: dataagent
data:
  KONG_DATABASE: postgres
  KONG_PG_HOST: postgres.dataagent-database.svc.cluster.local
  KONG_PG_PORT: '8300'
  KONG_PG_USER: admin
  KONG_PG_DATABASE: dataagent
  KONG_PG_SCHEMA: kong
  KONG_NGINX_WORKER_PROCESSES: '2'
  KONG_PROXY_ACCESS_LOG: /dev/stdout
  KONG_ADMIN_ACCESS_LOG: /dev/stdout
  KONG_PROXY_ERROR_LOG: /dev/stderr
  KONG_ADMIN_ERROR_LOG: /dev/stderr
  KONG_ADMIN_LISTEN: 0.0.0.0:8101
  KONG_PROXY_LISTEN: 0.0.0.0:8100
  KONG_PLUGINS: bundled,aeroflow-jwks
  KONG_MEM_CACHE_SIZE: 128m
  KONG_PREFIX: /kong_prefix
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: dataagent-service
  labels:
    app: kong
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
        app.kubernetes.io/part-of: dataagent
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: kong
        image: localhost:5000/dataagent/kong:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8100
          name: proxy
        - containerPort: 8101
          name: admin
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /status
            port: 8101
          initialDelaySeconds: 1
          periodSeconds: 2
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /status
            port: 8101
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: prefix
          mountPath: /kong_prefix
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: kong-env
        - secretRef:
            name: kong-secrets
      volumes:
      - name: prefix
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      enableServiceLinks: false
      serviceAccountName: kong
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: dataagent-service
  labels:
    app: kong
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: kong
  ports:
  - port: 8100
    targetPort: 8100
    nodePort: 30100
    name: proxy
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: dataagent-service
  labels:
    app: kong-admin
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: kong
  ports:
  - port: 8101
    targetPort: 8101
    nodePort: 30101
    name: admin
  type: NodePort
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kong
  namespace: dataagent-service
  labels:
    app: kong
    app.kubernetes.io/part-of: dataagent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kong
  minReplicas: 1
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
