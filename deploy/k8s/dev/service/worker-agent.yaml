# worker-agent (ADR-28): answers the questions the api records (qa.outbox question.received),
# docs/v3/06-api-v1.md §6. No port and no Service: it only reads and writes the database.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-agent
  namespace: dataagent-service
  labels:
    app: worker-agent
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-agent-env
  namespace: dataagent-service
  labels:
    app: worker-agent
    app.kubernetes.io/part-of: dataagent
data:
  OTEL_SERVICE_NAME: worker-agent
  WORKER_AGENT_POLL_SECONDS: "0.5"
  WORKER_AGENT_BATCH: "10"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-agent
  namespace: dataagent-service
  labels:
    app: worker-agent
    app.kubernetes.io/part-of: dataagent
spec:
  # Replicas may grow: outbox rows are claimed FOR UPDATE SKIP LOCKED, so two never take the same one.
  replicas: 1
  selector:
    matchLabels:
      app: worker-agent
  template:
    metadata:
      labels:
        app: worker-agent
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: wait-for-migrations
        image: dataagent/migrate:latest
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - until alembic -c alembic/alembic.ini current 2>/dev/null | grep -q '(head)'; do echo waiting for schema; sleep 2; done
        envFrom:
        - secretRef:
            name: migrate-secrets
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      containers:
      - name: worker-agent
        image: dataagent/worker-agent:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: dataagent-config
        - configMapRef:
            name: worker-agent-env
        - secretRef:
            name: worker-agent-secrets
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tmp
        emptyDir: {}
      enableServiceLinks: false
      serviceAccountName: worker-agent
