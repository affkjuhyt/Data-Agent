# worker-agent (ADR-28): answers the questions the api records (qa.outbox question.received),
# docs/v3/06-api-v1.md §6. No port and no Service: it only reads and writes the database.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-agent
  namespace: dataagent-service
  labels:
    app: worker-agent
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-agent-env
  namespace: dataagent-service
  labels:
    app: worker-agent
    app.kubernetes.io/part-of: dataagent
data:
  OTEL_SERVICE_NAME: worker-agent
  WORKER_AGENT_POLL_SECONDS: "0.5"
  WORKER_AGENT_BATCH: "10"
  # Document answers (UC-05-04): the query is embedded by the bge-m3 TEI the chunks were embedded
  # with, and the pool is ordered by the TEI reranker. The local slice has no LiteLLM.
  DOCUMENT_EMBED_URL: http://10.10.55.101:8003
  DOCUMENT_RERANK_URL: http://10.10.55.101:8004
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-agent
  namespace: dataagent-service
  labels:
    app: worker-agent
    app.kubernetes.io/part-of: dataagent
spec:
  # Replicas may grow: outbox rows are claimed FOR UPDATE SKIP LOCKED, so two never take the same one.
  replicas: 1
  # One-node local clusters run near their memory requests: a rolling update's
  # surge pod stays Pending and the deploy waits out wait_rollout with the old
  # code still serving. Recreate frees the old pod before scheduling the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker-agent
  template:
    metadata:
      labels:
        app: worker-agent
        app.kubernetes.io/part-of: dataagent
      annotations:
        dataagent.dev/revision: a9435b97-reconnect
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: wait-for-migrations
        image: dataagent/migrate:latest
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          # Waits as svc_qa, not as the migrator: the head comes from the revision files in this
          # image (offline, no database) and the applied revision from alembic_version, which
          # db-init lets every svc_ role read. `alembic current` would need the owner's URL.
          # python -B: the root filesystem is read-only, so no bytecode is written.
          heads="$(python -B -m alembic -c alembic/alembic.ini heads | sed -n 's/ (head)$//p')"
          [ -n "$heads" ] || { echo "no alembic head in the image"; exit 1; }
          until python -B -c '
          import os, sys, psycopg
          url = "postgresql://" + os.environ[sys.argv[1]].split("://", 1)[1]
          with psycopg.connect(url, connect_timeout=5, prepare_threshold=None) as conn:
              applied = {row[0] for row in conn.execute("SELECT version_num FROM public.alembic_version")}
          sys.exit(applied != set(sys.argv[2].split()))
          ' DATAAGENT_DB_URL__SVC_QA "$heads" 2>/dev/null; do echo waiting for schema; sleep 2; done
        envFrom:
        - secretRef:
            name: worker-agent-secrets
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      containers:
      - name: worker-agent
        image: dataagent/worker-agent:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "services.worker_agent.main"]
        envFrom:
        - configMapRef:
            name: dataagent-config
        - configMapRef:
            name: worker-agent-env
        - secretRef:
            name: worker-agent-secrets
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tmp
        emptyDir: {}
      enableServiceLinks: false
      serviceAccountName: worker-agent
