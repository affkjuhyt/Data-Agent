---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: dataagent-service
  labels:
    app: keycloak
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-env
  namespace: dataagent-service
  labels:
    app: keycloak
    app.kubernetes.io/part-of: dataagent
data:
  KC_DB: postgres
  KC_DB_USERNAME: admin
  KC_DB_URL: jdbc:postgresql://postgres.dataagent-database.svc.cluster.local:8300/dataagent
  KC_DB_SCHEMA: keycloak
  KC_HTTP_ENABLED: 'true'
  KC_HOSTNAME_STRICT: 'false'
  KC_PROXY: edge
  KC_HEALTH_ENABLED: 'true'
  KC_CACHE: ispn
  KC_CACHE_STACK: kubernetes
  JAVA_OPTS_APPEND: -Djgroups.dns.query=keycloak.dataagent.svc.cluster.local
  JAVA_OPTS_KC_HEAP: -Xms512m -Xmx1g
  KC_HTTP_PORT: '8110'
  KC_HTTP_MANAGEMENT_PORT: '8111'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: dataagent-service
  labels:
    app: keycloak
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
        app.kubernetes.io/part-of: dataagent
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: keycloak
        image: dataagent/keycloak:latest
        imagePullPolicy: IfNotPresent
        args:
        - start
        - --optimized
        - --import-realm
        ports:
        - containerPort: 8110
          name: http
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8110
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/ready
            port: 8110
          initialDelaySeconds: 90
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: realm
          mountPath: /opt/keycloak/data/import
          readOnly: true
        - name: kcdata
          mountPath: /opt/keycloak/data/tmp
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: keycloak-env
        - secretRef:
            name: keycloak-secrets
      volumes:
      - name: realm
        configMap:
          name: keycloak-realm
      - name: kcdata
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      serviceAccountName: keycloak
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: dataagent-service
  labels:
    app: keycloak
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: keycloak
  ports:
  - port: 8110
    targetPort: 8110
    nodePort: 30110
    name: http
  - port: 8111
    targetPort: 8111
    name: health
  type: NodePort
