---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jaeger
  namespace: dataagent-service
  labels:
    app: jaeger
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-env
  namespace: dataagent-service
  labels:
    app: jaeger
    app.kubernetes.io/part-of: dataagent
data:
  COLLECTOR_OTLP_ENABLED: 'true'
  QUERY_HTTP_SERVER_HOST_PORT: :8430
  COLLECTOR_OTLP_GRPC_HOST_PORT: 0.0.0.0:8431
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: dataagent-service
  labels:
    app: jaeger
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        app.kubernetes.io/part-of: dataagent
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.55
        ports:
        - containerPort: 8430
          name: ui
        - containerPort: 8431
          name: otlp
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8430
          initialDelaySeconds: 1
          periodSeconds: 2
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8430
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: jaeger-env
      volumes:
      - name: tmp
        emptyDir: {}
      serviceAccountName: jaeger
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: dataagent-service
  labels:
    app: jaeger
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: jaeger
  ports:
  - port: 8430
    targetPort: 8430
    nodePort: 30430
    name: ui
  - port: 8431
    targetPort: 8431
    nodePort: 30431
    name: otlp
  type: NodePort
