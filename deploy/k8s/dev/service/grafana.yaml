---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: dataagent-service
  labels:
    app: grafana
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-env
  namespace: dataagent-service
  labels:
    app: grafana
    app.kubernetes.io/part-of: dataagent
data:
  GF_AUTH_ANONYMOUS_ENABLED: 'false'
  GF_USERS_DEFAULT_THEME: dark
  GF_PATHS_PROVISIONING: /etc/grafana/provisioning
  GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
  GF_SERVER_HTTP_PORT: '8410'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: dataagent-service
  labels:
    app: grafana
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/part-of: dataagent
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: grafana
        image: grafana/grafana:11.2.0
        ports:
        - containerPort: 8410
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8410
          initialDelaySeconds: 1
          periodSeconds: 2
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8410
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: tmp
          mountPath: /tmp
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        - name: dashboards-provider
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
          readOnly: true
        envFrom:
        - configMapRef:
            name: grafana-env
        - secretRef:
            name: grafana-secrets
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: tmp
        emptyDir: {}
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboards-provider
        configMap:
          name: grafana-dashboards-provider
      - name: dashboards
        configMap:
          name: grafana-dashboards
      serviceAccountName: grafana
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: dataagent-service
  labels:
    app: grafana-data
    app.kubernetes.io/part-of: dataagent
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: dataagent-service
  labels:
    app: grafana
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: grafana
  ports:
  - port: 8410
    targetPort: 8410
    nodePort: 30410
    name: http
  type: NodePort
