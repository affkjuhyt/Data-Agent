---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flow-builder
  namespace: dataagent-service
  labels:
    app: flow-builder
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flow-builder-env
  namespace: dataagent-service
  labels:
    app: flow-builder
    app.kubernetes.io/part-of: dataagent
data:
  OTEL_SERVICE_NAME: flow-builder
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-builder
  namespace: dataagent-service
  labels:
    app: flow-builder
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flow-builder
  template:
    metadata:
      labels:
        app: flow-builder
        app.kubernetes.io/part-of: dataagent
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: flow-builder
        image: dataagent/flow_builder:latest
        ports:
        - containerPort: 8250
          name: http
        envFrom:
        - configMapRef:
            name: dataagent-config
        - configMapRef:
            name: flow-builder-env
        - secretRef:
            name: flow-builder-secrets
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8250
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8250
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        command:
        - uvicorn
        - main:app
        - --host
        - 0.0.0.0
        - --port
        - '8250'
      initContainers:
      - name: wait-for-migrations
        image: dataagent/migrate:latest
        command:
        - sh
        - -c
        - until alembic -c alembic/alembic.ini current 2>/dev/null | grep -q '(head)'; do echo waiting for schema; sleep 5; done
        envFrom:
        - secretRef:
            name: flow-builder-secrets
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      serviceAccountName: flow-builder
---
apiVersion: v1
kind: Service
metadata:
  name: flow-builder
  namespace: dataagent-service
  labels:
    app: flow-builder
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: flow-builder
  ports:
  - port: 8250
    targetPort: 8250
    name: http
  type: ClusterIP
