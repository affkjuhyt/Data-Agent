apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: dataagent-service
  labels:
    app: api
    app.kubernetes.io/part-of: dataagent
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-env
  namespace: dataagent-service
  labels:
    app: api
    app.kubernetes.io/part-of: dataagent
data:
  OTEL_SERVICE_NAME: api
  API_OIDC_AUDIENCE: dataagent-api
  API_OIDC_JWKS_URL: http://keycloak.dataagent-service.svc.cluster.local:8110/realms/aeroflow/protocol/openid-connect/certs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: dataagent-service
  labels:
    app: api
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: wait-for-migrations
        image: dataagent/migrate:latest
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - until alembic -c alembic/alembic.ini current 2>/dev/null | grep -q '(head)'; do echo waiting for schema; sleep 2; done
        envFrom:
        - secretRef:
            name: migrate-secrets
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      containers:
      - name: api
        image: dataagent/api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8290
          name: http
        envFrom:
        - configMapRef:
            name: dataagent-config
        - configMapRef:
            name: api-env
        - secretRef:
            name: api-secrets
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8290
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8290
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        command:
        - uvicorn
        - services.api.app:app
        - --host
        - 0.0.0.0
        - --port
        - '8290'
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tmp
        emptyDir: {}
      enableServiceLinks: false
      serviceAccountName: api
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: dataagent-service
  labels:
    app: api
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: api
  ports:
  - port: 8290
    targetPort: 8290
    name: http
