---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kb-promote-silver
  namespace: dataagent-service
  labels:
    app: kb-promote-silver
    ingestion_worker: promote_silver
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kb-promote-silver-env
  namespace: dataagent-service
  labels:
    app: kb-promote-silver
    ingestion_worker: promote_silver
    app.kubernetes.io/part-of: dataagent
data:
  POSTGRES_MAX_CONNECTIONS: '5'
  POSTGRES_MAX_OVERFLOW: '5'
  POSTGRES_POOL_TIMEOUT: '30'
  POSTGRES_POOL_RECYCLE: '1800'
  HF_HOME: /cache
  LLM_MODEL: agent-fast
  SILVER_CONCURRENCY: '1'
  SILVER_SUMMARY_CONCURRENCY: '4'
  USE_VLM: 'false'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kb-promote-silver-cache
  namespace: dataagent-service
  labels:
    app: kb-promote-silver
    ingestion_worker: promote_silver
    app.kubernetes.io/part-of: dataagent
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kb-promote-silver
  namespace: dataagent-service
  labels:
    app: kb-promote-silver
    ingestion_worker: promote_silver
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kb-promote-silver
  template:
    metadata:
      labels:
        app: kb-promote-silver
        ingestion_worker: promote_silver
        app.kubernetes.io/part-of: dataagent
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: kb-promote-silver
        image: dataagent/kb-promote-silver:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: dataagent-config
        - configMapRef:
            name: kb-promote-silver-env
        - secretRef:
            name: kb-promote-silver-secrets
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 4Gi
        volumeMounts:
        - name: cache
          mountPath: /cache
        - name: tmp
          mountPath: /tmp
        command:
        - python
        - -m
        - services.kb_promote_silver.promote_silver
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: kb-promote-silver-cache
      - name: tmp
        emptyDir: {}
      serviceAccountName: kb-promote-silver
