---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kb-promote-silver
  namespace: dataagent-service
  labels:
    app: kb-promote-silver
    ingestion_worker: promote_silver
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kb-promote-silver-env
  namespace: dataagent-service
  labels:
    app: kb-promote-silver
    ingestion_worker: promote_silver
    app.kubernetes.io/part-of: dataagent
data:
  POSTGRES_MAX_CONNECTIONS: '5'
  POSTGRES_MAX_OVERFLOW: '5'
  POSTGRES_POOL_TIMEOUT: '30'
  POSTGRES_POOL_RECYCLE: '1800'
  HF_HOME: /cache
  LLM_MODEL: agent-fast
  # A single huge scanned PDF (heavy Docling+Tesseract OCR, tens of minutes)
  # otherwise monopolizes the one processing slot and starves every other
  # source behind it — hit for real: 15-minute-cadence RSS/REST sources kept
  # having their queued Silver message superseded by their own next re-crawl
  # before ever getting a turn, while a single yearbook PDF ran. Node has
  # ample CPU/memory headroom (see the bumped limits below) for a few
  # concurrent attempts; small documents finish in seconds regardless.
  SILVER_CONCURRENCY: '3'
  SILVER_SUMMARY_CONCURRENCY: '4'
  USE_VLM: 'false'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kb-promote-silver-cache
  namespace: dataagent-service
  labels:
    app: kb-promote-silver
    ingestion_worker: promote_silver
    app.kubernetes.io/part-of: dataagent
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kb-promote-silver
  namespace: dataagent-service
  labels:
    app: kb-promote-silver
    ingestion_worker: promote_silver
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kb-promote-silver
  template:
    metadata:
      labels:
        app: kb-promote-silver
        ingestion_worker: promote_silver
        app.kubernetes.io/part-of: dataagent
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: kb-promote-silver
        image: localhost:5000/dataagent/kb-promote-silver:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: dataagent-config
        - configMapRef:
            name: kb-promote-silver-env
        - secretRef:
            name: kb-promote-silver-secrets
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: '4'
            memory: 16Gi
        volumeMounts:
        - name: cache
          mountPath: /cache
        - name: tmp
          mountPath: /tmp
        command:
        - python
        - -m
        - services.kb_promote_silver.promote_silver
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: kb-promote-silver-cache
      - name: tmp
        emptyDir: {}
      serviceAccountName: kb-promote-silver
