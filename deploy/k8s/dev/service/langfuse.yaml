---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: langfuse
  namespace: dataagent-service
  labels:
    app: langfuse
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-env
  namespace: dataagent-service
  labels:
    app: langfuse
    app.kubernetes.io/part-of: dataagent
data:
  TELEMETRY_ENABLED: 'false'
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse.dataagent-database.svc.cluster.local:8371
  CLICKHOUSE_URL: http://clickhouse.dataagent-database.svc.cluster.local:8370
  CLICKHOUSE_CLUSTER_ENABLED: 'false'
  REDIS_HOST: redis.dataagent-database.svc.cluster.local
  REDIS_PORT: '8320'
  REDIS_CONNECTION_STRING: redis://redis.dataagent-database.svc.cluster.local:8320
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio.dataagent-database.svc.cluster.local:8360
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio.dataagent-database.svc.cluster.local:8360
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  AUTH_DISABLE_SIGNUP: 'true'
  LANGFUSE_INIT_ORG_ID: gtel-org
  LANGFUSE_INIT_ORG_NAME: GTEL
  LANGFUSE_INIT_PROJECT_ID: data-agent-proj
  LANGFUSE_INIT_PROJECT_NAME: data-agent
  LANGFUSE_INIT_USER_NAME: Admin
  PORT: '8420'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse
  namespace: dataagent-service
  labels:
    app: langfuse
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse
  template:
    metadata:
      labels:
        app: langfuse
        app.kubernetes.io/part-of: dataagent
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: langfuse
        image: docker.io/langfuse/langfuse:3
        ports:
        - containerPort: 8420
          name: http
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /api/public/health
            port: 8420
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/public/health
            port: 8420
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: langfuse-env
        - secretRef:
            name: langfuse-secrets
      volumes:
      - name: tmp
        emptyDir: {}
      serviceAccountName: langfuse
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: dataagent-service
  labels:
    app: langfuse
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: langfuse
  ports:
  - port: 8420
    targetPort: 8420
    nodePort: 30420
    name: http
  type: NodePort
