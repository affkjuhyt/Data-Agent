apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-document
  namespace: dataagent-service
  labels: {app: worker-document, app.kubernetes.io/part-of: dataagent}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-document-env
  namespace: dataagent-service
data:
  # PL-05: the port libs/metrics serves /metrics on (the Service below).
  METRICS_PORT: '8293'
  WORKER_DOCUMENT_POLL_SECONDS: "1"
  WORKER_DOCUMENT_BATCH: "4"
  DOCUMENT_RAW_BUCKET: da-raw-docs
  # The local slice has no LiteLLM; chunks are embedded by the bge-m3 TEI directly.
  DOCUMENT_EMBED_URL: http://10.10.55.101:8003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-document
  namespace: dataagent-service
  labels: {app: worker-document, app.kubernetes.io/part-of: dataagent}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: worker-document}}
  template:
    metadata: {labels: {app: worker-document}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: worker-document
        image: dataagent/worker-document:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "services.worker_document.main"]
        # PL-05: /metrics for Prometheus (libs/metrics); nothing else listens here.
        ports:
        - containerPort: 8293
          name: metrics
        envFrom:
        - configMapRef: {name: dataagent-config}
        - configMapRef: {name: worker-document-env}
        - secretRef: {name: worker-document-secrets}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: "2", memory: 2Gi}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      enableServiceLinks: false
      serviceAccountName: worker-document
---
apiVersion: v1
kind: Service
metadata:
  name: worker-document
  namespace: dataagent-service
  labels:
    app: worker-document
    app.kubernetes.io/part-of: dataagent
spec:
  # PL-05: Prometheus' way in; the worker serves nothing but its metrics.
  selector:
    app: worker-document
  ports:
  - name: metrics
    port: 8293
    targetPort: 8293
