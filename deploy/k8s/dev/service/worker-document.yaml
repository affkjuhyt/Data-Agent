apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-document
  namespace: dataagent-service
  labels: {app: worker-document, app.kubernetes.io/part-of: dataagent}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-document-env
  namespace: dataagent-service
data:
  # PL-05: the port libs/metrics serves /metrics on (the Service below).
  METRICS_PORT: '8293'
  WORKER_DOCUMENT_POLL_SECONDS: "1"
  WORKER_DOCUMENT_BATCH: "4"
  DOCUMENT_RAW_BUCKET: da-raw-docs
  # The local slice has no LiteLLM; chunks are embedded by the bge-m3 TEI directly.
  DOCUMENT_EMBED_URL: http://10.10.55.101:8003
  # DI-03: Docling reads its models from the image (DOCLING_ARTIFACTS_PATH) and never the hub:
  # the cluster has no egress. Its caches go to the /tmp emptyDir, the root being read-only.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HOME: /tmp/huggingface
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-document
  namespace: dataagent-service
  labels: {app: worker-document, app.kubernetes.io/part-of: dataagent}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: worker-document}}
  template:
    metadata: {labels: {app: worker-document}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: worker-document
        image: dataagent/worker-document:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "services.worker_document.main"]
        # PL-05: /metrics for Prometheus (libs/metrics); nothing else listens here.
        ports:
        - containerPort: 8293
          name: metrics
        envFrom:
        - configMapRef: {name: dataagent-config}
        - configMapRef: {name: worker-document-env}
        - secretRef: {name: worker-document-secrets}
        # DI-03: Docling runs its layout and table models in process, about 1 page/s on 4 CPU
        # (DOCUMENT_INTELLIGENCE_SPEC §3.2): 4 CPU and 4Gi, one document at a time.
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: "4", memory: 4Gi}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        # The root filesystem is read-only; Docling, torch and Tesseract write their scratch here.
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: tmp
        emptyDir: {sizeLimit: 2Gi}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      enableServiceLinks: false
      serviceAccountName: worker-document
---
apiVersion: v1
kind: Service
metadata:
  name: worker-document
  namespace: dataagent-service
  labels:
    app: worker-document
    app.kubernetes.io/part-of: dataagent
spec:
  # PL-05: Prometheus' way in; the worker serves nothing but its metrics.
  selector:
    app: worker-document
  ports:
  - name: metrics
    port: 8293
    targetPort: 8293
