---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  namespace: dataagent-service
  labels:
    app: litellm
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-env
  namespace: dataagent-service
  labels:
    app: litellm
    app.kubernetes.io/part-of: dataagent
data:
  HF_HOME: /tmp/hf
  REDIS_HOST: redis.dataagent-database.svc.cluster.local
  REDIS_PORT: '8320'
  LLM_MAIN_BASE_URL: http://10.10.55.101:8001/v1
  LLM_FAST_BASE_URL: http://10.10.55.101:8002/v1
  EMBEDDING_V1_BASE_URL: http://10.10.55.101:8003/v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: dataagent-service
  labels:
    app: litellm
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
        app.kubernetes.io/part-of: dataagent
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main-stable
        args:
        - --config
        - /app/config.yaml
        - --port
        - '8500'
        ports:
        - containerPort: 8500
          name: http
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /health/liveliness
            port: 8500
          initialDelaySeconds: 1
          periodSeconds: 2
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: 8500
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: hf-cache
          mountPath: /tmp/hf
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: litellm-env
        - secretRef:
            name: litellm-secrets
      volumes:
      - name: hf-cache
        emptyDir:
          sizeLimit: 2Gi
      - name: config
        configMap:
          name: litellm-config
      - name: tmp
        emptyDir: {}
      serviceAccountName: litellm
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: dataagent-service
  labels:
    app: litellm
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: litellm
  ports:
  - port: 8500
    targetPort: 8500
    nodePort: 30500
    name: http
  type: NodePort
