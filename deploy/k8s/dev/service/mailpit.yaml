# Mailpit: the dev slice's mail server. It accepts every message the channel gateway sends
# (worker-agent channels/, SMTP on 1025) and shows them on http://localhost:30025; it never
# delivers outside. Production points SMTP_HOST at the organisation's mail server instead.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: dataagent-service
  labels:
    app: mailpit
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
        app.kubernetes.io/part-of: dataagent
    spec:
      automountServiceAccountToken: false
      containers:
      - name: mailpit
        image: axllent/mailpit:v1.20.4
        ports:
        - containerPort: 1025
          name: smtp
        - containerPort: 8025
          name: http
        env:
        - name: MP_MAX_MESSAGES
          value: "2000"
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /livez
            port: 8025
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: dataagent-service
  labels:
    app: mailpit
    app.kubernetes.io/part-of: dataagent
spec:
  type: NodePort
  selector:
    app: mailpit
  ports:
  - name: smtp
    port: 1025
    targetPort: 1025
  - name: http
    port: 8025
    targetPort: 8025
    nodePort: 30025
