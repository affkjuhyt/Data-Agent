---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: dataagent-service
  labels:
    app: frontend
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-env
  namespace: dataagent-service
  labels:
    app: frontend
    app.kubernetes.io/part-of: dataagent
data:
  VITE_KEYCLOAK_REALM: aeroflow
  VITE_KEYCLOAK_CLIENT: aeroflow-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dataagent-service
  labels:
    app: frontend
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: dataagent
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: frontend
        image: dataagent/frontend:latest
        ports:
        - containerPort: 8280
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8280
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 8280
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: frontend-env
        - secretRef:
            name: frontend-secrets
        command:
        - npm
        - run
        - dev
        - --
        - --host
        - 0.0.0.0
        - --port
        - '8280'
      volumes:
      - name: tmp
        emptyDir: {}
      serviceAccountName: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dataagent-service
  labels:
    app: frontend
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: frontend
  ports:
  - port: 8280
    targetPort: 8280
    name: http
  type: ClusterIP
