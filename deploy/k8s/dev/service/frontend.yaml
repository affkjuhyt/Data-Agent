---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: dataagent-service
  labels:
    app: frontend
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-env
  namespace: dataagent-service
  labels:
    app: frontend
    app.kubernetes.io/part-of: dataagent
data:
  VITE_KEYCLOAK_REALM: aeroflow
  VITE_KEYCLOAK_CLIENT: aeroflow-frontend
  DISABLE_HMR: 'true'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dataagent-service
  labels:
    app: frontend
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  # One-node local clusters run near their memory requests: a rolling update's
  # surge pod stays Pending and the deploy waits out wait_rollout with the old
  # code still serving. Recreate frees the old pod before scheduling the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: dataagent
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: frontend
        image: localhost:5000/dataagent/frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8280
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /
            port: 8280
          initialDelaySeconds: 1
          periodSeconds: 2
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8280
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: frontend-env
        - secretRef:
            name: frontend-secrets
        command:
        - npm
        - run
        - dev
        - --
        - --host
        - 0.0.0.0
        - --port
        - '8280'
      volumes:
      - name: tmp
        emptyDir: {}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      enableServiceLinks: false
      serviceAccountName: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dataagent-service
  labels:
    app: frontend
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: frontend
  ports:
  - port: 8280
    targetPort: 8280
    nodePort: 30280
    name: http
  type: NodePort
