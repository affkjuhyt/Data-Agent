---
apiVersion: v1
kind: Namespace
metadata:
  name: dataagent-service
  labels:
    name: dataagent-service
    app.kubernetes.io/part-of: dataagent
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: dataagent-service
spec:
  limits:
  - type: Container
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
