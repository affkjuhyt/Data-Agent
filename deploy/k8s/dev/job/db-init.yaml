---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-init
  namespace: dataagent-service
  labels:
    app: db-init
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-env
  namespace: dataagent-service
  labels:
    app: db-init
    app.kubernetes.io/part-of: dataagent
data:
  PGHOST: postgres.dataagent-database.svc.cluster.local
  PGUSER: admin
  PGDATABASE: dataagent
  PGPORT: '8300'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: dataagent-service
  labels:
    app: db-init
    app.kubernetes.io/part-of: dataagent
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: db-init
        app.kubernetes.io/part-of: dataagent
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
      - name: db-init
        image: postgres:16-alpine
        command:
        - sh
        - -c
        - |
          # The migrate Job applies the V3 baseline; org.organization is its first table.
          until psql -tAc "SELECT to_regclass('org.organization') IS NOT NULL" 2>/dev/null | grep -q t; do
            echo waiting for migrations; sleep 3
          done
          for f in /sql/*.sql; do echo applying $f; psql -v ON_ERROR_STOP=1 -f "$f"; done
          echo setting role passwords
          # DB_ROLE_PASSWORDS is a JSON object {"svc_qa": "...", ...} from the vault; each role
          # named there becomes a login with that password (design tab 3 D5.1).
          psql -v ON_ERROR_STOP=1 -v passwords="$DB_ROLE_PASSWORDS" \
            -v pgbouncer_auth_password="$PGBOUNCER_AUTH_PASSWORD" \
            -v app_user_password="$APP_USER_PASSWORD" <<'SQL'
          ALTER ROLE pgbouncer_auth WITH LOGIN PASSWORD :'pgbouncer_auth_password';
          ALTER ROLE app_user WITH LOGIN PASSWORD :'app_user_password';
          SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', key, value)
          FROM jsonb_each_text(:'passwords'::jsonb)
          WHERE key LIKE 'svc\_%'
          \gexec
          SQL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: sql
          mountPath: /sql
          readOnly: true
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: db-init-env
        - secretRef:
            name: db-init-secrets
      volumes:
      - name: sql
        configMap:
          name: db-init-sql
      - name: tmp
        emptyDir: {}
      serviceAccountName: db-init
