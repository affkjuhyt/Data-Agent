---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate
  namespace: dataagent-service
  labels:
    app: migrate
    app.kubernetes.io/part-of: dataagent
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: dataagent-service
  labels:
    app: migrate
    app.kubernetes.io/part-of: dataagent
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: migrate
        app.kubernetes.io/part-of: dataagent
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: localhost:5000/dataagent/migrate:latest
        imagePullPolicy: IfNotPresent
        command:
        - alembic
        - -c
        - alembic/alembic.ini
        - upgrade
        - heads
        envFrom:
        - secretRef:
            name: migrate-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      enableServiceLinks: false
      serviceAccountName: migrate
