---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eval
  namespace: dataagent-service
  labels:
    app: eval
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eval-env
  namespace: dataagent-service
  labels:
    app: eval
    app.kubernetes.io/part-of: dataagent
data:
  EVAL_AGENT_URL: http://kong.dataagent-service.svc.cluster.local:8000
  EVAL_DATA_SPACE_ID: a0000000-0000-0000-0000-000000000001
  EVAL_JUDGE_MODEL: judge
---
apiVersion: batch/v1
kind: Job
metadata:
  name: eval
  namespace: dataagent-service
  labels:
    app: eval
    app.kubernetes.io/part-of: dataagent
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: eval
        app.kubernetes.io/part-of: dataagent
    spec:
      restartPolicy: OnFailure
      containers:
      - name: eval
        image: localhost:5000/dataagent/eval:latest
        envFrom:
        - configMapRef:
            name: dataagent-config
        - configMapRef:
            name: eval-env
        - secretRef:
            name: eval-secrets
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: reports
          mountPath: /reports
        - name: tmp
          mountPath: /tmp
        command:
        - sh
        - -c
        - python -m model.eval.run --tier all --out /reports/eval-report.json && python -m model.eval.gate --report /reports/eval-report.json
      volumes:
      - name: reports
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      enableServiceLinks: false
      serviceAccountName: eval
