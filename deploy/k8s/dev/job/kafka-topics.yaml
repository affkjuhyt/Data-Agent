---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-topics
  namespace: dataagent-service
  labels:
    app: kafka-topics
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-topics-env
  namespace: dataagent-service
  labels:
    app: kafka-topics
    app.kubernetes.io/part-of: dataagent
data: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: dataagent-service
  labels:
    app: kafka-topics
    app.kubernetes.io/part-of: dataagent
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: kafka-topics
        app.kubernetes.io/part-of: dataagent
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
      - name: kafka-topics
        image: apache/kafka:3.7.0
        command:
        - bash
        - -c
        - "# INTERNAL:8352 has no SASL \u2014 those connections are ANONYMOUS, and\n# KAFKA_SUPER_USERS (kafka.yaml) lists User:ANONYMOUS as a\n# superuser, so this Job gets full admin rights (topic + ACL\n# management) here without needing any broker credentials.\nB=kafka.dataagent-database.svc.cluster.local:8352\nKT=/opt/kafka/bin/kafka-topics.sh\nKA=/opt/kafka/bin/kafka-acls.sh\n\nuntil $KT --bootstrap-server \"$B\" --list >/dev/null 2>&1; do echo waiting for kafka; sleep 3; done\n\n# The legacy knowledge base (kb-backend, kb-worker, web-crawler) was removed (KB-08): drop its\n# topics and every ACL on them; no-ops once they are gone.\nfor t in kb.promote.silver kb.promote.gold kb.structured.propose kb.resolve.conflict kb.ingestion.dlq; do\n  $KT --bootstrap-server \"$B\" --delete --if-exists --topic \"$t\"\n  $KA --bootstrap-server \"$B\" --remove --force --topic \"$t\"\ndone\n\n# The platform workers and the legacy runtime, the only clients of these topics,\n# were removed: drop the topics, every ACL on them and the\n# consumer groups; no-ops once they are gone.\nfor t in audit.data.access memory.extraction.requested memory.extraction.dlq ddl.changes; do\n  $KT --bootstrap-server \"$B\" --delete --if-exists --topic \"$t\"\n  $KA --bootstrap-server \"$B\" --remove --force --topic \"$t\"\ndone\nfor g in audit-consumer-group memory-consumer-group schema-crawler-worker-group; do\n  $KA --bootstrap-server \"$B\" --remove --force --group \"$g\"\ndone\n\n# Release management was removed. Drop its topics and every ACL on them (and\n# on its consumer group) explicitly; both are no-ops once they are gone.\nfor t in release.pipeline.triggered release.pipeline.status release.rollback.initiated; do\n  $KT --bootstrap-server \"$B\" --delete --if-exists --topic \"$t\"\n  $KA --bootstrap-server \"$B\" --remove --force --topic \"$t\"\ndone\n$KA --bootstrap-server \"$B\" --remove --force --group release_worker-group\n"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: kafka-topics-env
      volumes:
      - name: tmp
        emptyDir: {}
      serviceAccountName: kafka-topics
