---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-topics
  namespace: dataagent-service
  labels:
    app: kafka-topics
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-topics-env
  namespace: dataagent-service
  labels:
    app: kafka-topics
    app.kubernetes.io/part-of: dataagent
data: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: dataagent-service
  labels:
    app: kafka-topics
    app.kubernetes.io/part-of: dataagent
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: kafka-topics
        app.kubernetes.io/part-of: dataagent
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
      - name: kafka-topics
        image: apache/kafka:3.7.0
        command:
        - bash
        - -c
        - "# INTERNAL:8352 has no SASL \u2014 those connections are ANONYMOUS, and\n# KAFKA_SUPER_USERS (kafka.yaml) lists User:ANONYMOUS as a\n# superuser, so this Job gets full admin rights (topic + ACL\n# management) here without needing any broker credentials.\nB=kafka.dataagent-database.svc.cluster.local:8352\nKT=/opt/kafka/bin/kafka-topics.sh\nKA=/opt/kafka/bin/kafka-acls.sh\n\nuntil $KT --bootstrap-server \"$B\" --list >/dev/null 2>&1; do echo waiting for kafka; sleep 3; done\n\n# The legacy knowledge base (kb-backend, kb-worker, web-crawler) was removed (KB-08): drop its\n# topics and every ACL on them; no-ops once they are gone.\nfor t in kb.promote.silver kb.promote.gold kb.structured.propose kb.resolve.conflict kb.ingestion.dlq; do\n  $KT --bootstrap-server \"$B\" --delete --if-exists --topic \"$t\"\n  $KA --bootstrap-server \"$B\" --remove --force --topic \"$t\"\ndone\n\n# Every SASL principal needs an explicit ACL per topic\n# (workflow_runtime's audit.data.access WRITE has no grant\n# otherwise: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND is 'false', so\n# the produce silently stalls \u2014 metadata refresh keeps retrying\n# the authorization failure instead of raising it \u2014 until the\n# client's own 60s timeout, taking the whole request down with it).\n$KT --bootstrap-server \"$B\" --create --if-not-exists --topic audit.data.access --partitions 6 --replication-factor 1 --config retention.ms=7776000000 --config cleanup.policy=delete\n$KT --bootstrap-server \"$B\" --create --if-not-exists --topic memory.extraction.requested --partitions 3 --replication-factor 1 --config retention.ms=604800000 --config cleanup.policy=delete\n$KT --bootstrap-server \"$B\" --create --if-not-exists --topic memory.extraction.dlq --partitions 1 --replication-factor 1 --config retention.ms=2592000000 --config cleanup.policy=delete\n$KT --bootstrap-server \"$B\" --create --if-not-exists --topic ddl.changes --partitions 3 --replication-factor 1 --config retention.ms=604800000 --config cleanup.policy=delete\n\n$KA --bootstrap-server \"$B\" --add --allow-principal User:workflow_runtime --operation Write --operation Describe --topic audit.data.access\n$KA --bootstrap-server \"$B\" --add --allow-principal User:audit-consumer --operation Read --operation Describe --topic audit.data.access\n$KA --bootstrap-server \"$B\" --add --allow-principal User:audit-consumer --operation Read --group audit-consumer-group\n\n# Release management was removed. --create/--add above are idempotent and\n# never undo an earlier run, so drop its topics and every ACL on them (and\n# on its consumer group) explicitly; both are no-ops once they are gone.\nfor t in release.pipeline.triggered release.pipeline.status release.rollback.initiated; do\n  $KT --bootstrap-server \"$B\" --delete --if-exists --topic \"$t\"\n  $KA --bootstrap-server \"$B\" --remove --force --topic \"$t\"\ndone\n$KA --bootstrap-server \"$B\" --remove --force --group release_worker-group\n\n$KA --bootstrap-server \"$B\" --add --allow-principal User:workflow_runtime --operation Write --operation Describe --topic memory.extraction.requested\n$KA --bootstrap-server \"$B\" --add --allow-principal User:memory-consumer --operation Read --operation Describe --topic memory.extraction.requested\n$KA --bootstrap-server \"$B\" --add --allow-principal User:memory-consumer --operation Write --operation Describe --topic memory.extraction.dlq\n$KA --bootstrap-server \"$B\" --add --allow-principal User:memory-consumer --operation Read --group memory-consumer-group\n\n$KA --bootstrap-server \"$B\" --add --allow-principal User:schema-crawler-worker --operation Read --operation Describe --topic ddl.changes\n$KA --bootstrap-server \"$B\" --add --allow-principal User:schema-crawler-worker --operation Read --group schema-crawler-worker-group\n\n# promotion_mode=auto: the worker itself queues Silver then Gold for a scheduled\n# source instead of waiting for a human click. kb-backend/kb-promote-silver/gold\n# reach these topics via the unauthenticated internal listener, but this\n# worker's principal is SASL-restricted, so it needs an explicit grant.\n"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: kafka-topics-env
      volumes:
      - name: tmp
        emptyDir: {}
      serviceAccountName: kafka-topics
