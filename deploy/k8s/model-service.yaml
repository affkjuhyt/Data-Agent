# model-service (embed/rerank/LLM gateway) — Deployment + Service + HPA.
#
# Pure gateway image: no local weights, no torch. Embedding and reranking are
# served by TEI and the LLM by vLLM on the GPU server; this service only proxies
# and batches. The four REMOTE_* endpoints come from the shared ConfigMap
# (deploy/k8s/config.yaml) — they point across the VPN at the GPU host, so they
# are cluster-specific wiring, not per-file values.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-service
  labels: { app: model-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: model-service }
  template:
    metadata:
      labels: { app: model-service }
    spec:
      containers:
        - name: model-service
          image: REGISTRY/model_service:latest
          ports:
            - containerPort: 8001
          env:
            - { name: EMBED_CACHE_ENABLED, value: "true" }
            - { name: EMBED_BATCH_ENABLED, value: "true" }
            - { name: EMBED_BATCH_MAX, value: "64" }
            - { name: EMBED_BATCH_WAIT_MS, value: "8" }
            # Remote inference backends — values live in the dataagent-config
            # ConfigMap so every consumer agrees on the same GPU endpoints.
            - name: REMOTE_EMBED_URL
              valueFrom:
                configMapKeyRef: { name: dataagent-config, key: REMOTE_EMBED_URL }
            - name: REMOTE_RERANK_URL
              valueFrom:
                configMapKeyRef: { name: dataagent-config, key: REMOTE_RERANK_URL }
            - name: REMOTE_LLM_URL
              valueFrom:
                configMapKeyRef: { name: dataagent-config, key: REMOTE_LLM_URL }
            - name: REMOTE_LLM_MODEL
              valueFrom:
                configMapKeyRef: { name: dataagent-config, key: REMOTE_LLM_MODEL }
          resources:
            # A tiny HTTP proxy: no model in memory, CPU is only request
            # marshalling and the embed cache.
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 5       # nothing to load — the app just binds
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: model-service
spec:
  selector: { app: model-service }
  ports:
    - { port: 8001, targetPort: 8001 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: model-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-service
  minReplicas: 2
  # The GPU server is the real capacity; replicas here only add connection
  # fan-in and cache locality, so the cap is low.
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120   # stateless proxy — nothing expensive to reload
