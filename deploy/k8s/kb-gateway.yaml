# kb-gateway (Go edge/BFF) — Deployment + Service + HPA.
# The CCU front door: cheap goroutine concurrency, DDoS + per-tenant limits.
# Apply: kubectl apply -f deploy/k8s/kb-gateway.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kb-gateway
  labels: { app: kb-gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: kb-gateway }
  template:
    metadata:
      labels: { app: kb-gateway }
    spec:
      containers:
        - name: kb-gateway
          image: REGISTRY/kb-gateway:latest   # built from backend/services/kb-gateway/Dockerfile
          ports:
            - containerPort: 8000
          env:
            - { name: KB_BACKEND_URL, value: "http://kb-backend:8000" }
            - { name: KB_COMPUTE_URL, value: "http://kb-compute:8600" }
            # Edge protection (KB-SCALE-10K #6). Tune to fleet size.
            - { name: KB_GATEWAY_RATE_RPS, value: "50" }        # per tenant
            - { name: KB_GATEWAY_GLOBAL_RPS, value: "3000" }    # per replica, total
            - { name: KB_GATEWAY_IP_RPS, value: "100" }         # per source IP
            - { name: KB_GATEWAY_MAX_CONCURRENT, value: "500" } # in-flight cap
          resources:
            requests: { cpu: "100m", memory: "32Mi" }
            limits:   { cpu: "500m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kb-gateway
spec:
  selector: { app: kb-gateway }
  ports:
    - { port: 8000, targetPort: 8000 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kb-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kb-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120   # avoid flapping
