# workflow-runtime (Python FastAPI + LangGraph) — Deployment + Service + HPA.
#
# The agent execution tier: planner → retrieval (kb_search/MCP/tools/DB) →
# responder → judge. Stateless per request; all state is in Postgres/Mongo/Redis,
# so it scales horizontally. Long-lived SSE turns make it unusual in two ways
# that this manifest handles explicitly — see terminationGracePeriodSeconds and
# the HPA's scaleDown window below.
#
# NOT exposed outside the cluster. Compose keeps the port off the host because
# Kong's runtime-route is the only way in and the service rejects anything that
# arrives without a gateway key or a signed service assertion. A ClusterIP
# Service is the same statement in k8s: reachable from inside, not from outside.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-runtime
  labels: { app: workflow-runtime, app.kubernetes.io/part-of: dataagent }
spec:
  replicas: 2
  selector:
    matchLabels: { app: workflow-runtime }
  template:
    metadata:
      labels: { app: workflow-runtime }
    spec:
      # A turn in flight is a user watching a half-written answer. 60s lets the
      # current SSE stream finish instead of cutting it off at the default 30.
      terminationGracePeriodSeconds: 60
      initContainers:
        # The ordering edge compose gets from `depends_on: {migrate:
        # service_completed_successfully}`. Blocks until the database itself
        # reports the schema at head, so a pod that starts during a rolling
        # upgrade — or a scale-up mid-migration — never serves on a schema its
        # code does not match. `alembic current` prints "<rev> (head)" only when
        # the applied revision IS the head; an empty or behind database prints
        # neither, and the loop waits.
        - name: wait-for-migrations
          image: REGISTRY/dataagent-alembic:latest   # same image as migrate-job.yaml
          command:
            - sh
            - -c
            - |
              until alembic -c alembic/alembic.ini current 2>/dev/null | grep -q '(head)'; do
                echo "waiting for alembic to reach head..."
                sleep 5
              done
              echo "schema at head"
          envFrom:
            - secretRef: { name: dataagent-secrets }   # DATABASE_URL
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "250m", memory: "256Mi" }
      containers:
        - name: workflow-runtime
          image: REGISTRY/workflow-runtime:latest   # built from backend/services/workflow-runtime/Dockerfile
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef: { name: dataagent-config }
            # DATABASE_URL, RUNTIME_DB_URL, SERVICE_AUTH_SECRET, GATEWAY_KEY,
            # LANGFUSE_*, KAFKA_SASL_PASSWORD, OPENBAO_ROLE_ID/SECRET_ID.
            - secretRef: { name: dataagent-secrets }
          env:
            # Per-service values — `env` overrides `envFrom`, so these win over
            # anything of the same name in the ConfigMap.
            - { name: OTEL_SERVICE_NAME, value: "workflow-runtime" }
            - { name: KAFKA_SASL_USERNAME, value: "workflow-runtime" }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
          readinessProbe:
            # /health is deliberately left open (app.py) — the gateway's upstream
            # probe and the compose healthcheck both need it, and so does kubelet.
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 30
          volumeMounts:
            # Optional mutual TLS to kb-backend. Read-only: this service presents
            # a client certificate, it never issues one.
            - { name: mtls-certs, mountPath: /certs, readOnly: true }
      volumes:
        # optional: true — the Secret does not have to exist. mTLS is opt-in
        # (MTLS_CLIENT_CERT/_KEY/_CA_CERT unset = plain TLS to kb-backend), and a
        # missing Secret must not wedge the whole tier in ContainerCreating.
        # When you do use it, create it from deploy/docker/certs/gen-certs.sh output and
        # set the three MTLS_* vars in dataagent-secrets to /certs/<file>.
        - name: mtls-certs
          secret:
            secretName: mtls-certs
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-runtime
  labels: { app: workflow-runtime }
spec:
  selector: { app: workflow-runtime }
  ports:
    - { port: 8001, targetPort: 8001 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workflow-runtime
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workflow-runtime
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
  behavior:
    scaleDown:
      # Longer than the KB tier's 120-180s: a turn can legitimately run for
      # minutes (retrieval + several model calls), and CPU drops to near-idle
      # while it waits on the model. Scaling in on that idle would kill turns
      # that are simply blocked on an upstream.
      stabilizationWindowSeconds: 300
