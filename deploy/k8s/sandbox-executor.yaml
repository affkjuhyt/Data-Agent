# sandbox-executor — Deployment + Service + NetworkPolicy.
#
# ⚠ THE ONE MANIFEST IN THIS DIRECTORY WITH NODE-LEVEL PREREQUISITES. Everything
# else here is ordinary stateless HTTP. This service runs *user-supplied code*,
# which means it needs a container engine of its own, and how you get one differs
# per cluster. Read the "Docker engine" section below before applying it.
#
# What it is: the hub of the hub-and-spoke isolation model. It is the only
# component holding a container engine and the read-only warehouse credentials;
# workflow-runtime calls it over HTTP and never executes anything itself. The
# NetworkPolicy at the bottom is that boundary written down.
#
# ── Docker engine ────────────────────────────────────────────────────────────
# Compose mounts the host's /var/run/docker.sock as a documented fallback, with
# a rootless docker-in-docker sidecar (`sandbox-dockerd`) as the intended shape.
# On k8s the fallback is not available to copy: nodes commonly run containerd,
# there is no docker.sock to mount, and mounting one would hand a sandbox escape
# the node's root. So the sidecar is the only shape offered here.
#
# It needs, from the node:
#   * Unconfined seccomp + AppArmor (set below). Standard for any DinD — the
#     outer profiles block unshare/mount, which the inner daemon needs.
#   * /dev/fuse, if you want fuse-overlayfs. k8s has no `devices:` field; you
#     get it from a device plugin (e.g. smarter-device-manager) or not at all.
#     Without it the daemon falls back to the vfs storage driver — correct but
#     slow, since every sandbox container copies the whole image. DOCKER_DRIVER
#     below sets vfs explicitly rather than letting it fail and guess.
#   * `kernel.apparmor_restrict_unprivileged_userns=0`. Where that sysctl is 1
#     (Ubuntu 23.10+ default) rootless DinD cannot start at all — the same wall
#     documented on `sandbox-dockerd` in infra/docker-compose.app.yml.
#
# UNVERIFIED against a live cluster: this repo has no cluster to test it on.
# Treat it as the starting point it is, not as a known-good manifest — validate
# it on a scratch namespace before it carries real traffic. If your platform
# offers gVisor or Kata, prefer a RuntimeClass on the sandbox pods over this
# sidecar entirely (that is what SANDBOX_RUNTIME=runsc buys in compose).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-executor
  labels: { app: sandbox-executor, app.kubernetes.io/part-of: dataagent }
spec:
  # Not autoscaled on CPU: a warm container pool per replica is the unit of
  # capacity, and SANDBOX_POOL_SIZE is the knob. Scale replicas deliberately.
  replicas: 1
  selector:
    matchLabels: { app: sandbox-executor }
  template:
    metadata:
      labels: { app: sandbox-executor }
    spec:
      terminationGracePeriodSeconds: 60   # let in-flight jobs finish
      initContainers:
        # Native sidecar (restartPolicy: Always — k8s ≥ 1.29). Declared as an
        # initContainer so it is UP before the containers below start; a plain
        # sidecar container would race the runner-image load and the app's first
        # job. On an older cluster, move this to `containers` and accept the race.
        - name: dockerd
          image: docker:27-dind-rootless
          restartPolicy: Always
          env:
            # Plaintext on loopback inside the pod's own network namespace — the
            # same trust boundary compose relies on, one scope tighter (there it
            # was a docker network, here nothing outside the pod can reach it).
            - { name: DOCKER_TLS_CERTDIR, value: "" }
            # Rootless dockerd's real socket is /run/user/1000/docker.sock, not
            # the CLI's default path — without this the health check below
            # cannot talk to a daemon that is actually up.
            - { name: DOCKER_HOST, value: "tcp://localhost:2375" }
            # See /dev/fuse above. Drop this line once fuse-overlayfs is available.
            - { name: DOCKER_DRIVER, value: "vfs" }
          securityContext:
            appArmorProfile: { type: Unconfined }
            seccompProfile:  { type: Unconfined }
          volumeMounts:
            - { name: dockerd-data, mountPath: /home/rootless/.local/share/docker }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "2",    memory: "2Gi" }
          startupProbe:
            exec: { command: ["docker", "info"] }
            periodSeconds: 5
            failureThreshold: 24   # 2 min — rootless dockerd is slow to come up
        # Compose's `sandbox-image-loader`, ported. A separate engine means a
        # separate image store: the runner image the node already has is
        # invisible to the daemon above, so it has to be put there. Pulled and
        # re-tagged rather than built — a build needs the context, and CI has
        # already built this image from services/sandbox-executor/sandbox_runner.
        - name: load-sandbox-runner
          image: docker:27-cli
          env:
            - { name: DOCKER_HOST, value: "tcp://localhost:2375" }
          command:
            - sh
            - -c
            - |
              set -eu
              docker pull REGISTRY/sandbox-runner:latest
              docker tag REGISTRY/sandbox-runner:latest sandbox-runner:latest
              echo "sandbox-runner:latest present in the sidecar's image store"
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
      containers:
        - name: sandbox-executor
          image: REGISTRY/sandbox-executor:latest   # built from services/sandbox-executor/Dockerfile
          ports:
            - containerPort: 8500
          envFrom:
            - configMapRef: { name: dataagent-config }
            # MINIO_ACCESS_KEY/MINIO_SECRET_KEY, and the warehouse read-only
            # credentials this service is the sole holder of.
            - secretRef: { name: dataagent-secrets }
          env:
            - { name: OTEL_SERVICE_NAME, value: "sandbox-executor" }
            # The sidecar, over the pod's loopback. Unset would mean
            # docker.from_env() — i.e. a node socket that should not exist here.
            - { name: SANDBOX_DOCKER_HOST, value: "tcp://localhost:2375" }
            # Per-job limits (doc §I). Unchanged from compose.
            - { name: SANDBOX_TIMEOUT_S, value: "10" }
            - { name: SANDBOX_MEMORY_MB, value: "256" }
            - { name: SANDBOX_CPUS, value: "0.5" }
            - { name: SANDBOX_POOL_SIZE, value: "3" }
            - { name: SANDBOX_SQL_QUEUE_WORKERS, value: "5" }
            # Default engine for an /execute/sql request that does not name its
            # own connection.type. "postgres" for a cluster with no Snowflake.
            - { name: SANDBOX_SQL_BACKEND, value: "snowflake" }
            # Circuit breaker — still the placeholder window/threshold/cooldown
            # from compose, enforced by operator decision ahead of tuning. Watch
            # for OPEN/HALF_OPEN lines rejecting legitimate traffic.
            - { name: SANDBOX_BREAKER_ENFORCE, value: "true" }
            - { name: SANDBOX_BREAKER_WINDOW_S, value: "60" }
            - { name: SANDBOX_BREAKER_THRESHOLD, value: "5" }
            - { name: SANDBOX_BREAKER_COOLDOWN_S, value: "30" }
            # gVisor for the inner containers. Empty = the sidecar's default
            # runc. Set to "runsc" only once runsc is installed in that sidecar.
            - { name: SANDBOX_RUNTIME, value: "" }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "2",    memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 8500 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8500 }
            initialDelaySeconds: 30
      volumes:
        # emptyDir: the image store is a cache, and the pull above rebuilds it.
        # A PVC here would save that pull on every restart — worth it if the
        # runner image is large, but it makes the pod stateful. Deliberate
        # default: stateless, pay the pull.
        - name: dockerd-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-executor
  labels: { app: sandbox-executor }
spec:
  selector: { app: sandbox-executor }
  ports:
    - { port: 8500, targetPort: 8500 }
---
# The hub-and-spoke boundary, enforced rather than documented: workflow-runtime
# is the only thing that may reach the code-execution tier. Compose gets a
# weaker version of this for free (no published port); a flat cluster network
# gives it away by default, so it has to be stated.
#
# Requires a CNI that enforces NetworkPolicy (Calico, Cilium, …). On a CNI that
# ignores them this object applies cleanly and protects nothing — check before
# relying on it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-executor-ingress
spec:
  podSelector:
    matchLabels: { app: sandbox-executor }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: workflow-runtime }
      ports:
        - { protocol: TCP, port: 8500 }
