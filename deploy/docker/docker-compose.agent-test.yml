# Agent E2E perf-test overlay. Points LiteLLM at the host ollama so a full agent
# turn (planner → responder → judge → …) runs offline for measurement. Layer on
# base + app.yml and bring up only the services one turn needs (NOT app.yml's
# kb-backend — it collides with the kb_e2e stack on :8050):
#
#   docker compose -f deploy/docker/docker-compose.yml -f deploy/docker/docker-compose.app.yml \
#     -f deploy/docker/docker-compose.agent-test.yml up -d \
#     litellm openbao orchestrator workflow-runtime sandbox-executor memory-consumer
services:
  litellm:
    volumes:
      - ./litellm/config.agent-local.yaml:/app/config.yaml:ro

  # langfuse v3 headless init only runs when ORG_ID + PROJECT_ID are set (NAME alone
  # is skipped), so without these the pk-lf-dev/sk-lf-dev keys are never created and
  # every trace ingest is rejected "Invalid credentials". Set stable IDs so init
  # creates the org/project + those keys.
  langfuse:
    environment:
      LANGFUSE_INIT_ORG_ID: gtel-org
      LANGFUSE_INIT_PROJECT_ID: data-agent-proj
      # langfuse v3 needs Redis (API-key cache + queues); the base compose only
      # depends_on redis without setting the connection → auth failed ("Invalid
      # credentials" via fetchApiKeyAndAddToRedis).
      REDIS_CONNECTION_STRING: redis://redis:6379

  # The orchestrator/runtime default REDIS_URL to localhost — point them at the
  # redis container so session/cache ops work (they reconnect-loop otherwise).
  # OTEL_SDK_DISABLED stops the per-request span export to jaeger:4317 (which isn't
  # running) — it was spamming "export timeout" and adding request overhead.
  orchestrator:
    environment:
      REDIS_URL: redis://redis:6379
      OTEL_SDK_DISABLED: "false"
      # Small cap on this single-GPU box so admission control is easy to see;
      # size to the LLM tier's real parallelism in prod (default 8).
      ORCHESTRATOR_MAX_CONCURRENT_TURNS: "2"
  workflow-runtime:
    environment:
      REDIS_URL: redis://redis:6379
      OTEL_SDK_DISABLED: "false"

# auth-api references kong-admin-net (defined only in docker-compose.security.yml).
# Declare it external here so bringing auth-api up with this overlay resolves it to
# the pre-created network (docker network create --internal --subnet 172.30.0.0/24
# kong-admin-net) instead of failing with "network is ambiguous".
networks:
  kong-admin-net:
    external: true
