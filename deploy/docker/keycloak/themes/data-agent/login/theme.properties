# Data Agent login theme: Keycloak's own pages (AD password, one-time code, set-up, errors)
# drawn like the app's login page (Figma "v3.1 · Đăng nhập"), so signing in never looks like
# leaving Data Agent. Inherits every page from the keycloak theme; only the shell
# (template.ftl), the stylesheet and the Vietnamese strings are ours. PatternFly is dropped,
# so the classes the inherited pages use are styled in css/data-agent.css.
parent=keycloak
import=common/keycloak

styles=css/data-agent.css
stylesCommon=

locales=vi

kcFormPasswordVisibilityIconShow=da-eye
kcFormPasswordVisibilityIconHide=da-eye da-eye-off
kcFeedbackErrorIcon=da-dot
kcFeedbackWarningIcon=da-dot
kcFeedbackSuccessIcon=da-dot
kcFeedbackInfoIcon=da-dot
kcResetFlowIcon=da-restart
