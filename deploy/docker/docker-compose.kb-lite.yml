# ── KB-LITE: M3 (18GB) resource-capped overlay ───────────────────────────────
# Apply ON TOP of the base compose so the KB stack fits an Apple-Silicon laptop
# without swapping. It ONLY caps heap/memory of the services the base file
# already defines — it starts nothing new, and does NOT run the observability
# stack (elasticsearch, clickhouse, langfuse, kibana, filebeat, jaeger).
#
# Bring up the LITE KB infra (base + this overlay, KB profile, explicit list so
# no observability tags in):
#   docker compose -f deploy/docker/docker-compose.yml -f deploy/docker/docker-compose.kb-lite.yml \
#     --env-file .env --profile kb up -d \
#     postgres redis mongo qdrant neo4j minio kafka keycloak kong
# Then the KB app services (kb-e2e attaches to the same network):
#   docker compose -f deploy/docker/docker-compose.kb-e2e.yml --env-file deploy/docker/.env.kb-testing up -d \
#     model-service kb-backend kb-ingestion-worker
#
# Budget (see docs/M3-CAPACITY.md): infra ~2.2GB + KB app ~1.2GB, leaving the
# ~8GB VM plenty of headroom and ~3GB on the host for native ollama (3B model).

services:
  # ── JVM/heavy stores — the big wins. Base config asks for 4g+3g Neo4j heap and
  #    a 10G limit; that's laptop-hostile. Cap hard. ──────────────────────────
  neo4j:
    environment:
      NEO4J_server_memory_heap_initial__size: '384m'
      NEO4J_server_memory_heap_max__size: '384m'
      NEO4J_server_memory_pagecache_size: '256m'
    deploy:
      resources:
        # Base reserves 10G/4cpu — override BOTH (reservation must be <= limit).
        limits:
          cpus: '2.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 384M

  mongo:
    # WiredTiger defaults to 50% of RAM for its cache — cap it small for dev.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    deploy:
      resources:
        limits:
          memory: 512M

  kafka:
    environment:
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Light stores — modest caps, mostly to stop runaway growth. ──────────────
  postgres:
    deploy:
      resources:
        limits:
          memory: 384M
  qdrant:
    deploy:
      resources:
        limits:
          memory: 384M
  minio:
    deploy:
      resources:
        limits:
          memory: 256M
  redis:
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Auth/gateway — JVM Keycloak is the heavier of the two. ──────────────────
  keycloak:
    environment:
      JAVA_OPTS_KC_HEAP: "-Xms192m -Xmx384m"
    deploy:
      resources:
        limits:
          memory: 512M
  kong:
    environment:
      KONG_MEM_CACHE_SIZE: "64m"
    deploy:
      resources:
        limits:
          memory: 256M
