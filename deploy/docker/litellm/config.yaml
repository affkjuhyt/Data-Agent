# LiteLLM model routing — GPU server A100 40GB (10.10.55.101) since 04-09-2026.
#
# Backends (see .env — all *_BASE_URL vars resolve there, litellm reads them
# via `os.environ/` at startup):
#   agent-main  Qwen3-14B-AWQ   vLLM   :8001  (accuracy tier)
#   agent-fast  Qwen3-4B-AWQ    vLLM   :8002  (routing/rewrite tier)
#   BAAI/bge-m3 TEI             :8003  (OpenAI-compatible /v1/embeddings)
#   bge-reranker-v2-m3 TEI      :8004  (reached via model_service /rerank, not litellm)
#
# Services address ALIASES only — swap a backend here, no code changes.
# `chat_template_kwargs.enable_thinking: false` — Qwen3 defaults to emitting
# <think> blocks; every alias below feeds a JSON parser or a latency-sensitive
# path, so thinking is off globally. Re-enable per-alias only after an eval
# shows the quality is worth the tokens (responder/orchestrator-planner are the
# candidates — conversation_runner already strips <think> from responder output).
# No YAML anchors on purpose: litellm may mutate litellm_params per entry, and
# an anchor would make the entries share one object.

model_list:
  # planner is a blocking step on every request (intent + slot extraction,
  # JSON-schema output) before the responder ever starts streaming — moved to
  # agent-fast for latency. Re-validated via model/eval online tier (04-09-2026):
  # intent_accuracy and unsupported_recall must be re-checked after this change,
  # not just assumed from the agent-main baseline.
  - model_name: planner
    litellm_params:
      model: openai/agent-fast
      api_base: os.environ/LLM_FAST_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # ── accuracy tier → agent-main (Qwen3-14B-AWQ) ─────────────────────────────

  - model_name: responder
    litellm_params:
      model: openai/agent-main
      api_base: os.environ/LLM_MAIN_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: judge
    litellm_params:
      # Must differ from `responder` (agent-main) — a model grading its own
      # answers is a well-known eval anti-pattern. First live model/eval run
      # (04-09-2026) had judge == responder and hallucination_rate came back
      # 0.60 even though the deterministic unsupported_number_rate was 0.00 —
      # consistent with self-grading bias, not real hallucination.
      model: openai/agent-fast
      api_base: os.environ/LLM_FAST_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: text_to_sql
    litellm_params:
      model: openai/agent-main
      api_base: os.environ/LLM_MAIN_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: orchestrator-planner
    litellm_params:
      model: openai/agent-main
      api_base: os.environ/LLM_MAIN_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # Was missing from this file although orchestrator code defaults to it
  # (ORCHESTRATOR_JUDGE_MODEL → openai/orchestrator-judge).
  - model_name: orchestrator-judge
    litellm_params:
      model: openai/agent-main
      api_base: os.environ/LLM_MAIN_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # ── fast tier → agent-fast (Qwen3-4B-AWQ) ──────────────────────────────────
  - model_name: guardrail
    litellm_params:
      model: openai/agent-fast
      api_base: os.environ/LLM_FAST_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: rewriter
    litellm_params:
      model: openai/agent-fast
      api_base: os.environ/LLM_FAST_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: suggester
    litellm_params:
      model: openai/agent-fast
      api_base: os.environ/LLM_FAST_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: visualize
    litellm_params:
      model: openai/agent-fast
      api_base: os.environ/LLM_FAST_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: orchestrator-summary
    litellm_params:
      model: openai/agent-fast
      api_base: os.environ/LLM_FAST_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # Legacy aliases (old llama.cpp on the host) — kept so existing callers keep
  # working, now served by the GPU fast tier.
  - model_name: local-qwen
    litellm_params:
      model: openai/agent-fast
      api_base: os.environ/LLM_FAST_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: local
    litellm_params:
      model: openai/agent-fast
      api_base: os.environ/LLM_FAST_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # ── embeddings → TEI bge-m3 (OpenAI-compatible /v1) ────────────────────────
  # Same model/vector space (1024-dim bge-m3) the stack already used via
  # model_service, so agent_memories / workflow_memory / schema_catalog stay valid.
  - model_name: embedder
    litellm_params:
      model: openai/BAAI/bge-m3
      api_base: os.environ/EMBEDDING_V1_BASE_URL
      api_key: not-needed

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  request_timeout: 600
  set_verbose: false
  json_logs: true
  # KHÔNG bật "langfuse" ở đây — proxy này log MỖI completion call thành 1
  # trace "litellm-acompletion" RIÊNG BIỆT, không biết gì về trace_id/OTEL
  # context của orchestrator/workflow_runtime, nên tạo ra hàng loạt trace rời
  # rạc thay vì nối vào đúng trace của request. Tracing giờ do app-level xử lý
  # (backend/services/workflow_runtime và orchestrator/ bên trong — xem observability.py
  # mỗi service: @observe() decorator + langfuse.langchain.CallbackHandler).
  # Disabled: ghcr.io/berriai/litellm:main-stable (pulled 05-09-2026) crashes
  # on every boot wiring this up — TypeError: Redis.__init__() got an
  # unexpected keyword argument 'redis_host'. litellm's redis_cache.py passes
  # cache_params through to redis-py using its own `redis_host`/`redis_port`
  # names, and this image's pinned redis-py version no longer accepts them
  # (wants `host`/`port`). Upstream version-skew bug, not a config issue —
  # re-enable once litellm bumps its redis-py pin (or pin an older litellm
  # image known to work) and confirm from a real litellm crash log, not just
  # this comment, since litellm changes fast.
  cache: false

