# Agent E2E overlay config — SAME aliases as config.yaml, now that the GPU
# server replaced the host-ollama offline setup (04-09-2026). Kept as a separate
# file because docker-compose.agent-test.yml mounts this path.
model_list:
  # ── accuracy tier → agent-main (Qwen3-14B-AWQ) ─────────────────────────────
  - model_name: planner
    litellm_params:
      model: openai/agent-main
      api_base: os.environ/LLM_MAIN_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: responder
    litellm_params:
      model: openai/agent-main
      api_base: os.environ/LLM_MAIN_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: judge
    litellm_params:
      model: openai/agent-main
      api_base: os.environ/LLM_MAIN_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: text_to_sql
    litellm_params:
      model: openai/agent-main
      api_base: os.environ/LLM_MAIN_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: orchestrator-planner
    litellm_params:
      model: openai/agent-main
      api_base: os.environ/LLM_MAIN_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # Was missing from this file although orchestrator code defaults to it
  # (ORCHESTRATOR_JUDGE_MODEL → openai/orchestrator-judge).
  - model_name: orchestrator-judge
    litellm_params:
      model: openai/agent-main
      api_base: os.environ/LLM_MAIN_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # ── fast tier → agent-fast (Qwen3-4B-AWQ) ──────────────────────────────────
  - model_name: guardrail
    litellm_params:
      model: openai/agent-fast
      api_base: os.environ/LLM_FAST_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: rewriter
    litellm_params:
      model: openai/agent-fast
      api_base: os.environ/LLM_FAST_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: suggester
    litellm_params:
      model: openai/agent-fast
      api_base: os.environ/LLM_FAST_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: visualize
    litellm_params:
      model: openai/agent-fast
      api_base: os.environ/LLM_FAST_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: orchestrator-summary
    litellm_params:
      model: openai/agent-fast
      api_base: os.environ/LLM_FAST_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # Legacy aliases (old llama.cpp on the host) — kept so existing callers keep
  # working, now served by the GPU fast tier.
  - model_name: local-qwen
    litellm_params:
      model: openai/agent-fast
      api_base: os.environ/LLM_FAST_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: local
    litellm_params:
      model: openai/agent-fast
      api_base: os.environ/LLM_FAST_BASE_URL
      api_key: not-needed
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # ── embeddings → TEI bge-m3 (OpenAI-compatible /v1) ────────────────────────
  # Same model/vector space (1024-dim bge-m3) the stack already used via
  # model_service, so agent_memories / workflow_memory / schema_catalog stay valid.
  - model_name: embedder
    litellm_params:
      model: openai/BAAI/bge-m3
      api_base: os.environ/EMBEDDING_V1_BASE_URL
      api_key: not-needed

# ── previous backend (Claude via host proxy :8089) — revert/fallback ─────────
#   - model_name: responder
#     litellm_params:
#       model: openai/sonnet
#       api_base: http://host.docker.internal:8089/v1
#       api_key: not-needed

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  request_timeout: 600
  set_verbose: false
  json_logs: true
  # KHÔNG bật "langfuse" ở đây — proxy này log MỖI completion call thành 1
  # trace "litellm-acompletion" RIÊNG BIỆT, không biết gì về trace_id/OTEL
  # context của orchestrator/workflow_runtime, nên tạo ra hàng loạt trace rời
  # rạc thay vì nối vào đúng trace của request. Tracing giờ do app-level xử lý
  # (backend/services/workflow_runtime và orchestrator/ bên trong — xem observability.py
  # mỗi service: @observe() decorator + langfuse.langchain.CallbackHandler).
  cache: true
  cache_params:
    type: redis
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
