# Local agent E2E test config — routes EVERY model the agent asks for
# (planner / responder / judge / summary / suggestion / guardrail / orchestrator-*)
# to the host ollama, so a full agent turn can run offline for perf measurement.
# The wildcard "*" is LiteLLM's catch-all: any unmatched model_name lands here.
model_list:
  - model_name: "*"
    litellm_params:
      model: ollama/qwen2.5:3b
      api_base: http://host.docker.internal:11434

  # Embeddings (KB/schema paths) — kept explicit so they don't hit the chat model.
  # MUST be a real embedding model, not a chat model. Pointing this at
  # qwen2.5:3b did return vectors (ollama will embed from any model's hidden
  # state) but at that model's hidden size, 2048 — while EMBEDDING_DIM and
  # every Qdrant collection on the platform are 1024 (BGE-M3). Nothing failed
  # loudly: the HTTP call succeeded and only the Qdrant upsert 400'd, so the
  # crawler/memory workers logged a per-item error and moved on, leaving every
  # collection permanently empty. bge-m3 here matches the production config.yaml
  # route (openai/bge-m3 via model_service) dimension-for-dimension.
  #   requires: ollama pull bge-m3
  - model_name: embedder
    litellm_params:
      model: ollama/bge-m3
      api_base: http://host.docker.internal:11434

litellm_settings:
  drop_params: true          # tolerate params ollama doesn't support
  request_timeout: 30        # fail a stuck LLM call fast so it frees the GPU slot
  num_retries: 0             # don't pile retries onto a contended GPU
# No master_key → no proxy auth (local perf test only), so agent services reach it
# without a key.
