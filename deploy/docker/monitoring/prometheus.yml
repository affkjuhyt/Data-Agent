global:
  scrape_interval: 5s
  evaluation_interval: 5s

# PL-05: the precomputed series the RUNBOOK's queries read (§4, metrics).
rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:8400"]
  # The api's /metrics is beside /healthz on its own port; the workers serve theirs alone on a
  # port of their own (libs/metrics). Same namespace, so the Service names resolve.
  - job_name: dataagent
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8290", "worker-agent:8291", "worker-ingest:8292", "worker-document:8293"]
