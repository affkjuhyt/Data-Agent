# Prometheus scrape config for the KB CCU dashboard (docs/KB-SCALE-10K.md #8).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Embed tier — cache hit-rate, batch efficiency, detected device.
  - job_name: model_service
    static_configs:
      - targets: ["model_service:8001"]

  # LLM tier — TTFT, tok/s, concurrent behaviour (probed via llm_exporter).
  - job_name: llm_exporter
    static_configs:
      - targets: ["llm_exporter:9200"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
