global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: model-service
    static_configs:
      - targets: ["model-service:8230"]

  - job_name: llm-exporter
    static_configs:
      - targets: ["llm-exporter:8270"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:8400"]
