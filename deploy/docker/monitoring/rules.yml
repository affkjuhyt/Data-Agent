# PL-05: the numbers a person reads, computed once a minute from the histograms of libs/metrics.
groups:
  - name: dataagent
    interval: 1m
    rules:
      # The time of a question: worker-agent's question.received, from claim to answer.
      - record: dataagent:question_seconds:p50_5m
        expr: histogram_quantile(0.5, sum by (le) (rate(dataagent_event_seconds_bucket{event_type="question.received"}[5m])))
      - record: dataagent:question_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(dataagent_event_seconds_bucket{event_type="question.received"}[5m])))
      - record: dataagent:http_request_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le, route) (rate(dataagent_http_request_seconds_bucket[5m])))
      - record: dataagent:http_5xx:ratio_5m
        expr: sum(rate(dataagent_http_requests_total{status="5xx"}[5m])) / sum(rate(dataagent_http_requests_total[5m]))
      - record: dataagent:events_error:ratio_5m
        expr: sum by (service, event_type) (rate(dataagent_events_total{outcome="error"}[5m])) / sum by (service, event_type) (rate(dataagent_events_total[5m]))
