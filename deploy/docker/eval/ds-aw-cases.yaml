# DS-AW eval cases: what a business user of the bicycle maker would ask of "AdventureWorks", the
# answer on AdventureWorksDW as `make adventureworks` loads it, and the hand-written SQL it comes from.
# deploy/docker/sql/v3-adventureworks-context.sql loads them as the eval set "Câu hỏi AdventureWorks";
# tests/unit/repo/test_adventureworks_eval_cases.py keeps the seed and this file the same, and
# tests/integration/worker_agent/test_adventureworks_reconciliation.py reruns every reference SQL on the
# real data. Several figures are a list: one per row in the order the answer gives them (a cut in its
# members' order, a top-N from the first, a comparison the period asked then the base period). The
# answers are a draft: two people solve docs/v3/eval/ds-aw-blind-sheet.md blind and a case they
# disagree on is reviewed.
eval_set: Câu hỏi AdventureWorks
cases:
- id: aw001
  question: Doanh thu năm 2013
  category: correct_result
  expected:
    kind: data
    metric: DOANH_THU
    values:
    - 49926384.4972
  reference_sql: SELECT (SELECT SUM(sales_amount) FROM fact_internet_sales WHERE order_date >= DATE '2013-01-01'
    AND order_date < DATE '2014-01-01') + (SELECT SUM(sales_amount) FROM fact_reseller_sales WHERE order_date
    >= DATE '2013-01-01' AND order_date < DATE '2014-01-01')
  note: both channels, each summed on its own table
