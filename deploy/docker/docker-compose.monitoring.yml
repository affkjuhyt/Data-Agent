# KB CCU observability (docs/KB-SCALE-10K.md #8).
# Attaches to the shared network so Prometheus can scrape model-service + llm-exporter.
# kb-gateway/kb-compute removed 30-08-2026 — rate limiting is now Kong's rate-limiting
# plugin on kb-backend, RRF runs in-process.
#
#   docker compose -f deploy/docker/docker-compose.monitoring.yml --env-file deploy/docker/.env.kb-testing \
#     --profile monitoring up -d --build
#
# Then: Grafana http://localhost:3000 (anonymous admin) → dashboard "KB — High CCU".
#       Prometheus http://localhost:9090
name: kb_monitoring

networks:
  default:
    external: true
    name: data-agent-network

services:
  # Probes the host LLM (ollama) and exposes generation perf as /metrics.
  llm-exporter:
    build:
      context: ../..
      dockerfile: backend/services/llm-exporter/Dockerfile
    image: llm-exporter:latest
    container_name: llm-exporter
    restart: unless-stopped
    environment:
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:11434}"
      LLM_MODEL: "${LLM_MODEL:-qwen2.5:1.5b}"
      PROBE_INTERVAL: "${LLM_PROBE_INTERVAL:-30}"
      PROBE_CONCURRENCY: "${LLM_PROBE_CONCURRENCY:-3}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: [monitoring]
    deploy:
      resources:
        limits:
          memory: 128M

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: dataagent-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2h"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: [monitoring]
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:11.2.0
    container_name: dataagent-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    profiles: [monitoring]
    deploy:
      resources:
        limits:
          memory: 256M
