# KB E2E stack — KB-OWNED services only.
#
# This file is STANDALONE (it no longer extends docker-compose.yml). It defines
# only the services the KB stack owns:
#
#     model-service, kb-backend, kb-ingestion-worker
#     + bootstrap jobs: minio-init, kong-setup, kb-seed
#
# Everything else — postgres, mongo, redis, qdrant, neo4j, minio, kafka,
# keycloak, kong — is SHARED infrastructure brought up by another stack
# (e.g. the base docker-compose.yml or the infra slice files). This file does
# NOT declare those services, so it can never clash with them on container
# names, host ports, or volumes. It simply attaches to the shared network and
# talks to whatever shared services are already running, by service name.
#
# PREREQUISITE: the shared infra must already be up so that the external network
# `data-agent-network` exists and postgres/neo4j/qdrant/etc. are reachable.
#
# Usage:
#     pwsh deploy/docker/kb-e2e.ps1                 # bring up KB-owned services
#     pwsh deploy/docker/kb-e2e.ps1 down            # tear down (keep volumes)
#     pwsh deploy/docker/kb-e2e.ps1 logs -f         # stream logs
#
#   Or directly:
#     docker compose \
#       -f deploy/docker/docker-compose.kb-e2e.yml \
#       --env-file deploy/docker/.env.kb-testing \
#       up -d --build

name: kb-e2e

# Attach to the network the shared infra already created. `external: true` means
# this project never creates or owns it — it only joins.
networks:
  default:
    external: true
    name: data-agent-network

volumes:
  docling_cache:

services:

  # ── Seed KB structural rows into the SHARED postgres ──────────────────────────
  # Replaces the old init-script mount (which only worked when this stack owned
  # postgres). Idempotent: seed.sql is all ON CONFLICT DO NOTHING.
  kb-seed:
    image: postgres:16-alpine
    container_name: kb-seed
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-admin}
      PGDATABASE: ${POSTGRES_DB:-dataagent}
    volumes:
      - ./postgres/seed.sql:/seed.sql:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        until pg_isready -h postgres -U "$${PGUSER}" -d "$${PGDATABASE}" >/dev/null 2>&1; do
          echo "kb-seed: waiting for shared postgres..."; sleep 2;
        done
        psql -v ON_ERROR_STOP=1 -f /seed.sql
        echo "kb-seed: KB seed applied."

  # ── Create the KB bucket on the SHARED minio ──────────────────────────────────
  minio-init:
    image: minio/mc
    container_name: kb-minio-init
    restart: "no"
    entrypoint: >
      sh -c "
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio_secret}; do
          echo 'minio-init: waiting for shared minio...'; sleep 2;
        done &&
        mc mb --ignore-existing local/knowledge-base &&
        echo 'MinIO: knowledge-base bucket ready.'
      "

  # ── Configure Kong routes + JWT plugin for KB services on the SHARED kong ──────
  kong-setup:
    image: python:3-alpine
    container_name: kb-kong-setup
    restart: "no"
    volumes:
      - ./kong:/scripts:ro
    environment:
      KONG_ADMIN_URL: http://dataagent-kong:8001
      KEYCLOAK_URL: http://dataagent-keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl bash > /dev/null 2>&1
        until curl -sf http://dataagent-kong:8001 >/dev/null 2>&1; do
          echo "kong-setup: waiting for shared kong admin..."; sleep 3;
        done
        until curl -sf http://dataagent-keycloak:8080/realms/aeroflow >/dev/null 2>&1; do
          echo "kong-setup: waiting for shared keycloak..."; sleep 3;
        done
        python3 -c "open('/tmp/k.sh','w').write(open('/scripts/kong-setup.sh').read().replace(chr(13),''))"
        bash /tmp/k.sh
    depends_on:
      kb-backend: { condition: service_started }

  # ── KB-owned: embedding/rerank/LLM gateway ────────────────────────────────────
  model-service:
    build:
      context: ../../backend/services/model-service
    container_name: kb-model-service
    restart: unless-stopped
    ports:
      - "8600:8001"
    environment:
      # Multilingual (Vietnamese corpus) — must match the weights cached in
      # ../../backend/services/model-service/models and the dim of the Qdrant collections.
      EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-small}
      RERANK_MODEL: ${RERANK_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      REMOTE_EMBED_URL: ${REMOTE_EMBED_URL:-}
      REMOTE_RERANK_URL: ${REMOTE_RERANK_URL:-}
      REMOTE_API_KEY: ${REMOTE_API_KEY:-}
      # LLM gateway → host ollama (OpenAI-compat) pinned to a small model for the
      # canonicalize/extraction step (docs/KB-SCALE-10K.md §6: 1.5b ~1.7× faster than 3b,
      # ample for structured extraction). Override for a remote GPU / larger model.
      REMOTE_LLM_URL: ${REMOTE_LLM_URL:-http://host.docker.internal:11434}
      REMOTE_LLM_KEY: ${REMOTE_LLM_KEY:-}
      REMOTE_LLM_MODEL: ${REMOTE_LLM_MODEL:-qwen2.5:1.5b}
      OMP_NUM_THREADS: "2"
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-admin}@postgres/${POSTGRES_DB:-dataagent}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Weights download here on first start and persist across recreates.
      - ../../backend/services/model-service/models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      # First start downloads the embed + rerank models into the volume above.
      start_period: 300s

  # ── KB-owned: Go CPU kernels (RRF fusion; deterministic, no ML) ───────────────
  kb-compute:
    build:
      context: ../..
      dockerfile: backend/services/kb-compute/Dockerfile
    image: kb-compute:latest
    container_name: kb-compute
    restart: unless-stopped
    # No host port: kb-backend reaches it in-network at kb-compute:8600. No
    # depends_on — kb-backend falls back to in-process fusion if it's absent.
    deploy:
      resources:
        limits:
          memory: 64M

  # ── KB-owned: retrieval/query backend ─────────────────────────────────────────
  kb-backend:
    build:
      context: ../..
      dockerfile: backend/services/kb_backend/Dockerfile
    container_name: kb-backend
    restart: unless-stopped
    ports:
      # Loopback only — direct callers bypass Kong and can forge identity headers.
      - "127.0.0.1:8050:8000"
    environment:
      # 10k CCU needs >=4: 1 worker's crud/Postgres path saturates (docs/KB-SCALE-10K.md §6).
      # 1 worker plateaus ~1900 rps/~1 core; set = CPU cores per replica for more.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-dev123}@postgres/${POSTGRES_DB:-dataagent}
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_URL: bolt://neo4j:7687
      MONGO_URL: mongodb://mongo:27017/${POSTGRES_DB:-dataagent}
      MODEL_SERVICE_URL: http://model-service:8001
      # Offload RRF fusion to Go kb-compute (empty → in-process Python; auto-fallback on error).
      KB_COMPUTE_URL: ${KB_COMPUTE_URL-http://kb-compute:8600}
      MINIO_URL: http://${MINIO_ROOT_USER:-minio}:${MINIO_ROOT_PASSWORD:-minio_secret}@minio:9000
      MINIO_BUCKET: knowledge-base
      # Plaintext Kafka listener (this client has no SASL support).
      KAFKA_URL: kafka:9094
      QDRANT_PASS1_LIMIT: ${QDRANT_PASS1_LIMIT:-3}
      QDRANT_PASS2_LIMIT: ${QDRANT_PASS2_LIMIT:-2}
      RRF_TOP_N: ${RRF_TOP_N:-20}
      RERANK_TOP_N: ${RERANK_TOP_N:-5}
      NEO4J_MAX_HOPS: ${NEO4J_MAX_HOPS:-1}
      NEO4J_MAX_NEIGHBOURS: ${NEO4J_MAX_NEIGHBOURS:-5}
      # Graceful degradation: skip graph_expand + rerank past this budget (0=off).
      DEGRADE_BUDGET_MS: ${DEGRADE_BUDGET_MS:-0}
      DOC_NARROWING: ${DOC_NARROWING:-1}
      DOC_PASS_TOP_M: ${DOC_PASS_TOP_M:-3}
      DOC_PASS_CHUNK_LIMIT: ${DOC_PASS_CHUNK_LIMIT:-5}
      QUERY_ALIAS_RESOLVE: ${QUERY_ALIAS_RESOLVE:-1}
      TYPE_AWARE: ${TYPE_AWARE:-1}
    depends_on:
      model-service: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      kb-seed: { condition: service_completed_successfully }

  # ── KB-owned: ingestion worker ────────────────────────────────────────────────
  kb-ingestion-worker:
    build:
      context: ../..
      dockerfile: backend/services/kb-ingestion-worker/Dockerfile
    # No container_name → horizontally scalable: `--scale kb-ingestion-worker=N`
    # spawns N consumers in group kb-ingestion. Needs the silver/gold topics to
    # have >= N partitions (see docker-compose.scale.yml). docs/KB-SCALE-10K.md §6.
    restart: unless-stopped
    environment:
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-dev123}@postgres/${POSTGRES_DB:-dataagent}
      MONGO_URL: mongodb://mongo:27017/${POSTGRES_DB:-dataagent}
      MINIO_URL: http://${MINIO_ROOT_USER:-minio}:${MINIO_ROOT_PASSWORD:-minio_secret}@minio:9000
      MINIO_BUCKET: knowledge-base
      KAFKA_URL: kafka:9094
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      MODEL_SERVICE_URL: http://model-service:8001
      LITELLM_BASE_URL: http://litellm:4000
      LLM_MODEL: llama3
      HF_HOME: /root/.cache/huggingface
      USE_VLM: "false"
      # Ingestion throughput tuning (docs/KB-SCALE-10K.md §6): overlap per-chunk LLM+embed
      # inside a gold doc + run more silver docs concurrently. Defaults preserve
      # legacy sequential behaviour.
      GOLD_CHUNK_CONCURRENCY: "${GOLD_CHUNK_CONCURRENCY:-1}"
      SILVER_CONCURRENCY: "${SILVER_CONCURRENCY:-1}"
    volumes:
      - docling_cache:/root/.cache/huggingface
    depends_on:
      model-service: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      kb-seed: { condition: service_completed_successfully }
