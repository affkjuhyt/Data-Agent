# Project name is fixed so containers/volumes/images keep their historical
# `infra-*` names after the compose files moved to deploy/docker/ (otherwise
# compose would derive "docker" from the directory). `-p` still overrides it
# (the E2E/Ansible stack runs as dataagent-e2e).
name: infra

networks:
  default:
    name: data-agent-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mongo_data:
  es_data:
  audit_bridge_data:
  jwks_refresher_data:
  openbao_data:
  sandbox_dockerd_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  ollama_models:
  hf_cache:

services:
  # Databases
  postgres:
    image: postgres:16-alpine
    container_name: dataagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: ${POSTGRES_DB:-dataagent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/create-extra-dbs.sql:/docker-entrypoint-initdb.d/01-create-dbs.sql:ro
      # (removed) ./postgres/init.sql → 02-kb-tables.sql: the file is not in the
      # repo, so Docker bind-mounted an empty DIRECTORY, psql failed with "Is a
      # directory" and the entrypoint stopped before 03-app-schema.sql — on
      # every fresh volume the `keycloak` schema was never created and Keycloak
      # crash-looped. KB tables live in the kb_e2e stack's own postgres.
      - ./sql/init.sql:/docker-entrypoint-initdb.d/03-app-schema.sql:ro
      - ./sql/release-init.sql:/docker-entrypoint-initdb.d/04-release-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-dataagent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    profiles: [kb, authoring, runtime, release]
    image: mongo:7.0
    container_name: dataagent-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: dataagent
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    profiles: [kb, authoring, runtime, release, observability]
    image: redis:7-alpine
    container_name: dataagent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    profiles: [kb, runtime]
    image: qdrant/qdrant:v1.13.6
    container_name: dataagent-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    profiles: [kb, runtime]
    build:
      context: ./Neo4j
    container_name: knowledge_graph_neo4j
    restart: unless-stopped
    expose:
      - "7474"
      - "7687"
    environment:
      NEO4J_AUTH: none

      # Sized for a dev machine by default (heap+pagecache must fit the Docker VM,
      # which is half of host RAM on a WSL2 default). docker-compose.prod.yml raises these.
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_SIZE:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_SIZE:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-256m}
      NEO4J_server_jvm_additional: '-XX:+ExitOnOutOfMemoryError'

      NEO4J_dbms_routing_driver_connection_pool_max__size: 50
      NEO4J_dbms_cypher_forbid__exhaustive__shortestpath: "true"
      NEO4J_db_track__query__cpu__time: "true"
      NEO4J_db_logs_query_transaction_enabled: 'VERBOSE'
    deploy:
      resources:
        limits:
          cpus: ${NEO4J_CPUS:-1.5}
          memory: ${NEO4J_MEMORY:-1500M}
        reservations:
          cpus: '0.5'
          memory: 512M

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # KeyCloak
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: dataagent-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dataagent}
      KC_DB_USERNAME: ${POSTGRES_USER:-admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-dev123}
      KC_DB_SCHEMA: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Kong
  kong-migration:
    build:
      context: ../..
      dockerfile: deploy/docker/kong/Dockerfile
    container_name: dataagent-kong-migration
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_PORT: 5432
      KONG_PG_DATABASE: ${POSTGRES_DB:-dataagent}
      KONG_PG_USER: ${POSTGRES_USER:-admin}
      KONG_PG_PASSWORD: ${POSTGRES_PASSWORD:-dev123}
      KONG_PG_SCHEMA: kong
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  kong:
    build:
      context: ../..
      dockerfile: deploy/docker/kong/Dockerfile
    container_name: dataagent-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_PORT: 5432
      KONG_PG_DATABASE: ${POSTGRES_DB:-dataagent}
      KONG_PG_USER: ${POSTGRES_USER:-admin}
      KONG_PG_PASSWORD: ${POSTGRES_PASSWORD:-dev123}
      KONG_PG_SCHEMA: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_PLUGINS: bundled,aeroflow-jwks
    ports:
      - "8000:8000"
      - "8900:8001"
    depends_on:
      postgres:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Kafka
  kafka:
    profiles: [kb, runtime, iam, release]
    build:
      context: ../..
      dockerfile: deploy/docker/kafka/Dockerfile
    container_name: dataagent-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL://:9094 is a PLAINTEXT listener for in-cluster clients that don't
      # speak SASL (kb-backend, kb-ingestion-worker). Principal = ANONYMOUS, which
      # is a super-user (KAFKA_SUPER_USERS) so it bypasses ACLs. SASL stays on :9092
      # for audit-bridge/audit-consumer/release-worker.
      KAFKA_LISTENERS: SASL_PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka:9092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Single-broker cluster: the internal topics default to replication factor 3,
      # which can never be created with one broker → __consumer_offsets is missing →
      # the group coordinator is unavailable → consumers can't join their group (the
      # ingestion worker hangs on GroupCoordinatorNotAvailableError). Pin them to 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CLUSTER_ID: "dataagent-kafka-cluster-1"
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: "User:admin;User:ANONYMOUS"
      KAFKA_OPTS: "-Djava.security.auth.login.config=/opt/kafka/config/kafka-broker-jaas.config"
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD}
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "printf 'security.protocol=SASL_PLAINTEXT\\nsasl.mechanism=PLAIN\\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username=\\\"admin\\\" password=\\\"${KAFKA_ADMIN_PASSWORD}\\\";\\n' > /tmp/hc.props && /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --command-config /tmp/hc.props --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # MinIO
  minio:
    profiles: [kb, release, observability, runtime]
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: dataagent-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  #ElasticSearch
  elasticsearch:
    profiles: [observability]
    image: elasticsearch:8.12.0
    container_name: dataagent-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  #Jaeger
  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.55
    container_name: dataagent-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"

  # Kibana — UI để đọc log JSON (ECS) đã ship vào Elasticsearch. Nhảy Kibana
  # <-> Jaeger qua trace.id/span.id mà backend/libs/shared/logger.py gắn vào mỗi record.
  kibana:
    profiles: [observability]
    image: kibana:8.12.0
    container_name: dataagent-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  # Filebeat — thu log stdout của mọi container (JSON ECS) rồi đẩy vào
  # Elasticsearch. Đọc trực tiếp /var/lib/docker/containers trên host.
  filebeat:
    profiles: [observability]
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: dataagent-filebeat
    restart: unless-stopped
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elasticsearch

  # Openbao
  openbao:
    profiles: [iam, runtime]
    image: openbao/openbao:latest
    container_name: dataagent-openbao
    restart: unless-stopped
    ports:
      - "8300:8200"
    # The image entrypoint runs `bao server -config=/openbao/config` (the whole
    # directory) for a bare `server` command. Passing our own -config on top
    # loaded config.hcl twice, and mounting the directory also pulled in
    # config.prod.hcl — two listeners on :8200 → "address already in use" and a
    # restart loop. Mount exactly one config file; helper scripts live in
    # /openbao/scripts (docker exec dataagent-openbao sh /openbao/scripts/openbao-init.sh).
    command: server
    cap_add: [IPC_LOCK]
    environment:
      BAO_SKIP_DROP_ROOT: "true"
    volumes:
      - openbao_data:/openbao/data
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - ./openbao:/openbao/scripts:ro

  # Litellm
  litellm:
    profiles: [kb, runtime]
    image: ghcr.io/berriai/litellm:main-stable
    container_name: dataagent-litellm
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - hf_cache:/root/.cache/huggingface
    env_file: ../../.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-dev123}@postgres:5432/litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Langfuse v3 — SDK Python v3 (OTEL-based, dùng trong backend/services/orchestrator,
  # backend/services/workflow-runtime) yêu cầu self-hosted server ≥ 3.125.0, KHÔNG
  # tương thích server v2. v3 tách write-path (Clickhouse cho trace/observation,
  # MinIO cho blob lớn, Redis cho queue) khỏi Postgres (chỉ còn giữ org/user/
  # API-key). Xem: https://langfuse.com/self-hosting/upgrade-guides/upgrade-v2-to-v3
  clickhouse:
    profiles: [observability, testdb]
    image: docker.io/clickhouse/clickhouse-server
    container_name: dataagent-clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dev-clickhouse-pw-changeme}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ports:
      # 9000 bị MinIO chiếm ở host rồi (xem service minio dưới) — đổi cổng host,
      # cổng nội bộ trong docker network vẫn là clickhouse:9000 như bình thường.
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9002:9000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Tạo bucket "langfuse" trên MinIO có sẵn (dùng chung instance với bucket
  # "knowledge-base", KHÔNG cần MinIO riêng) — chạy 1 lần rồi thoát.
  langfuse-minio-init:
    profiles: [observability]
    image: minio/mc
    container_name: dataagent-langfuse-minio-init
    restart: "no"
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio_secret} &&
             mc mb --ignore-existing local/langfuse &&
             echo 'MinIO: langfuse bucket ready.'"
    depends_on:
      minio:
        condition: service_healthy

  langfuse-worker: &langfuse-worker-def
    profiles: [observability]
    image: docker.io/langfuse/langfuse-worker:3
    container_name: dataagent-langfuse-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      clickhouse:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-dev123}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:-dev-langfuse-salt-changeme}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-420a3155e0050c9931ae7c80c6bb7adf7af9648ec64e4f97164ca66c0dbeecad}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dev-clickhouse-pw-changeme}
      # Clickhouse của mình single-node, không có Zookeeper/cluster — thiếu biến
      # này Langfuse tự hiểu nhầm là cluster mode, chạy DDL "ON CLUSTER" và lỗi.
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_secret}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_secret}
      # URL browser dùng để tải media đính kèm trực tiếp từ MinIO — đổi thành
      # IP/hostname thật của máy nếu truy cập Langfuse UI từ máy khác.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # KHÔNG set REDIS_AUTH (kể cả rỗng) — redis service hiện tại không bật
      # auth (redis:7-alpine mặc định). Set "" vẫn khiến Langfuse gửi lệnh AUTH
      # (bị Redis từ chối vì server không có password nào cả) — phải bỏ hẳn key.

  langfuse:
    profiles: [observability]
    <<: *langfuse-worker-def
    image: docker.io/langfuse/langfuse:3
    container_name: dataagent-langfuse
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      clickhouse:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
      langfuse-worker:
        condition: service_started
    ports:
      - "3001:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-dev-langfuse-nextauth-secret-changeme}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_EMAIL:-admin@example.com}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_PASSWORD:-Admin@12345678}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_NAME:-Admin}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG:-GTEL}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT:-data-agent}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      AUTH_DISABLE_SIGNUP: "false"

  ollama:
    # In-Docker LLM backend — CPU-only on macOS: running an 8B model here pegs all
    # cores and is very slow. NOT in the `kb` profile. On macOS prefer the NATIVE
    # ollama (Metal GPU) that model-service points at via host.docker.internal.
    # Use `--profile models up ollama` only if you deliberately want the CPU backend.
    profiles: [models]
    image: ollama/ollama
    container_name: dataagent-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # deploy:  # Uncomment when nvidia-container-toolkit is available
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  model-service:
    profiles: [kb, runtime]
    build:
      context: ../../backend/services/model-service
    container_name: dataagent-model-service
    restart: unless-stopped
    ports:
      - "8600:8001"
    environment:
      # Multilingual (Vietnamese corpus) — must match the weights cached in
      # ../../backend/services/model-service/models and the dim of the Qdrant collections.
      EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-small}
      RERANK_MODEL: ${RERANK_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      # LLM gateway → NATIVE ollama on the Mac host (Metal GPU = fast, doesn't peg
      # CPU). Requires host ollama to listen on all interfaces:
      #   launchctl setenv OLLAMA_HOST 0.0.0.0 && (restart ollama)
      # For the in-Docker CPU backend instead: set REMOTE_LLM_URL=http://ollama:11434.
      REMOTE_LLM_URL: ${REMOTE_LLM_URL:-http://host.docker.internal:11434}
      REMOTE_LLM_MODEL: ${REMOTE_LLM_MODEL:-llama3.1:8b}
    volumes:
      # Weights are no longer baked into the image — they download here on first
      # start and persist across recreates. See backend/services/model-service/Dockerfile.
      - ../../backend/services/model-service/models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      # First start downloads the embed + rerank models into the volume above.
      start_period: 300s

  kb-ingestion-worker:
    profiles: [kb]
    build:
      context: ../..
      dockerfile: backend/services/kb-ingestion-worker/Dockerfile
    container_name: dataagent-kb-ingestion-worker
    restart: unless-stopped
    environment:
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-dev123}@postgres/${POSTGRES_DB:-dataagent}
      MONGO_URL: mongodb://mongo:27017/dataagent
      MINIO_URL: http://${MINIO_ROOT_USER:-minio}:${MINIO_ROOT_PASSWORD:-minio_secret}@minio:9000
      KAFKA_URL: kafka:9094
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      MODEL_SERVICE_URL: http://model-service:8001
      LITELLM_BASE_URL: http://litellm:4000
      USE_VLM: "false"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
      model-service:
        condition: service_healthy
