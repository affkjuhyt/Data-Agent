# Redis config for GTEL Data Agent

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Memory
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence (RDB snapshot)
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# Logging
loglevel notice

# Timeout — đóng idle connection sau 300s
timeout 300

# Slow log — log query chậm hơn 10ms
slowlog-log-slower-than 10000
slowlog-max-len 128
