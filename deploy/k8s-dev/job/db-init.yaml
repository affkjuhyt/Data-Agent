---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-init
  namespace: dataagent-service
  labels:
    app: db-init
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-env
  namespace: dataagent-service
  labels:
    app: db-init
    app.kubernetes.io/part-of: dataagent
data:
  PGHOST: postgres.dataagent-database.svc.cluster.local
  PGUSER: admin
  PGDATABASE: dataagent
  WAIT_FOR_TABLE: Agents
  PGPORT: '8300'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: dataagent-service
  labels:
    app: db-init
    app.kubernetes.io/part-of: dataagent
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: db-init
        app.kubernetes.io/part-of: dataagent
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
      - name: db-init
        image: postgres:16-alpine
        command:
        - sh
        - -c
        - "until psql -tAc \"SELECT 1 FROM information_schema.tables WHERE table_name = 'Agents'\" 2>/dev/null | grep -q 1; do\n  echo waiting for migrations; sleep 3\ndone\nfor f in /sql/*.sql; do echo applying $f; psql -v ON_ERROR_STOP=1 -f \"$f\"; done\necho setting role passwords\npsql -v ON_ERROR_STOP=1             -v app_user_password=\"$APP_USER_PASSWORD\"             -v runtime_writer_password=\"$RUNTIME_WRITER_PASSWORD\"             -v sandbox_reader_password=\"$SANDBOX_READER_PASSWORD\"             -v kb_backend_password=\"$KB_BACKEND_PASSWORD\"             -v pgbouncer_auth_password=\"$PGBOUNCER_AUTH_PASSWORD\"             -v kb_ingestion_worker_password=\"$KB_INGESTION_WORKER_PASSWORD\" <<'SQL'\nALTER ROLE app_user       WITH LOGIN PASSWORD :'app_user_password';\nALTER ROLE runtime_writer WITH LOGIN PASSWORD :'runtime_writer_password';\nALTER ROLE sandbox_reader WITH LOGIN PASSWORD :'sandbox_reader_password';\nALTER ROLE kb_backend     WITH LOGIN PASSWORD :'kb_backend_password';\nALTER ROLE pgbouncer_auth WITH LOGIN PASSWORD :'pgbouncer_auth_password';\nALTER ROLE kb_ingestion_worker WITH LOGIN PASSWORD :'kb_ingestion_worker_password';\nSQL\n"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 2000m
            memory: 1024Mi
        volumeMounts:
        - name: sql
          mountPath: /sql
          readOnly: true
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: db-init-env
        - secretRef:
            name: db-init-secrets
      volumes:
      - name: sql
        configMap:
          name: db-init-sql
      - name: tmp
        emptyDir: {}
      serviceAccountName: db-init
