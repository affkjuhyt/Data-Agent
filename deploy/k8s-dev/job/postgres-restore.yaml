---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-restore
  namespace: dataagent-database
  labels:
    app: postgres-restore
    app.kubernetes.io/part-of: dataagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-restore-pg-restore-env
  namespace: dataagent-database
  labels:
    app: postgres-restore
    app.kubernetes.io/part-of: dataagent
data:
  PGHOST: postgres
  PGPORT: '8300'
  PGUSER: admin
  PGDATABASE: postgres
  TARGET_DB: dataagent
  DUMP_FILE: dump_YYYYmmdd_HHMMSS.sql.gz
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-restore
  namespace: dataagent-database
  labels:
    app: postgres-restore
    app.kubernetes.io/part-of: dataagent
spec:
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: postgres-restore
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
      - name: pg-restore
        image: postgres:16-alpine
        command:
        - sh
        - -c
        - "set -eu\npath=\"/backups/dumps/${DUMP_FILE}\"\nif [ ! -f \"${path}\" ]; then\n  echo \"[restore] ${path} not found \u2014 set DUMP_FILE to a real dump\" >&2\n  ls -lt /backups/dumps >&2\n  exit 1\nfi\n\n# Verify the dump BEFORE dropping anything. Checking afterwards\n# would mean discovering a truncated archive with the database\n# already gone \u2014 the one state worse than the one you are\n# recovering from. Same two checks the backup job applies before\n# it accepts a dump, repeated here because the file has sat on a\n# volume since then.\necho \"[restore] verifying ${path}\"\ngzip -t \"${path}\"\nif ! gunzip -c \"${path}\" | tail -5 | grep -q \"PostgreSQL database dump complete\"; then\n  echo \"[restore] ABORTED \u2014 ${path} does not end with a completion marker;\" >&2\n  echo \"[restore] it is truncated. ${TARGET_DB} has NOT been touched.\" >&2\n  exit 1\nfi\n\necho \"[restore] `date -Iseconds` restoring ${path} into ${TARGET_DB}\"\n# FORCE terminates other sessions. Step 1 of the procedure should\n# have stopped them; this makes a forgotten pod fail the restore\n# loudly rather than leaving it half-applied.\npsql -v ON_ERROR_STOP=1 -c \"DROP DATABASE IF EXISTS ${TARGET_DB} WITH (FORCE)\"\npsql -v ON_ERROR_STOP=1 -c \"CREATE DATABASE ${TARGET_DB}\"\ngunzip -c \"${path}\" | psql -v ON_ERROR_STOP=1 -d \"${TARGET_DB}\"\necho \"[restore] done \u2014 now run deploy/k8s/migrate-job.yaml before scaling writers up\"\n"
        volumeMounts:
        - name: backups
          mountPath: /backups
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: '8'
            memory: 4Gi
        envFrom:
        - configMapRef:
            name: postgres-restore-pg-restore-env
        - secretRef:
            name: postgres-restore-secrets
      volumes:
      - name: tmp
        emptyDir: {}
      - name: backups
        persistentVolumeClaim:
          claimName: postgres-backups
          readOnly: true
      serviceAccountName: postgres-restore
