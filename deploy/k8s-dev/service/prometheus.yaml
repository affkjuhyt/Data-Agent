---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: dataagent-service
  labels:
    app: prometheus
    app.kubernetes.io/part-of: dataagent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: dataagent-service
  labels:
    app: prometheus
    app.kubernetes.io/part-of: dataagent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/part-of: dataagent
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: prometheus
        image: prom/prometheus:v2.54.1
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=15d
        - --web.listen-address=:8400
        ports:
        - containerPort: 8400
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1200m
            memory: 1536Mi
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 8400
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /-/ready
            port: 8400
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        - name: data
          mountPath: /prometheus
        - name: tmp
          mountPath: /tmp
        envFrom: []
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data
      - name: tmp
        emptyDir: {}
      serviceAccountName: prometheus
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: dataagent-service
  labels:
    app: prometheus-data
    app.kubernetes.io/part-of: dataagent
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: dataagent-service
  labels:
    app: prometheus
    app.kubernetes.io/part-of: dataagent
spec:
  selector:
    app: prometheus
  ports:
  - port: 8400
    targetPort: 8400
    name: http
  type: ClusterIP
