---
- name: Set up the Data Agent stack on Kubernetes
  hosts: all
  gather_facts: false

  roles:
    - { role: k8s_common, tags: [always] }
    - { role: bootstrap_secrets, tags: [bootstrap-secrets, never] }
    - { role: k8s_preflight, tags: [preflight] }
    - { role: k8s_core, tags: [core] }
    - { role: k8s_secrets, tags: [secrets] }
    - { role: k8s_validate, tags: [validate] }
    - { role: k8s_databases, tags: [databases] }
    - { role: k8s_jobs, tags: [jobs] }
    - { role: k8s_services, tags: [services] }
    - { role: k8s_setup, tags: [gateway] }
    - { role: k8s_verify, tags: [verify] }
