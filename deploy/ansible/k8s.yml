---
# Data Agent — single-node Kubernetes (k3s), one playbook.
#
# The compose-based site.yml targets deploy/docker/ + docker compose; this
# playbook targets deploy/k8s/ + kubectl/kustomize on a k3s cluster already
# provisioned by deploy/k8s/install-k3s.sh (that one step needs interactive
# sudo, so it stays a standalone script — everything after it is idempotent
# and safe to re-run from here).
#
#   ansible-playbook k8s.yml                          # everything, in order
#   ansible-playbook k8s.yml --tags images             # just rebuild+push images
#   ansible-playbook k8s.yml --tags openbao,secrets    # just re-mint + re-apply secrets
#   ansible-playbook k8s.yml --tags service,setup      # redeploy the app tier
#
# Each step mirrors deploy/k8s/README.md's manual "Apply" section — this
# playbook is that section, made idempotent and re-runnable.
- name: Deploy the Data Agent stack to k8s
  hosts: all
  gather_facts: false
  vars:
    k8s_dir: "{{ project_dir }}/deploy/k8s"
    kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default(lookup('env', 'HOME') ~ '/.kube/config', true) }}"

  environment:
    KUBECONFIG: "{{ kubeconfig }}"

  tasks:
    - name: kubectl can reach the cluster
      ansible.builtin.command: kubectl get nodes
      changed_when: false
      tags: [always]

    # ── images ──────────────────────────────────────────────────────────
    - name: Build + push every service image to the local registry
      ansible.builtin.command: bash {{ k8s_dir }}/build-push-images.sh
      args:
        chdir: "{{ project_dir }}"
      tags: [images, never]   # opt-in: slow, and not every run changes code

    # ── base: namespaces, RBAC, network policy, config ─────────────────
    - name: Namespaces
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/namespace.yaml
      changed_when: true
      tags: [base]

    - name: RBAC + non-file-backed ConfigMaps
      ansible.builtin.command: >
        kubectl apply -f {{ k8s_dir }}/configmap.yaml -f {{ k8s_dir }}/rbac.yaml
      changed_when: true
      tags: [base]

    - name: NetworkPolicies
      ansible.builtin.command: >
        kubectl apply -f {{ k8s_dir }}/networkpolicy-service.yaml
        -f {{ k8s_dir }}/networkpolicy-database.yaml
      changed_when: true
      tags: [base]

    - name: Drop every Job before any kustomize apply
      ansible.builtin.shell: >
        kubectl delete jobs --all -n dataagent-service --ignore-not-found
        && kubectl delete jobs --all -n dataagent-database --ignore-not-found
      changed_when: true
      tags: [base]
      # A Job's pod template is immutable, and `kubectl apply -k .` below (and
      # the database/service-tier tasks further down, which run the same
      # command) touches every Job in kustomization.yaml's resources list —
      # so a rerun of this playbook fails here on the second run without it.

    - name: File-backed ConfigMaps (kustomize configMapGenerator)
      ansible.builtin.command: kubectl apply -k {{ project_dir }}
      args:
        chdir: "{{ project_dir }}"
      changed_when: true
      tags: [base]
      # Also applies every workload in kustomization.yaml's resources list —
      # harmless to run this early too (Deployments just sit on missing
      # Secrets until the secrets/database/migrate stages below catch up),
      # and it's the only way kubectl learns the generated ConfigMap names.

    # ── secrets (first pass — OPENBAO_* still blank) ────────────────────
    - name: secrets.env exists (generated once, persisted, git-ignored)
      ansible.builtin.command: bash {{ k8s_dir }}/gen-secrets-env.sh
      changed_when: true
      tags: [secrets]

    - name: Read secrets.env
      ansible.builtin.slurp:
        src: "{{ k8s_dir }}/secrets.env"
      register: secrets_env_raw
      no_log: true
      tags: [secrets, openbao]

    - name: Parse secrets.env into facts
      ansible.builtin.set_fact:
        secrets_env: "{{ dict(secrets_env_raw.content | b64decode | regex_findall('^([A-Z0-9_]+)=(.*)$', multiline=True)) }}"
      no_log: true
      tags: [secrets, openbao]

    - name: Apply every workload Secret
      ansible.builtin.command: bash {{ k8s_dir }}/create-secrets.sh
      environment: "{{ secrets_env }}"
      changed_when: true
      no_log: true
      tags: [secrets]

    - name: kafka-jaas Secret (not covered by create-secrets.sh on purpose)
      ansible.builtin.command: bash {{ k8s_dir }}/gen-kafka-jaas-secret.sh
      environment: "{{ secrets_env }}"
      changed_when: true
      no_log: true
      tags: [secrets]

    # ── database tier ───────────────────────────────────────────────────
    # Always through `kubectl apply -k .`, never `apply -f database/` — the
    # file-backed ConfigMaps (postgres-initdb, ...) get a content-hash name
    # suffix from kustomize's configMapGenerator, and only kustomize rewrites
    # the volume references to match. `apply -f` re-applies the raw manifest
    # with the un-hashed name and silently breaks the mount (postgres, in
    # particular, would boot with none of its init SQL and default to the
    # image's own postgres/postgres superuser instead of admin/dataagent).
    - name: Database StatefulSets (+ every other kustomize resource)
      ansible.builtin.command: kubectl apply -k {{ project_dir }}
      args:
        chdir: "{{ project_dir }}"
      changed_when: true
      tags: [database]

    - name: Wait for Postgres
      ansible.builtin.command: >
        kubectl -n dataagent-database rollout status statefulset/postgres --timeout=5m
      changed_when: false
      tags: [database]

    # ── openbao: init/unseal/AppRole (control-plane step, see script header) ─
    - name: Wait for OpenBao
      ansible.builtin.command: >
        kubectl -n dataagent-database rollout status statefulset/openbao --timeout=5m
      changed_when: false
      tags: [openbao]

    - name: Init/unseal OpenBao, mint the workflow_runtime AppRole
      ansible.builtin.command: bash {{ k8s_dir }}/bootstrap-openbao.sh
      register: openbao_bootstrap
      changed_when: "'unsealed' in openbao_bootstrap.stdout or 'wrote' in openbao_bootstrap.stdout"
      no_log: true
      tags: [openbao]

    - name: Re-read secrets.env (OPENBAO_* now filled in)
      ansible.builtin.slurp:
        src: "{{ k8s_dir }}/secrets.env"
      register: secrets_env_raw2
      no_log: true
      tags: [openbao]

    - name: Re-parse secrets.env
      ansible.builtin.set_fact:
        secrets_env: "{{ dict(secrets_env_raw2.content | b64decode | regex_findall('^([A-Z0-9_]+)=(.*)$', multiline=True)) }}"
      no_log: true
      tags: [openbao]

    - name: Re-apply Secrets that read OPENBAO_*
      ansible.builtin.command: bash {{ k8s_dir }}/create-secrets.sh
      environment: "{{ secrets_env }}"
      changed_when: true
      no_log: true
      tags: [openbao]

    - name: Restart workloads that read OpenBao so the new AppRole takes effect
      ansible.builtin.command: >
        kubectl -n dataagent-service rollout restart deployment/workflow-runtime deployment/auth-api
      changed_when: true
      tags: [openbao]

    # ── kafka topics (self-waits for the broker) ────────────────────────
    # Job pod templates are immutable (deploy/k8s/README.md) — delete before
    # every re-apply so a re-run of this playbook doesn't just fail here.
    # Through kustomize (not `apply -f job/X.yaml`): setup and db-init mount
    # file-backed ConfigMaps that only kustomize name-hashes and rewires
    # correctly (see the database-tier comment above) — a plain `-f` apply of
    # just the job file would reference the un-hashed name and fail to mount.
    - name: Kafka topics
      ansible.builtin.shell: >
        kubectl -n dataagent-service delete job kafka-topics --ignore-not-found
        && kubectl apply -k {{ project_dir }}
      args:
        chdir: "{{ project_dir }}"
      changed_when: true
      tags: [kafka]

    # ── migrations, then the one-shot init jobs ─────────────────────────
    - name: Kong migration + Alembic migrate
      ansible.builtin.shell: >
        kubectl -n dataagent-service delete job kong-migration migrate --ignore-not-found
        && kubectl apply -k {{ project_dir }}
      args:
        chdir: "{{ project_dir }}"
      changed_when: true
      tags: [migrate]

    - name: Wait for migrate
      ansible.builtin.command: >
        kubectl -n dataagent-service wait --for=condition=complete job/migrate --timeout=10m
      changed_when: false
      tags: [migrate]

    - name: Wait for kong-migration
      ansible.builtin.command: >
        kubectl -n dataagent-service wait --for=condition=complete job/kong-migration --timeout=10m
      changed_when: false
      tags: [migrate]

    - name: db-init + minio-init
      ansible.builtin.shell: >
        kubectl -n dataagent-service delete job db-init minio-init --ignore-not-found
        && kubectl apply -k {{ project_dir }}
      args:
        chdir: "{{ project_dir }}"
      changed_when: true
      tags: [migrate]

    - name: Wait for db-init
      ansible.builtin.command: >
        kubectl -n dataagent-service wait --for=condition=complete job/db-init --timeout=5m
      changed_when: false
      tags: [migrate]

    - name: Wait for minio-init
      ansible.builtin.command: >
        kubectl -n dataagent-service wait --for=condition=complete job/minio-init --timeout=5m
      changed_when: false
      tags: [migrate]

    # ── service tier ─────────────────────────────────────────────────────
    # kustomize again (see the database-tier comment above) — litellm and
    # prometheus mount file-backed ConfigMaps directly, not just the Jobs.
    - name: Every Deployment (+ every other kustomize resource)
      ansible.builtin.command: kubectl apply -k {{ project_dir }}
      args:
        chdir: "{{ project_dir }}"
      changed_when: true
      tags: [service]

    # ── Kong routes + Keycloak audience mappers ─────────────────────────
    - name: setup job (Kong routes, Keycloak mappers)
      ansible.builtin.shell: >
        kubectl -n dataagent-service delete job setup --ignore-not-found
        && kubectl apply -k {{ project_dir }}
      args:
        chdir: "{{ project_dir }}"
      changed_when: true
      tags: [setup]
      # Job pod templates are immutable — delete-then-apply is how a rerun
      # (e.g. after editing kong-setup.sh) actually takes effect.

    - name: Wait for setup
      ansible.builtin.command: >
        kubectl -n dataagent-service wait --for=condition=complete job/setup --timeout=5m
      changed_when: false
      tags: [setup]

    - name: postgres-backup CronJob
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/job/postgres-backup.yaml
      changed_when: true
      tags: [setup]

    # ── verify ───────────────────────────────────────────────────────────
    - name: Pods not yet Ready
      ansible.builtin.command: >
        kubectl -n dataagent-service get pods --field-selector=status.phase!=Running,status.phase!=Succeeded
      register: not_ready
      changed_when: false
      tags: [verify]

    - name: Report
      ansible.builtin.debug:
        msg: "{{ not_ready.stdout_lines }}"
      tags: [verify]
