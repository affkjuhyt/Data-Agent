---
# Appliance: the offline-bundle host itself (install.sh runs the playbook here).
# `ansible_connection: local` — no SSH. Same playbook as prod, images preloaded.
all:
  hosts:
    appliance:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars:
    env_name: appliance
    # unpacked bundle root (this file lives in deploy/ansible/inventories/appliance)
    project_dir: "{{ (inventory_dir ~ '/../../../..') | realpath }}"
