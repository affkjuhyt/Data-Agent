---
# Offline appliance — what install.sh drives. The bundle carries images + compose
# + configs only (bundle_code_paths), NO source tree: nothing here may add a
# compose overlay that bind-mounts backend/ (docker-compose.e2e-dev.yml does).
compose_build: never                      # every image came from images.tar.gz
code_source: none                         # code was unpacked by install.sh
compose_extra_files: []
# llm_backend is passed by install.sh (-e) from whatever the bundle was built with.
keycloak_disable_mfa: false
openbao_allow_reset: false                # a lost keys file is an incident, not a reset
seed_demo: false
set_vite_api_url: false
kong_admin_published: true                # set false (+ a security overlay) once the admin port is not mapped
run_smoke: false
