---
# Local: the laptop/VM you are on. `ansible_connection: local` — no SSH.
all:
  hosts:
    local:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars:
    env_name: local
    # repo checkout that is being deployed (this file lives in deploy/ansible/inventories/local)
    project_dir: "{{ (inventory_dir ~ '/../../../..') | realpath }}"
