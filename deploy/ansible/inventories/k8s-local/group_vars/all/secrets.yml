---

pgbouncer_host: "pgbouncer.{{ ns_database }}.svc.cluster.local"
pgbouncer_port: 8390

secret_env:
  POSTGRES_PASSWORD: "{{ vault_postgres_password }}"
  DATABASE_URL: "postgresql://{{ pg_user }}:{{ vault_postgres_password }}@{{ pg_host }}:{{ pg_port }}/{{ pg_db }}"
  POSTGRES_DSN: "postgresql://{{ pg_user }}:{{ vault_postgres_password }}@{{ pg_host }}:{{ pg_port }}/{{ pg_db }}"
  POSTGRES_URL_ASYNC: "postgresql+asyncpg://{{ pg_user }}:{{ vault_postgres_password }}@{{ pg_host }}:{{ pg_port }}/{{ pg_db }}"

  APP_USER_PASSWORD: "{{ vault_app_user_password }}"
  APP_DATABASE_URL: "postgresql://app_user:{{ vault_app_user_password }}@{{ pg_host }}:{{ pg_port }}/{{ pg_db }}"

  RUNTIME_WRITER_PASSWORD: "{{ vault_runtime_writer_password }}"
  RUNTIME_DB_URL: "postgresql+asyncpg://runtime_writer:{{ vault_runtime_writer_password }}@{{ pg_host }}:{{ pg_port }}/{{ pg_db }}"

  SANDBOX_READER_PASSWORD: "{{ vault_sandbox_reader_password }}"

  KB_BACKEND_PASSWORD: "{{ vault_kb_backend_password }}"
  KB_BACKEND_URL_ASYNC: "postgresql+asyncpg://kb_backend:{{ vault_kb_backend_password }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  KB_INGESTION_WORKER_PASSWORD: "{{ vault_kb_ingestion_worker_password }}"
  KB_INGESTION_WORKER_URL_ASYNC: "postgresql+asyncpg://kb_ingestion_worker:{{ vault_kb_ingestion_worker_password }}@{{ pg_host }}:{{ pg_port }}/{{ pg_db }}"

  PGBOUNCER_AUTH_PASSWORD: "{{ vault_pgbouncer_auth_password }}"

  NEO4J_AUTH: "none"
  CLICKHOUSE_USER: "{{ clickhouse_user }}"
  CLICKHOUSE_PASSWORD: "{{ vault_clickhouse_password }}"
  MINIO_ROOT_USER: "{{ minio_user }}"
  MINIO_ROOT_PASSWORD: "{{ vault_minio_root_password }}"
  MINIO_URL: "http://{{ minio_user }}:{{ vault_minio_root_password }}@{{ minio_host }}:{{ minio_port }}"

  KAFKA_ADMIN_PASSWORD: "{{ vault_kafka_admin_password }}"
  AUDIT_CONSUMER_KAFKA_PASSWORD: "{{ vault_audit_consumer_kafka_password }}"
  MEMORY_CONSUMER_KAFKA_PASSWORD: "{{ vault_memory_consumer_kafka_password }}"
  RELEASE_WORKER_KAFKA_PASSWORD: "{{ vault_release_worker_kafka_password }}"
  SCHEMA_CRAWLER_WORKER_KAFKA_PASSWORD: "{{ vault_schema_crawler_worker_kafka_password }}"
  WORKFLOW_RUNTIME_KAFKA_PASSWORD: "{{ vault_workflow_runtime_kafka_password }}"

  POSTGRES_CRAWLER_PASSWORD: "{{ vault_postgres_crawler_password }}"
  CLICKHOUSE_CRAWLER_PASSWORD: "{{ vault_clickhouse_crawler_password }}"
  SNOWFLAKE_CRAWLER_PASSWORD: "{{ vault_snowflake_crawler_password }}"

  KEYCLOAK_ADMIN: "{{ keycloak_admin_user }}"
  KEYCLOAK_ADMIN_PASSWORD: "{{ vault_keycloak_admin_password }}"
  KEYCLOAK_PUBLIC_URL: "{{ keycloak_public_url }}"
  PUBLIC_API_URL: "{{ public_api_url }}"
  GATEWAY_KEY: "{{ vault_gateway_key }}"
  SERVICE_AUTH_SECRET: "{{ vault_service_auth_secret }}"
  SMOKE_PASSWORD: "{{ vault_smoke_password }}"

  LITELLM_API_KEY: "{{ vault_litellm_api_key }}"
  LITELLM_DATABASE_URL: "postgresql://{{ pg_user }}:{{ vault_postgres_password }}@{{ pg_host }}:{{ pg_port }}/litellm"
  OPENAI_API_KEY: "{{ vault_openai_api_key }}"
  GEMINI_API_KEY: "{{ vault_gemini_api_key }}"
  REMOTE_API_KEY: "{{ vault_remote_api_key }}"
  REMOTE_LLM_KEY: "{{ vault_remote_llm_key }}"

  LANGFUSE_DATABASE_URL: "postgresql://{{ pg_user }}:{{ vault_postgres_password }}@{{ pg_host }}:{{ pg_port }}/langfuse"
  LANGFUSE_PUBLIC_URL: "{{ langfuse_public_url }}"
  LANGFUSE_SALT: "{{ vault_langfuse_salt }}"
  LANGFUSE_ENCRYPTION_KEY: "{{ vault_langfuse_encryption_key }}"
  LANGFUSE_NEXTAUTH_SECRET: "{{ vault_langfuse_nextauth_secret }}"
  LANGFUSE_PUBLIC_KEY: "{{ vault_langfuse_public_key }}"
  LANGFUSE_SECRET_KEY: "{{ vault_langfuse_secret_key }}"
  LANGFUSE_INIT_EMAIL: "{{ langfuse_init_email }}"
  LANGFUSE_INIT_PASSWORD: "{{ vault_langfuse_init_password }}"
  GRAFANA_ADMIN_PASSWORD: "{{ vault_grafana_admin_password }}"

  EVAL_AGENT_ID: "{{ eval_agent_id }}"
