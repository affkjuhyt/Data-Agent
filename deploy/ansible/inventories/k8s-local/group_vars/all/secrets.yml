---

pgbouncer_host: "pgbouncer.{{ ns_database }}.svc.cluster.local"
pgbouncer_port: 8390

secret_env:
  POSTGRES_PASSWORD: "{{ vault_postgres_password }}"
  DATABASE_URL: "postgresql://{{ pg_user }}:{{ vault_postgres_password }}@{{ pg_host }}:{{ pg_port }}/{{ pg_db }}"

  APP_USER_PASSWORD: "{{ vault_app_user_password }}"
  APP_DATABASE_URL: "postgresql://app_user:{{ vault_app_user_password }}@{{ pg_host }}:{{ pg_port }}/{{ pg_db }}"

  SANDBOX_READER_PASSWORD: "{{ vault_sandbox_reader_password | default('') }}"

  KB_BACKEND_PASSWORD: "{{ vault_kb_backend_password | default('') }}"
  KB_BACKEND_URL_ASYNC: "postgresql+asyncpg://kb_backend:{{ vault_kb_backend_password | default('') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  KB_INGESTION_WORKER_PASSWORD: "{{ vault_kb_ingestion_worker_password | default('') }}"
  # V2 crawler role (ADR-V2-46): the web crawler's writes to ingest.artifact / ingest.fetch.
  # Legacy crawler credentials are not needed by the staged V3 service set.
  # Keep the shared secrets renderer compatible with a V3-only vault.
  CRAWLER_SVC_PASSWORD: "{{ vault_crawler_svc_password | default('') }}"
  KB_INGESTION_WORKER_URL_ASYNC: "postgresql+asyncpg://kb_ingestion_worker:{{ vault_kb_ingestion_worker_password | default('') }}@{{ pg_host }}:{{ pg_port }}/{{ pg_db }}"

  PGBOUNCER_AUTH_PASSWORD: "{{ vault_pgbouncer_auth_password }}"
  # V3 database logins, one per service role (design tab 3 D5.1/D5.2): {"svc_qa": "…", …}.
  # db-init sets them; a service builds its DATAAGENT_DB_URL__SVC_<SCHEMA> from the same map.
  DB_ROLE_PASSWORDS: "{{ vault_db_role_passwords | to_json }}"
  API_OIDC_ISSUER: "{{ keycloak_public_url }}/realms/aeroflow"
  # The API opens one PgBouncer transaction pool per V3 schema role. Keep the
  # password source in the vault map so URLs cannot drift from db-init.
  DATAAGENT_DB_URL__SVC_ORG: "postgresql://svc_org:{{ vault_db_role_passwords.get('svc_org', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_QA: "postgresql://svc_qa:{{ vault_db_role_passwords.get('svc_qa', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_QUERY: "postgresql://svc_query:{{ vault_db_role_passwords.get('svc_query', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_WORKSPACE: "postgresql://svc_workspace:{{ vault_db_role_passwords.get('svc_workspace', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_INBOX: "postgresql://svc_inbox:{{ vault_db_role_passwords.get('svc_inbox', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_EVAL: "postgresql://svc_eval:{{ vault_db_role_passwords.get('svc_eval', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_AGENT: "postgresql://svc_agent:{{ vault_db_role_passwords.get('svc_agent', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_ACQUIRE: "postgresql://svc_acquire:{{ vault_db_role_passwords.get('svc_acquire', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_CATALOG: "postgresql://svc_catalog:{{ vault_db_role_passwords.get('svc_catalog', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_CONFLICT: "postgresql://svc_conflict:{{ vault_db_role_passwords.get('svc_conflict', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_CONTEXT: "postgresql://svc_context:{{ vault_db_role_passwords.get('svc_context', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_DOCUMENT: "postgresql://svc_document:{{ vault_db_role_passwords.get('svc_document', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_EXEC: "postgresql://svc_exec:{{ vault_db_role_passwords.get('svc_exec', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_FORECAST: "postgresql://svc_forecast:{{ vault_db_role_passwords.get('svc_forecast', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_GOVERNANCE: "postgresql://svc_governance:{{ vault_db_role_passwords.get('svc_governance', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_INGEST: "postgresql://svc_ingest:{{ vault_db_role_passwords.get('svc_ingest', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_INTEGRATION: "postgresql://svc_integration:{{ vault_db_role_passwords.get('svc_integration', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_MONITOR: "postgresql://svc_monitor:{{ vault_db_role_passwords.get('svc_monitor', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_NOTIFY: "postgresql://svc_notify:{{ vault_db_role_passwords.get('svc_notify', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_PACK: "postgresql://svc_pack:{{ vault_db_role_passwords.get('svc_pack', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_PERIOD: "postgresql://svc_period:{{ vault_db_role_passwords.get('svc_period', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_PIPELINE: "postgresql://svc_pipeline:{{ vault_db_role_passwords.get('svc_pipeline', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  DATAAGENT_DB_URL__SVC_SKILL: "postgresql://svc_skill:{{ vault_db_role_passwords.get('svc_skill', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"
  # The audit log is its own database, <pg_db>_audit (v3_0002): svc_audit writes it, and the relay
  # reads its outbox under a second connection key (libs/dataagent_db/session.py UNSCOPED_ROLES).
  DATAAGENT_DB_URL__SVC_AUDIT: "postgresql://svc_audit:{{ vault_db_role_passwords.get('svc_audit', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}_audit"
  DATAAGENT_DB_URL__SVC_AUDIT_WORKER: "postgresql://svc_audit_worker:{{ vault_db_role_passwords.get('svc_audit_worker', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}_audit"
  DATAAGENT_DB_URL__SVC_OUTBOX_RELAY_AUDIT: "postgresql://svc_outbox_relay:{{ vault_db_role_passwords.get('svc_outbox_relay', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}_audit"
  # worker-agent claims outbox rows of every organisation (read, stamp published_at; nothing else).
  DATAAGENT_DB_URL__SVC_OUTBOX_RELAY: "postgresql://svc_outbox_relay:{{ vault_db_role_passwords.get('svc_outbox_relay', '') }}@{{ pgbouncer_host }}:{{ pgbouncer_port }}/{{ pg_db }}"

  NEO4J_AUTH: "none"
  CLICKHOUSE_USER: "{{ clickhouse_user }}"
  CLICKHOUSE_PASSWORD: "{{ vault_clickhouse_password }}"
  MINIO_ROOT_USER: "{{ minio_user }}"
  MINIO_ROOT_PASSWORD: "{{ vault_minio_root_password }}"
  MINIO_URL: "http://{{ minio_user }}:{{ vault_minio_root_password }}@{{ minio_host }}:{{ minio_port }}"
  # worker-agent writes answer exports and nothing else: its own MinIO user, PutObject on
  # da-exports only (minio-init creates it), never the root credentials above.
  WORKER_AGENT_MINIO_PASSWORD: "{{ vault_worker_agent_minio_password | default('') }}"
  WORKER_AGENT_MINIO_URL: "http://worker-agent:{{ vault_worker_agent_minio_password | default('') }}@{{ minio_host }}:{{ minio_port }}"

  KAFKA_ADMIN_PASSWORD: "{{ vault_kafka_admin_password }}"
  AUDIT_CONSUMER_KAFKA_PASSWORD: "{{ vault_audit_consumer_kafka_password | default('') }}"
  MEMORY_CONSUMER_KAFKA_PASSWORD: "{{ vault_memory_consumer_kafka_password | default('') }}"
  SCHEMA_CRAWLER_WORKER_KAFKA_PASSWORD: "{{ vault_schema_crawler_worker_kafka_password | default('') }}"
  WEB_CRAWLER_WORKER_KAFKA_PASSWORD: "{{ vault_web_crawler_worker_kafka_password | default('') }}"

  KEYCLOAK_ADMIN: "{{ keycloak_admin_user }}"
  KEYCLOAK_ADMIN_PASSWORD: "{{ vault_keycloak_admin_password }}"
  KEYCLOAK_PUBLIC_URL: "{{ keycloak_public_url }}"
  PUBLIC_API_URL: "{{ public_api_url }}"
  GATEWAY_KEY: "{{ vault_gateway_key }}"
  SERVICE_AUTH_SECRET: "{{ vault_service_auth_secret }}"
  SMOKE_PASSWORD: "{{ vault_smoke_password }}"
  # Demo users' Keycloak passwords, set by the setup Job (kong-setup.sh). Unset in
  # the vault = that user's password is left as it is in Keycloak.
  DEMO_PASSWORD_PLATFORM_ADMIN: "{{ vault_demo_password_platform_admin | default('') }}"
  DEMO_PASSWORD_HELIOS_ADMIN: "{{ vault_demo_password_helios_admin | default('') }}"
  DEMO_PASSWORD_HELIOS_ENGINEER: "{{ vault_demo_password_helios_engineer | default('') }}"
  DEMO_PASSWORD_HELIOS_VIEWER: "{{ vault_demo_password_helios_viewer | default('') }}"
  DEMO_PASSWORD_AI_ENGINEER: "{{ vault_demo_password_ai_engineer | default('') }}"
  DEMO_PASSWORD_EXECUTIVE_VIEWER: "{{ vault_demo_password_executive_viewer | default('') }}"

  LITELLM_API_KEY: "{{ vault_litellm_api_key }}"
  LITELLM_DATABASE_URL: "postgresql://{{ pg_user }}:{{ vault_postgres_password }}@{{ pg_host }}:{{ pg_port }}/litellm"
  OPENAI_API_KEY: "{{ vault_openai_api_key }}"
  GEMINI_API_KEY: "{{ vault_gemini_api_key }}"
  REMOTE_API_KEY: "{{ vault_remote_api_key }}"
  REMOTE_LLM_KEY: "{{ vault_remote_llm_key }}"

  LANGFUSE_DATABASE_URL: "postgresql://{{ pg_user }}:{{ vault_postgres_password }}@{{ pg_host }}:{{ pg_port }}/langfuse"
  LANGFUSE_PUBLIC_URL: "{{ langfuse_public_url }}"
  LANGFUSE_SALT: "{{ vault_langfuse_salt }}"
  LANGFUSE_ENCRYPTION_KEY: "{{ vault_langfuse_encryption_key }}"
  LANGFUSE_NEXTAUTH_SECRET: "{{ vault_langfuse_nextauth_secret }}"
  LANGFUSE_PUBLIC_KEY: "{{ vault_langfuse_public_key }}"
  LANGFUSE_SECRET_KEY: "{{ vault_langfuse_secret_key }}"
  LANGFUSE_INIT_EMAIL: "{{ langfuse_init_email }}"
  LANGFUSE_INIT_PASSWORD: "{{ vault_langfuse_init_password }}"
  GRAFANA_ADMIN_PASSWORD: "{{ vault_grafana_admin_password }}"

  EVAL_AGENT_ID: "{{ eval_agent_id }}"
