---

env_name: k8s-local
k8s_env: dev

secrets_env_file: "{{ k8s_manifests }}/secrets.env"
openbao_keys_file: "{{ k8s_manifests }}/.openbao-keys.json"
openbao_env_file: "{{ k8s_manifests }}/.openbao-env.yml"

image_registry: "localhost:5001"
image_push: true
image_import: ""
image_tag: latest
# deb.debian.org is ~0.3 MB/s from this host and BizFly's mirror ~16 MB/s (measured 20/10/2026);
# apt checks signatures, so the mirror cannot change a package. Dockerfiles without the arg ignore it.
image_build_flags: "--provenance=false --sbom=false --build-arg DEBIAN_MIRROR=http://mirror.bizflycloud.vn/debian"

git_sync_enabled: false
git_branch: main

apply_databases: true
apply_jobs: false
apply_services: true
apply_setup: false

wait_statefulset: 600
wait_job: 900
# The rollout wait only reports (it never fails the run), so on this one node
# a longer wait just holds the run behind a crash-looping or unpullable pod.
wait_rollout: 180

# macOS local clusters do not expose the Linux /data mount used by production.
# Keep build logs outside the checkout, but on a writable local filesystem.
build_log_dir: "{{ lookup('env', 'TMPDIR') | default('/tmp', true) }}/dataagent-deploy/k8s-local"

seed_demo: true

public_api_url: http://localhost:30100
keycloak_public_url: http://localhost:30110
langfuse_public_url: http://localhost:30420
