---
- name: Deploy the Data Agent stack
  hosts: all
  gather_facts: false

  vars:
    kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default(lookup('env', 'HOME') ~ '/.kube/config', true) }}"

  environment:
    KUBECONFIG: "{{ kubeconfig }}"

  tasks:
    - name: Load the settings
      ansible.builtin.import_role:
        name: k8s_common

    - name: Check the cluster
      ansible.builtin.import_role:
        name: k8s_preflight

    - name: Create the state directory
      ansible.builtin.file:
        path: "{{ deploy_state_dir }}"
        state: directory
        mode: "0750"

    - name: Pull {{ git_remote }}/{{ git_branch }}
      when: git_sync_enabled | bool
      block:
        - name: Get HEAD before the pull
          ansible.builtin.command:
            cmd: git rev-parse HEAD
            chdir: "{{ project_dir }}"
          register: head_before
          changed_when: false

        - name: Switch to {{ git_branch }}
          ansible.builtin.command:
            cmd: "git switch {{ git_branch }}"
            chdir: "{{ project_dir }}"
          register: switch
          failed_when: false
          changed_when: switch.rc == 0

        - name: Pull {{ git_remote }} {{ git_branch }}
          ansible.builtin.command:
            cmd: "git pull {{ git_remote }} {{ git_branch }}"
            chdir: "{{ project_dir }}"
          register: pull
          when: switch.rc == 0
          failed_when: false
          changed_when: pull.rc == 0 and 'Already up to date' not in pull.stdout

    - name: Report a failed pull
      when:
        - git_sync_enabled | bool
        - ((switch | default({}, true)).rc | default(0) != 0)
          or ((pull | default({}, true)).rc | default(0) != 0)
      block:
        - name: Collect the conflicted files
          ansible.builtin.command:
            cmd: git diff --name-only --diff-filter=U
            chdir: "{{ project_dir }}"
          register: conflicts
          failed_when: false
          changed_when: false

        - name: Abort the merge
          ansible.builtin.command:
            cmd: git merge --abort
            chdir: "{{ project_dir }}"
          failed_when: false
          changed_when: false

        - name: Collect the diagnosis
          ansible.builtin.command:
            cmd: "{{ item.cmd }}"
            chdir: "{{ project_dir }}"
          loop:
            - { name: head_now, cmd: "git rev-parse HEAD" }
            - { name: tree, cmd: "git status --porcelain" }
            - { name: local_only, cmd: "git log --oneline {{ git_remote }}/{{ git_branch }}..HEAD" }
            - { name: incoming, cmd: "git log --oneline HEAD..{{ git_remote }}/{{ git_branch }}" }
          loop_control:
            label: "{{ item.name }}"
          register: diagnosis
          failed_when: false
          changed_when: false

        - name: Write the pull failure log
          ansible.builtin.copy:
            dest: "{{ pull_failure_log }}"
            mode: "0640"
            content: |
              {{ now(utc=true).isoformat(timespec='seconds') }}Z  env={{ env_name }}
              repo:        {{ project_dir }}
              branch:      {{ git_remote }}/{{ git_branch }}
              HEAD before: {{ head_before.stdout | trim }}
              HEAD now:    {{ diagnosis.results[0].stdout | default('?') | trim }}

              git switch {{ git_branch }}  ->  exit {{ (switch | default({}, true)).rc | default('?') }}
              {{ (switch | default({}, true)).stderr | default('') | trim }}

              git pull {{ git_remote }} {{ git_branch }}  ->  exit {{ (pull | default({}, true)).rc | default('not reached') }}
              {{ (pull | default({}, true)).stdout | default('') | trim }}
              {{ (pull | default({}, true)).stderr | default('') | trim }}

              conflicted files:
              {{ conflicts.stdout | default('') | trim | default('(none)', true) }}

              uncommitted changes (git status --porcelain):
              {{ diagnosis.results[1].stdout | default('') | trim | default('(none)', true) }}

              commits here but not on {{ git_remote }}/{{ git_branch }}:
              {{ diagnosis.results[2].stdout | default('') | trim | default('(none)', true) }}

              commits waiting on {{ git_remote }}/{{ git_branch }}:
              {{ diagnosis.results[3].stdout | default('') | trim | default('(none)', true) }}

        - name: Refuse to deploy
          ansible.builtin.fail:
            msg: >-
              Pull failed. Nothing was built, applied or restarted, and the
              checkpoint was not advanced.
              {{ 'Merge conflict in: ' ~ (conflicts.stdout_lines | default([]) | join(', ')) ~ '. The merge was aborted and the tree is back as it was.'
                 if (conflicts.stdout_lines | default([]) | length) > 0
                 else ('Could not switch to ' ~ git_branch ~ '.'
                       if ((switch | default({}, true)).rc | default(0) != 0)
                       else 'git pull failed.') }}
              Resolve it by hand, then rerun. Full diagnosis: {{ pull_failure_log }}

    - name: Reload the inventory vars from the pulled tree
      ansible.builtin.include_vars:
        dir: "{{ inventory_dir }}/group_vars/all"
        ignore_unknown_extensions: true
      when: git_sync_enabled | bool
      no_log: true

    - name: Get HEAD
      ansible.builtin.command:
        cmd: git rev-parse HEAD
        chdir: "{{ project_dir }}"
      register: head
      changed_when: false

    - name: Read the checkpoint
      ansible.builtin.slurp:
        src: "{{ checkpoint_file }}"
      register: checkpoint
      failed_when: false

    - name: Check the checkpoint is still in history
      ansible.builtin.command:
        cmd: "git cat-file -e {{ (checkpoint.content | default('') | b64decode) | trim }}^{commit}"
        chdir: "{{ project_dir }}"
      register: checkpoint_ok
      when: (checkpoint.content | default('') | b64decode | trim | length) > 0
      changed_when: false
      failed_when: false

    - name: Set the diff range
      ansible.builtin.set_fact:
        from_sha: "{{ (checkpoint.content | default('') | b64decode) | trim }}"
        to_sha: "{{ head.stdout | trim }}"
        full_deploy: >-
          {{ (deploy_full | bool)
             or (checkpoint.content | default('') | b64decode | trim | length) == 0
             or (checkpoint_ok.rc | default(1)) != 0 }}

    - name: Diff against the checkpoint
      ansible.builtin.command:
        cmd: "git diff --name-only {{ from_sha }} {{ to_sha }}"
        chdir: "{{ project_dir }}"
      register: git_diff
      when: not (full_deploy | bool)
      changed_when: false

    - name: Set what changed
      ansible.builtin.set_fact:
        changed_paths: "{{ git_diff.stdout_lines | default([]) }}"
        secrets_changed: >-
          {{ (full_deploy | bool) or (git_diff.stdout_lines | default([])
             | select('match', '^(' ~ (secret_paths | map('regex_escape') | join('|')) ~ ')')
             | list | length) > 0 }}
        config_changed: >-
          {{ (full_deploy | bool) or (git_diff.stdout_lines | default([])
             | select('match', '^(' ~ (config_paths | map('regex_escape') | join('|')) ~ ')')
             | list | length) > 0 }}
        # A tier's manifests are reapplied (and its rollout waited on) only when they, or
        # the playbook that renders them, changed: re-running `kubectl apply` on ~25
        # unchanged manifests and waiting on every store took ~14 s of a no-op deploy. A
        # new image is restarted by digest further down either way; -e deploy_full=true
        # reapplies everything (e.g. to undo a hand edit in the cluster).
        databases_changed: >-
          {{ (full_deploy | bool) or (git_diff.stdout_lines | default([])
             | select('match', '^(' ~ ((k8s_manifests | relpath(project_dir)) ~ '/database/') | regex_escape
                               ~ '|deploy/ansible/)')
             | list | length) > 0 }}
        services_changed: >-
          {{ (full_deploy | bool) or (git_diff.stdout_lines | default([])
             | select('match', '^(' ~ ((k8s_manifests | relpath(project_dir)) ~ '/service/') | regex_escape
                               ~ '|deploy/ansible/)')
             | list | length) > 0 }}

    - name: Report what changed
      ansible.builtin.debug:
        msg:
          - "from:    {{ from_sha | default('(no checkpoint)', true) }}"
          - "to:      {{ to_sha }}"
          - "changed: {{ 'everything' if (full_deploy | bool) else (changed_paths | length | string) ~ ' file(s)' }}"
          - "secrets: {{ secrets_changed }}   configmaps: {{ config_changed }}"
          - "reapply: database tier {{ databases_changed }}   service tier {{ services_changed }}"

    - name: Plan the images and Jobs
      ansible.builtin.import_role:
        name: k8s_plan

    - name: Build, push and import the images
      ansible.builtin.import_role:
        name: k8s_build

    - name: Check the vault exists
      ansible.builtin.stat:
        path: "{{ vault_file }}"
      register: vault_stat

    - name: Fail when the vault is missing
      ansible.builtin.fail:
        msg: >-
          {{ vault_file }} not found. Create it from
          {{ inventory_dir }}/group_vars/all/vault.yml.example and encrypt it with
          ansible-vault. It lives under .secrets/ so git never removes it.
      when: not vault_stat.stat.exists

    - name: Load the vault
      ansible.builtin.include_vars:
        file: "{{ vault_file }}"
      no_log: true

    - name: Refuse to run against a plaintext vault
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          [ -f "{{ vault_file }}" ] || exit 0
          head -c 14 "{{ vault_file }}" | grep -qF '$ANSIBLE_VAULT' && exit 0
          echo "{{ vault_file }} is not encrypted. Run: ansible-vault encrypt {{ vault_file }}" >&2
          exit 1
        executable: /bin/bash
      changed_when: false

    - name: Look for OpenBao credentials minted on a previous run
      ansible.builtin.stat:
        path: "{{ openbao_env_file }}"
      register: openbao_state_file

    - name: Load the OpenBao credentials minted on a previous run
      ansible.builtin.include_vars:
        file: "{{ openbao_env_file }}"
        name: openbao_state
      when: openbao_state_file.stat.exists
      no_log: true

    - name: Default the OpenBao credentials
      ansible.builtin.set_fact:
        openbao_env: >-
          {{ {'OPENBAO_TOKEN': '', 'OPENBAO_ROLE_ID': '', 'OPENBAO_SECRET_ID': ''}
             | combine((openbao_state | default({}, true)).openbao_env | default({}, true)) }}
      no_log: true

    - name: Render secrets.env from the vault
      ansible.builtin.template:
        src: templates/secrets.env.j2
        dest: "{{ secrets_env_file }}"
        mode: "0600"
      no_log: true

    # The snapshot and secret reapply below address namespaced resources, so a
    # clean cluster must have its namespaces before either task runs.
    - name: Apply namespaces, RBAC and NetworkPolicies
      ansible.builtin.command:
        cmd: >-
          {{ kubectl }} apply
          -f {{ (k8s_manifests ~ '/namespace.yaml') | quote }}
          -f {{ (k8s_manifests ~ '/rbac.yaml') | quote }}
          -f {{ (k8s_manifests ~ '/networkpolicy-service.yaml') | quote }}
          -f {{ (k8s_manifests ~ '/networkpolicy-database.yaml') | quote }}
          -f {{ (k8s_manifests ~ '/networkpolicy-sandbox.yaml') | quote }}
      register: base_apply
      changed_when: "'created' in base_apply.stdout or 'configured' in base_apply.stdout"

    # Snapshot before anything is reapplied, so that the restart step further
    # down can restart only the Deployments whose Secrets/ConfigMaps really moved.
    - name: Snapshot the service tier's Secrets and ConfigMaps before
      ansible.builtin.command:
        cmd: "{{ kubectl }} -n {{ ns_service }} get secrets,configmaps -o json"
      register: config_before_raw
      changed_when: false
      no_log: true

    - name: Hash the snapshot
      ansible.builtin.set_fact:
        config_before: "{{ config_before_raw.stdout | from_json | config_hashes }}"
      no_log: true

    - name: Reapply the Secrets
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          set -a; . "{{ secrets_env_file }}"; set +a
          bash "{{ k8s_dir }}/create-secrets.sh" >/dev/null

          jaas=$(mktemp); trap 'rm -f "$jaas"' EXIT
          sed -e "s|REPLACE_WITH_KAFKA_ADMIN_PASSWORD|${KAFKA_ADMIN_PASSWORD}|g" \
              -e "s|REPLACE_WITH_AUDIT_CONSUMER_PASSWORD|${AUDIT_CONSUMER_KAFKA_PASSWORD}|g" \
              -e "s|REPLACE_WITH_WORKFLOW_RUNTIME_PASSWORD|${WORKFLOW_RUNTIME_KAFKA_PASSWORD}|g" \
              -e "s|REPLACE_WITH_MEMORY_CONSUMER_PASSWORD|${MEMORY_CONSUMER_KAFKA_PASSWORD}|g" \
              -e "s|REPLACE_WITH_SCHEMA_CRAWLER_WORKER_PASSWORD|${SCHEMA_CRAWLER_WORKER_KAFKA_PASSWORD}|g" \
              -e "s|REPLACE_WITH_WEB_CRAWLER_WORKER_PASSWORD|${WEB_CRAWLER_WORKER_KAFKA_PASSWORD}|g" \
              "{{ docker_dir }}/kafka/kafka-broker-jaas.config.example" > "$jaas"
          kubectl -n {{ ns_database }} create secret generic kafka-jaas \
            --from-file=kafka-broker-jaas.config="$jaas" \
            --dry-run=client -o yaml | kubectl apply -f - >/dev/null
        executable: /bin/bash
      when: secrets_changed | bool
      changed_when: true

    - name: Apply the ConfigMap manifest
      ansible.builtin.command:
        cmd: "{{ kubectl }} apply -f {{ (k8s_manifests ~ '/configmap.yaml') | quote }}"
      register: cm_manifest
      changed_when: "'configured' in cm_manifest.stdout or 'created' in cm_manifest.stdout"

    - name: Reapply the file-backed ConfigMaps
      ansible.builtin.command:
        cmd: "bash {{ (k8s_dir ~ '/create-configmaps.sh') | quote }}"
        chdir: "{{ project_dir }}"
      when: config_changed | bool
      changed_when: true

    - name: Apply the database tier
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          stage=$(mktemp -d); trap 'rm -rf "$stage"' EXIT
          {% if database_manifests | length > 0 %}
          for name in {% for name in database_manifests %}{{ name | quote }} {% endfor %}; do
            f="{{ k8s_manifests }}/database/$name.yaml"
            {{ manifest_sed }} "$f" > "$stage/$name.yaml"
          done
          {% else %}
          for f in "{{ k8s_manifests }}/database"/*.yaml; do
            {{ manifest_sed }} "$f" > "$stage/$(basename "$f")"
          done
          {% endif %}
          {{ kubectl }} apply -f "$stage/"
        executable: /bin/bash
      register: db_apply
      changed_when: "'created' in db_apply.stdout or 'configured' in db_apply.stdout"
      when: (apply_databases | bool) and (databases_changed | bool)

    - name: Wait for the stores
      ansible.builtin.command:
        cmd: >-
          {{ kubectl }} -n {{ ns_database }} rollout status statefulset/{{ item }}
          --timeout={{ wait_statefulset }}s
      loop: "{{ ['postgres'] + database_workloads }}"
      changed_when: false
      when: (apply_databases | bool) and (databases_changed | bool)

    - name: Wait for pgbouncer
      ansible.builtin.command:
        cmd: >-
          {{ kubectl }} -n {{ ns_database }} rollout status deployment/pgbouncer
          --timeout={{ wait_rollout }}s
      changed_when: false
      when: (apply_databases | bool) and (databases_changed | bool)

    - name: Initialise OpenBao and mint the AppRole
      ansible.builtin.import_role:
        name: k8s_openbao
      when: apply_databases | bool

    - name: Re-render secrets.env with the minted credentials
      ansible.builtin.template:
        src: templates/secrets.env.j2
        dest: "{{ secrets_env_file }}"
        mode: "0600"
      when: openbao_minted | default(false) | bool
      no_log: true

    - name: Reapply the Secrets that carry the OpenBao credentials
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          set -a; . "{{ secrets_env_file }}"; set +a
          bash "{{ k8s_dir }}/create-secrets.sh" >/dev/null
        executable: /bin/bash
      when: openbao_minted | default(false) | bool
      changed_when: true

    - name: Apply the service tier
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          stage=$(mktemp -d); trap 'rm -rf "$stage"' EXIT
          {% if service_manifests | length > 0 %}
          for name in {% for name in service_manifests %}{{ name | quote }} {% endfor %}; do
            f="{{ k8s_manifests }}/service/$name.yaml"
            {{ manifest_sed }} "$f" > "$stage/$name.yaml"
          done
          {% else %}
          for f in "{{ k8s_manifests }}/service"/*.yaml; do
            {{ manifest_sed }} "$f" > "$stage/$(basename "$f")"
          done
          {% endif %}
          {{ kubectl }} apply -f "$stage/"
        executable: /bin/bash
      register: svc_apply
      changed_when: "'created' in svc_apply.stdout or 'configured' in svc_apply.stdout"
      when: (apply_services | bool) and (services_changed | bool)

    # After the service tier, whose manifests carry per-workload env ConfigMaps
    # of their own, so a change there is seen too.
    - name: Snapshot the service tier's Secrets and ConfigMaps after
      ansible.builtin.command:
        cmd: "{{ kubectl }} -n {{ ns_service }} get secrets,configmaps -o json"
      register: config_after_raw
      changed_when: false
      no_log: true

    - name: Work out which Secrets and ConfigMaps changed
      ansible.builtin.set_fact:
        config_changed_keys: >-
          {{ config_before | changed_keys(config_after_raw.stdout | from_json | config_hashes) }}
      # Only names come out, but a templating error would echo the Secret data.
      no_log: true

    - name: Report the Secrets and ConfigMaps that changed
      ansible.builtin.debug:
        msg: "changed in {{ ns_service }}: {{ config_changed_keys | join(', ') | default('nothing', true) }}"

    # Kong cannot start until its schema exists, while the normal job block is
    # below the gateway wait. On a clean cluster that ordering deadlocks, so
    # run only this prerequisite before waiting for the gateway.
    - name: Run Kong migration before waiting for the gateway
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          {{ kubectl }} -n {{ ns_service }} delete job kong-migration --ignore-not-found
          stage=$(mktemp -d); trap 'rm -rf "$stage"' EXIT
          {{ manifest_sed }} "{{ k8s_manifests }}/job/kong-migration.yaml" > "$stage/kong-migration.yaml"
          {{ kubectl }} apply -f "$stage/kong-migration.yaml"
          {{ kubectl }} -n {{ ns_service }} wait --for=condition=complete job/kong-migration --timeout={{ wait_job }}s
        executable: /bin/bash
      register: kong_migration_pre_gateway
      changed_when: true
      when:
        - apply_jobs | bool
        - jobs_rerun | selectattr('name', 'equalto', 'kong-migration') | list | length > 0

    - name: Remove the pre-gateway Kong migration from the later job batch
      ansible.builtin.set_fact:
        jobs_rerun: "{{ jobs_rerun | rejectattr('name', 'equalto', 'kong-migration') | list }}"
      when: kong_migration_pre_gateway is defined and kong_migration_pre_gateway is succeeded

    - name: Wait for the gateway
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          for d in keycloak kong; do
            {{ kubectl }} -n {{ ns_service }} rollout status deployment/$d \
              --timeout={{ wait_rollout }}s >/dev/null 2>&1 || echo "$d" &
          done
          wait
        executable: /bin/bash
      register: gateway_rollout
      changed_when: false
      when: (apply_services | bool) and (services_changed | bool)

    - name: Report the gateway
      ansible.builtin.debug:
        msg: "Gateway not ready in {{ wait_rollout }}s: {{ gateway_rollout.stdout_lines | join(', ') }}"
      when: (gateway_rollout.stdout_lines | default([]) | length) > 0

    - name: Rerun the migration and init Jobs
      when:
        - apply_jobs | bool
        - jobs_rerun | length > 0
      vars:
        rerun_names: "{{ jobs_rerun | map(attribute='name') | list }}"
        rerun_migrations: "{{ migration_jobs | select('in', rerun_names) | list }}"
        rerun_inits: "{{ job_workloads | select('in', rerun_names) | list }}"
      block:
        - name: Delete the Jobs
          ansible.builtin.command:
            cmd: >-
              {{ kubectl }} -n {{ ns_service }} delete job
              {{ rerun_names | join(' ') }} --ignore-not-found
          changed_when: true

        - name: Apply the migration Jobs
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              stage=$(mktemp -d); trap 'rm -rf "$stage"' EXIT
              for j in {{ rerun_migrations | join(' ') }}; do
                {{ manifest_sed }} "{{ k8s_manifests }}/job/$j.yaml" > "$stage/$j.yaml"
              done
              {{ kubectl }} apply -f "$stage/"
            executable: /bin/bash
          when: rerun_migrations | length > 0
          changed_when: true

        # Polls for Complete *or* Failed. `kubectl wait --for=condition=complete`
        # cannot see a failure, so a Job that had given up still held the run for
        # the whole wait_job (15 min) before the logs were shown.
        - name: Wait for the migration Jobs
          ansible.builtin.command:
            cmd: >-
              {{ kubectl }} -n {{ ns_service }} get job/{{ item }}
              -o jsonpath={% raw %}'{.status.conditions[?(@.status=="True")].type}'{% endraw %}
          loop: "{{ rerun_migrations }}"
          register: job_state
          until: ('Complete' in job_state.stdout) or ('Failed' in job_state.stdout)
          retries: "{{ (wait_job | int) // (job_poll | int) }}"
          delay: "{{ job_poll | int }}"
          changed_when: false
          failed_when: "'Complete' not in job_state.stdout"

        - name: Apply the init Jobs
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              stage=$(mktemp -d); trap 'rm -rf "$stage"' EXIT
              for j in {{ rerun_inits | join(' ') }}; do
                {{ manifest_sed }} "{{ k8s_manifests }}/job/$j.yaml" \
                  | sed "s|SEED_DEMO: '0'|SEED_DEMO: '{{ 1 if (seed_demo | bool) else 0 }}'|" \
                  > "$stage/$j.yaml"
              done
              {{ kubectl }} apply -f "$stage/"
            executable: /bin/bash
          when: rerun_inits | length > 0
          changed_when: true

        - name: Wait for the init Jobs
          ansible.builtin.command:
            cmd: >-
              {{ kubectl }} -n {{ ns_service }} get job/{{ item }}
              -o jsonpath={% raw %}'{.status.conditions[?(@.status=="True")].type}'{% endraw %}
          loop: "{{ rerun_inits }}"
          register: job_state
          until: ('Complete' in job_state.stdout) or ('Failed' in job_state.stdout)
          retries: "{{ (wait_job | int) // (job_poll | int) }}"
          delay: "{{ job_poll | int }}"
          changed_when: false
          failed_when: "'Complete' not in job_state.stdout"

      rescue:
        - name: Get the Job logs
          ansible.builtin.shell:
            cmd: "{{ kubectl }} -n {{ ns_service }} logs job/{{ item }} --tail=40 2>&1 || true"
            executable: /bin/bash
          loop: "{{ rerun_names }}"
          register: job_logs
          changed_when: false

        - name: Report the Job logs
          ansible.builtin.debug:
            msg: "{{ job_logs.results | map(attribute='stdout_lines') | flatten }}"

        - name: Fail on the Jobs
          ansible.builtin.fail:
            msg: "See the logs above. The checkpoint was not advanced, so the next run retries this commit."

    # A rebuilt image keeps its :latest reference, so apply changes nothing and
    # the pods have to be restarted. Only those actually running a different
    # digest are: a rebuild that came out identical restarts nothing. Finished
    # pods are left out: after a node reboot old ReplicaSets' pods linger as
    # Completed with the digest they ran, and would look stale forever.
    - name: List the images the pods are running
      ansible.builtin.command:
        cmd: >-
          {{ kubectl }} get pods -A
          --field-selector=status.phase!=Succeeded,status.phase!=Failed -o
          jsonpath={% raw %}'{range .items[*]}{range .status.containerStatuses[*]}{.image} {.imageID}{"\n"}{end}{end}'{% endraw %}
      register: pod_images
      changed_when: false
      when: built | length > 0 and (image_registry | length) > 0

    - name: List the workloads and their images
      ansible.builtin.command:
        cmd: >-
          {{ kubectl }} get deployments,statefulsets -A -o
          jsonpath={% raw %}'{range .items[*]}{.kind}/{.metadata.name} {.metadata.namespace} {.spec.template.spec.containers[*].image}{"\n"}{end}'{% endraw %}
      register: workload_images
      changed_when: false
      when: built | length > 0

    # Without a registry there is no digest to compare with the pods (an
    # imported image is referenced by tag), so every rebuilt image counts.
    - name: Pick the workloads running an outdated image
      ansible.builtin.set_fact:
        restart_for_images: >-
          {{ workload_images.stdout_lines | workloads_running(
               outdated | map('regex_replace', '^', image_deploy_prefix ~ '/')
                        | map('regex_replace', '$', ':' ~ image_tag) | list) }}
      vars:
        outdated: >-
          {{ (built | stale_images(pod_images.stdout_lines, image_deploy_prefix, image_tag))
             if (image_registry | length) > 0 else (built.keys() | list) }}
      when: built | length > 0

    - name: List the service tier Deployments
      ansible.builtin.command:
        cmd: "{{ kubectl }} -n {{ ns_service }} get deployments -o json"
      register: svc_deployments
      changed_when: false
      when:
        - apply_services | bool
        - config_changed_keys | length > 0

    # Only the Deployments that read a Secret or ConfigMap whose content moved.
    # Before, any Secret/ConfigMap change restarted all ~25 of them — including a
    # seed file, which only the seed Job reads.
    - name: Pick the Deployments reading a changed Secret or ConfigMap
      ansible.builtin.set_fact:
        restart_for_config: >-
          {{ (svc_deployments.stdout | from_json) | workloads_reading(config_changed_keys)
             | map('regex_replace', '$', ' ' ~ ns_service) | list }}
      when: svc_deployments.stdout is defined

    - name: Restart the workloads
      ansible.builtin.command:
        cmd: "{{ kubectl }} -n {{ item.split(' ')[1] }} rollout restart {{ item.split(' ')[0] }}"
      # One list, each workload once: restarting the same one twice within a
      # second fails with "restart has already been triggered".
      loop: "{{ restart_workloads }}"
      vars:
        restart_workloads: "{{ (restart_for_images | default([]) + restart_for_config | default([])) | unique | sort }}"
      changed_when: true

    - name: Report the restarts
      ansible.builtin.debug:
        msg:
          - "for images:  {{ restart_for_images | default([]) | map('regex_replace', ' .*$', '') | join(', ') | default('none', true) }}"
          - "for config:  {{ restart_for_config | default([]) | map('regex_replace', ' .*$', '') | join(', ') | default('none', true) }}"

    # Every wait runs at once: the run takes as long as the slowest rollout,
    # not their sum (up to wait_rollout for each, one after another, before).
    - name: Wait for the service tier and every restarted workload
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          printf '%s\n' {{ wait_list | map('quote') | join(' ') }} | {
            while read -r ref ns; do
              {{ kubectl }} -n "$ns" rollout status "$ref" --timeout={{ wait_rollout }}s \
                >/dev/null 2>&1 || echo "$ns/$ref" &
            done
            wait
          }
        executable: /bin/bash
      vars:
        wait_list: >-
          {{ (((service_workloads | map('regex_replace', '^', 'Deployment/')
                 | map('regex_replace', '$', ' ' ~ ns_service) | list) if ((apply_services | bool) and (services_changed | bool)) else [])
              + (restart_for_images | default([])) + (restart_for_config | default([]))) | unique }}
      register: svc_rollout
      changed_when: false
      when: wait_list | length > 0

    - name: Report the workloads that did not come back
      ansible.builtin.debug:
        msg: "Not ready in {{ wait_rollout }}s: {{ svc_rollout.stdout_lines | join(', ') }}"
      when: (svc_rollout.stdout_lines | default([]) | length) > 0

    - name: Run the gateway setup Job
      ansible.builtin.import_role:
        name: k8s_setup

    - name: Verify
      ansible.builtin.import_role:
        name: k8s_verify

    - name: Advance the checkpoint
      ansible.builtin.copy:
        dest: "{{ checkpoint_file }}"
        mode: "0640"
        content: |
          {{ to_sha }}
