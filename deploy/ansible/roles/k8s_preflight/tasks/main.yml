---
- name: Check kubectl
  ansible.builtin.command: "{{ kubectl }} version --client -o json"
  changed_when: false

- name: Check API server
  ansible.builtin.command: "{{ kubectl }} get --raw /healthz"
  register: apiserver
  until: apiserver.rc == 0
  retries: 10
  delay: 3
  changed_when: false

- name: Check image registry
  ansible.builtin.uri:
    url: "{{ image_registry_url }}/v2/"
    method: GET
    status_code: 200
    return_content: false
  when: image_registry | length > 0
  changed_when: false

- name: Get current context
  ansible.builtin.command: "{{ kubectl }} config current-context"
  register: kube_context
  changed_when: false
  failed_when: false

- name: Check node readiness
  ansible.builtin.command: >
    {{ kubectl }} get nodes
    -o jsonpath={% raw %}'{range .items[*]}{.metadata.name}={.status.conditions[?(@.type=="Ready")].status} {end}'{% endraw %}
  register: nodes
  changed_when: false
  failed_when: "'=False' in nodes.stdout or nodes.stdout | trim | length == 0"

- name: Check required files
  ansible.builtin.stat:
    path: "{{ item }}"
  register: k8s_files
  failed_when: not k8s_files.stat.exists
  loop:
    - "{{ k8s_manifests }}/namespace.yaml"
    - "{{ k8s_dir }}/create-secrets.sh"
    - "{{ k8s_dir }}/create-configmaps.sh"
    - "{{ k8s_dir }}/secrets.env.example"
    - "{{ docker_dir }}/kafka/kafka-broker-jaas.config.example"

# GEN-06: the production manifests take these addresses from the inventory (manifest_values);
# an empty one would deploy a placeholder, a '|' or '&' would break the sed that substitutes it.
- name: Check the addresses of a production install
  ansible.builtin.assert:
    that:
      - item.value | length > 0
      - "'|' not in item.value and '&' not in item.value"
    fail_msg: >-
      {{ item.key }} is empty or holds '|' or '&': set it in the inventory
      (llm_main_base_url, llm_fast_base_url, embedding_base_url, document_embed_url,
      document_rerank_url, gpu_egress_cidr, frontend_origins; roles/k8s_common/defaults/main.yml).
    quiet: true
  loop: "{{ manifest_values | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: k8s_env == 'production'

- name: Report preflight
  ansible.builtin.debug:
    msg:
      - "context: {{ kube_context.stdout | default('none') }}"
      - "nodes:   {{ nodes.stdout | trim }}"
