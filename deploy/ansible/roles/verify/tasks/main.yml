---
# Proof the deployment works as a product, not just that containers run.
- name: Gateway rejects an anonymous agent call
  ansible.builtin.uri:
    url: "{{ kong_public_url }}/api/orchestrate/stream"
    method: POST
    body_format: json
    body: { query: ping, user_id: verify }
    status_code: [401, 403]

- name: Keycloak issues a token (password grant, {{ smoke_user }})
  ansible.builtin.uri:
    url: "{{ keycloak_public_url }}/realms/{{ keycloak_realm }}/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: aeroflow-frontend
      username: "{{ smoke_user }}"
      password: "{{ smoke_password }}"
  register: kc_token
  no_log: true

- name: Runtime routes through Kong (catalog, reviews)
  ansible.builtin.uri:
    url: "{{ kong_public_url }}{{ item }}"
    headers: { Authorization: "Bearer {{ kc_token.json.access_token }}" }
    return_content: true
  register: routes
  loop:
    - /api/catalog/agents
    - /api/reviews/pending

- name: Seeded agent is in the catalog
  ansible.builtin.assert:
    that: demo_agent_id in (routes.results[0].json | map(attribute='id') | list)
    fail_msg: "e2e-sql-agent missing from /api/catalog/agents"
  when: (seed_demo | bool)

- name: One real turn produces text, evidence and [DONE]
  when: (run_smoke | bool)
  block:
    - name: Ask through the whole chain
      ansible.builtin.shell: >
        curl -sN --max-time 300 -X POST {{ kong_public_url }}/api/orchestrate/stream
        -H 'Authorization: Bearer {{ kc_token.json.access_token }}' -H 'Content-Type: application/json'
        -d '{"query":"Doanh thu thuần tháng này theo vùng","agent_id":"{{ demo_agent_id }}","user_id":"verify","messages":[]}'
      register: smoke
      changed_when: false
      no_log: true

    - name: Frames present
      ansible.builtin.assert:
        that:
          - "'__session_id' in smoke.stdout"
          - "'__evidence' in smoke.stdout"
          - "'[DONE]' in smoke.stdout"
          - "'[ERROR]' not in smoke.stdout"
        fail_msg: "agent turn did not complete cleanly — see docker logs dataagent-workflow-runtime"

- name: Kong admin API is not published on the host (replaces infra/scripts/verify_kong_admin_locked.sh)
  when: not (kong_admin_published | bool)
  block:
    - name: Published ports of the kong container
      ansible.builtin.command: docker port {{ kong_container | default("dataagent-kong") }} 8001
      register: kong_admin_port
      changed_when: false
      failed_when: false

    - name: Admin port must be unreachable from outside the compose network
      ansible.builtin.assert:
        that: kong_admin_port.stdout | trim | length == 0
        fail_msg: "Kong admin (8001) is published: {{ kong_admin_port.stdout }} — remove the port mapping in prod"
        success_msg: "Kong admin port not published"

- name: Summary
  ansible.builtin.debug:
    msg:
      - "Kong:      {{ kong_public_url }}  (routes ok)"
      - "Keycloak:  {{ keycloak_public_url }}/realms/{{ keycloak_realm }}  (token ok)"
      - "Agents:    {{ routes.results[0].json | map(attribute='name') | list }}"
      - "Frontend:  VITE_API_URL={{ kong_public_url }} npm run dev  →  http://localhost:3000"
