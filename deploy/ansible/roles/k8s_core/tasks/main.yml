---
- name: Create namespaces
  ansible.builtin.command: "{{ kubectl }} apply -f {{ k8s_dir }}/namespace.yaml"
  register: ns_apply
  changed_when: "'created' in ns_apply.stdout or 'configured' in ns_apply.stdout"

- name: Wait for namespaces
  ansible.builtin.command: "{{ kubectl }} get namespace {{ item }} -o jsonpath={% raw %}'{.status.phase}'{% endraw %}"
  register: ns_phase
  until: ns_phase.stdout == 'Active'
  retries: "{{ wait_namespace }}"
  delay: 1
  changed_when: false
  loop:
    - "{{ ns_service }}"
    - "{{ ns_database }}"

- name: Create configmap and rbac
  ansible.builtin.command: >
    {{ kubectl }} apply -f {{ k8s_dir }}/configmap.yaml -f {{ k8s_dir }}/rbac.yaml
  register: core_apply
  changed_when: "'created' in core_apply.stdout or 'configured' in core_apply.stdout"

- name: Create networkpolicies
  ansible.builtin.command: >
    {{ kubectl }} apply
    -f {{ k8s_dir }}/networkpolicy-service.yaml
    -f {{ k8s_dir }}/networkpolicy-database.yaml
  register: netpol_apply
  changed_when: "'created' in netpol_apply.stdout or 'configured' in netpol_apply.stdout"
