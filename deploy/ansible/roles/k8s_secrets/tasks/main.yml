---
- name: Decrypt secrets.env
  ansible.builtin.copy:
    src: "{{ secrets_env_source }}"
    dest: "{{ secrets_env_file }}"
    mode: "0600"
  when: (secrets_env_source | length) > 0
  no_log: true

- name: Validate secrets.env
  ansible.builtin.shell: |
    set -euo pipefail
    f={{ secrets_env_file }}
    [ -f "$f" ] || { echo "missing: $f"; exit 1; }
    perms=$(stat -c '%a' "$f")
    [ "$perms" = "600" ] || { echo "$f is mode $perms, must be 600"; exit 1; }
    missing=$(comm -23 \
      <(grep -oE '^[A-Z0-9_]+' {{ k8s_dir }}/secrets.env.example | sort -u) \
      <(grep -oE '^[A-Z0-9_]+' "$f" | sort -u))
    [ -z "$missing" ] || { echo "secrets.env is missing keys:"; echo "$missing"; exit 1; }
  args:
    executable: /bin/bash
  changed_when: false

- name: Create secrets
  ansible.builtin.shell: |
    set -euo pipefail
    set -a; . {{ secrets_env_file }}; set +a
    bash {{ k8s_dir }}/create-secrets.sh
  args:
    executable: /bin/bash
  register: secrets_apply
  changed_when: "'created' in secrets_apply.stdout or 'configured' in secrets_apply.stdout"
  notify: Restart services

- name: Create kafka-jaas secret
  ansible.builtin.shell: |
    set -euo pipefail
    set -a; . {{ secrets_env_file }}; set +a
    jaas=$(mktemp)
    trap 'rm -f "$jaas"' EXIT
    sed -e "s|REPLACE_WITH_KAFKA_ADMIN_PASSWORD|${KAFKA_ADMIN_PASSWORD}|g" \
        -e "s|REPLACE_WITH_AUDIT_CONSUMER_PASSWORD|${AUDIT_CONSUMER_KAFKA_PASSWORD}|g" \
        -e "s|REPLACE_WITH_RELEASE_WORKER_PASSWORD|${RELEASE_WORKER_KAFKA_PASSWORD}|g" \
        -e "s|REPLACE_WITH_WORKFLOW_RUNTIME_PASSWORD|${WORKFLOW_RUNTIME_KAFKA_PASSWORD}|g" \
        -e "s|REPLACE_WITH_MEMORY_CONSUMER_PASSWORD|${MEMORY_CONSUMER_KAFKA_PASSWORD}|g" \
        -e "s|REPLACE_WITH_SCHEMA_CRAWLER_WORKER_PASSWORD|${SCHEMA_CRAWLER_WORKER_KAFKA_PASSWORD}|g" \
        {{ docker_dir }}/kafka/kafka-broker-jaas.config.example > "$jaas"
    {{ kubectl }} -n {{ ns_database }} create secret generic kafka-jaas \
      --from-file=kafka-broker-jaas.config="$jaas" \
      --dry-run=client -o yaml | {{ kubectl }} apply -f -
  args:
    executable: /bin/bash
  register: jaas_apply
  changed_when: "'created' in jaas_apply.stdout or 'configured' in jaas_apply.stdout"

- name: Create configmaps
  ansible.builtin.command: "bash {{ k8s_dir }}/create-configmaps.sh"
  args:
    chdir: "{{ project_dir }}"
  register: cm_apply
  changed_when: "'created' in cm_apply.stdout or 'configured' in cm_apply.stdout"
  notify: Restart services
