---
# Offline install bundle — what a closed-network customer receives:
#   images.tar.gz   every image the compose stack references (docker save)
#   code.tar.gz     compose files + service configs + playbook + seed (no source, no node_modules)
#   ollama/         the local LLM weights (optional; bundle_include_ollama)
#   install.sh      load images → restore model → unpack → ansible-playbook
#   SHA256SUMS, manifest.json
#
#   ansible-playbook site.yml --tags bundle
#   ansible-playbook site.yml --tags bundle -e bundle_image_filter='^postgres'   # quick dry run
- name: Compose command line
  ansible.builtin.set_fact:
    compose_cmd: "docker compose -p {{ compose_project }} --env-file {{ project_dir }}/.env{% for p in compose_profiles %} --profile {{ p }}{% endfor %}{% for f in compose_files %} -f {{ compose_dir }}/{{ f }}{% endfor %}"

- name: Version from git
  ansible.builtin.command: git -C {{ project_dir }} describe --tags --always --dirty
  register: git_describe
  changed_when: false
  failed_when: false

- name: Commit from git
  ansible.builtin.command: git -C {{ project_dir }} rev-parse --short HEAD
  register: git_commit
  changed_when: false
  failed_when: false

- name: Bundle identity
  ansible.builtin.set_fact:
    bundle_version: "{{ bundle_version_override | default(git_describe.stdout | default('dev', true), true) }}"
    bundle_git_commit: "{{ git_commit.stdout | default('unknown', true) }}"
    bundle_built_at: "{{ ansible_date_time.iso8601 }}"
    bundle_stage: "{{ bundle_dir }}/{{ compose_project }}-{{ bundle_version_override | default(git_describe.stdout | default('dev', true), true) }}"

- name: Fresh staging directory
  ansible.builtin.file:
    path: "{{ bundle_stage }}"
    state: "{{ item }}"
    mode: "0755"
  loop: [absent, directory]

- name: Rendered compose config (profiles applied)
  ansible.builtin.command: "{{ compose_cmd }} config --format json"
  register: compose_config
  changed_when: false

- name: Image helper on the target
  ansible.builtin.copy:
    src: "{{ role_path }}/../compose_stack/files/service_images.py"
    dest: /tmp/dataagent-service-images.py
    mode: "0644"

- name: Images of the deployed services only
  ansible.builtin.command: python3 /tmp/dataagent-service-images.py {{ compose_services | join(',') }}
  args:
    stdin: "{{ compose_config.stdout }}"
  register: compose_images
  changed_when: false

- name: Image list (filtered, sorted)
  ansible.builtin.set_fact:
    bundle_images: "{{ compose_images.stdout_lines | map('trim') | select('match', bundle_image_filter) | unique | sort | list }}"

- name: Every image is present locally (pull/build the rest first)
  ansible.builtin.command: docker image inspect {{ item }}
  loop: "{{ bundle_images }}"
  changed_when: false

- name: Previous images.tar.gz for this version (bundle_reuse_images)
  ansible.builtin.stat:
    path: "{{ bundle_dir }}/images-{{ compose_project }}-{{ bundle_version }}.tar.gz"
  register: images_cache

- name: docker save → images.tar.gz ({{ bundle_images | length }} images — takes a while)
  ansible.builtin.shell: >
    set -o pipefail;
    docker save {{ bundle_images | join(' ') }} | gzip -{{ bundle_gzip_level }} > {{ images_cache.stat.path }}
  args:
    executable: /bin/bash
  when: not (images_cache.stat.exists and (bundle_reuse_images | bool))
  changed_when: true

- name: images.tar.gz into the stage (hard link — no second copy)
  ansible.builtin.file:
    src: "{{ images_cache.stat.path }}"
    dest: "{{ bundle_stage }}/images.tar.gz"
    state: hard

- name: code.tar.gz — compose, configs, playbook, seed, docs (no source tree)
  ansible.builtin.shell: >
    set -o pipefail;
    tar -C {{ project_dir }} -czf {{ bundle_stage }}/code.tar.gz
    --exclude='*.ps1' --exclude='.env' --exclude='.env.*' --exclude='.secrets' --exclude='*.key' --exclude='*.pem'
    --exclude='kafka-broker-jaas.config' --exclude='.root-token' --exclude='.init-keys*'
    --exclude='deploy/ansible/inventories/prod/hosts.yml' --exclude='deploy/ansible/inventories/prod/group_vars/all.yml'
    --exclude='deploy/ansible/inventories/prod/group_vars/all/vault.yml'
    {{ bundle_code_paths | join(' ') }}
  args:
    executable: /bin/bash
  changed_when: true

- name: Secret-free check of code.tar.gz
  ansible.builtin.shell: >
    set -o pipefail;
    tar tzf {{ bundle_stage }}/code.tar.gz | grep -E '(^|/)\.env($|\.)|\.key$|\.pem$|jaas\.config$|root-token|init-keys|/\.secrets' | grep -v '\.example$' || true
  args:
    executable: /bin/bash
  register: leaked
  changed_when: false
  failed_when: leaked.stdout | length > 0

- name: ollama model weights
  when: bundle_include_ollama | bool
  block:
    - name: Export helper
      ansible.builtin.copy:
        src: ollama_export.py
        dest: /tmp/dataagent-ollama-export.py
        mode: "0644"

    - name: Copy {{ ollama_model }} (manifest + blobs)
      ansible.builtin.command: python3 /tmp/dataagent-ollama-export.py {{ ollama_model }} {{ bundle_stage }}/ollama
      register: ollama_export
      changed_when: true

- name: install.sh
  ansible.builtin.template:
    src: install.sh.j2
    dest: "{{ bundle_stage }}/install.sh"
    mode: "0755"

- name: manifest.json
  ansible.builtin.template:
    src: manifest.json.j2
    dest: "{{ bundle_stage }}/manifest.json"
    mode: "0644"

- name: SHA256SUMS (everything except itself)
  ansible.builtin.shell: >
    set -o pipefail;
    cd {{ bundle_stage }} && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 | sed 's|  ./|  |' > SHA256SUMS
  args:
    executable: /bin/bash
  changed_when: true

- name: Bundle size
  ansible.builtin.command: du -sh {{ bundle_stage }}
  register: bundle_size
  changed_when: false

- name: Result
  ansible.builtin.debug:
    msg:
      - "bundle:  {{ bundle_stage }}  ({{ bundle_size.stdout.split()[0] }})"
      - "images:  {{ bundle_images | length }} → images.tar.gz"
      - "ollama:  {{ ollama_export.stdout | default('not included') }}"
      - "install: copy the directory to the host, then ./install.sh --dir /opt/data-agent"
