---
- name: Set openbao paths
  ansible.builtin.set_fact:
    bao_exec: "{{ kubectl }} exec -n {{ ns_database }} statefulset/openbao --"
    bao_keys_file: "{{ openbao_keys_file }}"

- name: Wait for openbao
  ansible.builtin.command: "{{ bao_exec }} bao status -format=json"
  register: bao_status_raw
  until: bao_status_raw.rc in [0, 2]
  retries: 30
  delay: 2
  changed_when: false
  failed_when: false

- name: Set openbao status
  ansible.builtin.set_fact:
    bao_status: "{{ bao_status_raw.stdout | from_json }}"

- name: Check existing keys file
  ansible.builtin.stat:
    path: "{{ bao_keys_file }}"
  register: bao_keys_stat

- name: Fail on an unopenable vault
  ansible.builtin.fail:
    msg: >-
      OpenBao is initialised but {{ bao_keys_file }} is missing. Restore it, or set
      openbao_allow_reset=true to recreate the volume. Non-production only.
  when: bao_status.initialized and not bao_keys_stat.stat.exists and not (openbao_allow_reset | bool)

- name: Initialise openbao
  ansible.builtin.command: "{{ bao_exec }} bao operator init -key-shares=1 -key-threshold=1 -format=json"
  register: bao_init
  when: not bao_status.initialized
  no_log: true

- name: Write keys file
  ansible.builtin.copy:
    content: "{{ bao_init.stdout }}"
    dest: "{{ bao_keys_file }}"
    mode: "0600"
  when: bao_init is not skipped
  no_log: true

- name: Get keys file
  ansible.builtin.slurp:
    src: "{{ bao_keys_file }}"
  register: bao_keys_raw
  no_log: true

- name: Set root token
  ansible.builtin.set_fact:
    bao_keys: "{{ bao_keys_raw.content | b64decode | from_json }}"
  no_log: true

- name: Unseal openbao
  ansible.builtin.command: "{{ bao_exec }} bao operator unseal {{ (bao_keys.unseal_keys_b64 | default(bao_keys.keys_base64))[0] }}"
  when: bao_status.sealed
  changed_when: true
  no_log: true

# ~15 kubectl exec round trips (~12 s) that are no-ops on a running, unsealed
# vault. They rerun when it was just initialised or unsealed, when the database
# tier or the playbook changed, when a vault value may have (secrets_changed),
# on a rotation, or when the minted credentials file is missing.
- name: Look for the minted credentials file
  ansible.builtin.stat:
    path: "{{ openbao_env_file }}"
  register: openbao_env_present

- name: Configure engines, policy and AppRoles
  ansible.builtin.include_tasks: configure.yml
  when: >-
    (not bao_status.initialized) or bao_status.sealed
    or (databases_changed | default(true) | bool)
    or (secrets_changed | default(true) | bool)
    or (openbao_rotate_approle | bool)
    or not openbao_env_present.stat.exists

- name: Report openbao
  ansible.builtin.debug:
    msg: >-
      initialised={{ bao_status.initialized }} sealed_before={{ bao_status.sealed }}
      keys={{ bao_keys_file }} approle={{ 'minted' if (openbao_minted | default(false)) else 'unchanged' }}
