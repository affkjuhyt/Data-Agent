---
- name: Select images
  ansible.builtin.set_fact:
    images_selected: >-
      {{ images if (images_only | length) == 0
         else images | selectattr('name', 'in', images_only.split(',')) | list }}

- name: Check selected images
  ansible.builtin.assert:
    that: images_selected | length > 0
    fail_msg: "images_only matched nothing: {{ images_only }}"
  when: (images_only | length) > 0

- name: Build image references
  ansible.builtin.set_fact:
    image_refs: >-
      {{ images_selected | map(attribute='name')
         | map('regex_replace', '^', image_prefix ~ '/')
         | map('regex_replace', '$', ':' ~ image_tag) | list }}

- name: Get image ids before build
  ansible.builtin.shell: |
    set -euo pipefail
    for ref in {{ image_refs | join(' ') }}; do
      printf '%s=%s\n' "$ref" "$(docker images -q "$ref" 2>/dev/null || true)"
    done
  args:
    executable: /bin/bash
  register: ids_before
  changed_when: false

- name: Build images
  ansible.builtin.command: >
    docker build -f {{ project_dir }}/{{ item.0.file }}
    -t {{ item.1 }}
    {{ project_dir }}/{{ item.0.context }}
  loop: "{{ images_selected | zip(image_refs) | list }}"
  loop_control:
    label: "{{ item.1 }}"
  changed_when: true

- name: List rebuilt images
  ansible.builtin.shell: |
    set -euo pipefail
    for ref in {{ image_refs | join(' ') }}; do
      now=$(docker images -q "$ref" 2>/dev/null || true)
      was=$(printf '%s\n' '{{ ids_before.stdout }}' | awk -F= -v r="$ref" '$1==r {print $2}')
      [ "$now" = "$was" ] || printf '%s\n' "$ref"
    done
  args:
    executable: /bin/bash
  register: rebuilt
  changed_when: false

- name: Report rebuilt images
  ansible.builtin.debug:
    msg: "{{ rebuilt.stdout_lines | default(['none'], true) }}"

- name: Import images
  ansible.builtin.shell: |
    set -euo pipefail
    docker save {{ rebuilt.stdout_lines | join(' ') }} | {{ image_import }}
  args:
    executable: /bin/bash
  when: (image_import | length) > 0 and (rebuilt.stdout_lines | length) > 0
  changed_when: true

- name: Push images
  ansible.builtin.command: "docker push {{ item }}"
  loop: "{{ rebuilt.stdout_lines }}"
  when: image_push | bool
  changed_when: true
