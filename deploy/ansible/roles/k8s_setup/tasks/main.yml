---
- name: Run gateway setup
  when: (apply_setup | bool)
  block:
    - name: Delete setup job
      ansible.builtin.command: >
        {{ kubectl }} -n {{ ns_service }} delete job setup --ignore-not-found
      changed_when: true

    - name: Create setup job
      ansible.builtin.shell: |
        stage=$(mktemp)
        trap 'rm -f "$stage"' EXIT
        {{ manifest_sed }} {{ (k8s_manifests ~ '/job/setup.yaml') | quote }} > "$stage"
        {{ kubectl }} apply -f "$stage"
      register: setup_apply
      changed_when: "'created' in setup_apply.stdout or 'configured' in setup_apply.stdout"

    # Complete or Failed, as deploy.yml waits for its Jobs: `kubectl wait
    # --for=condition=complete` sat out the whole wait_job on a failed Job.
    - name: Wait for setup
      ansible.builtin.command: >
        {{ kubectl }} -n {{ ns_service }} get job/setup
        -o jsonpath={% raw %}'{.status.conditions[?(@.status=="True")].type}'{% endraw %}
      register: setup_state
      until: ('Complete' in setup_state.stdout) or ('Failed' in setup_state.stdout)
      retries: "{{ (wait_job | int) // (job_poll | int) }}"
      delay: "{{ job_poll | int }}"
      changed_when: false
      failed_when: "'Complete' not in setup_state.stdout"

    - name: Create backup cronjob
      ansible.builtin.command: "{{ kubectl }} apply -f {{ (k8s_manifests ~ '/job/postgres-backup.yaml') | quote }}"
      register: backup_apply
      changed_when: "'created' in backup_apply.stdout or 'configured' in backup_apply.stdout"
      when: apply_maintenance_jobs | bool

- name: Remove the retired memory cleanup CronJob
  ansible.builtin.command: >-
    {{ kubectl }} -n {{ ns_service }} delete
    cronjob/memory-cleanup serviceaccount/memory-cleanup
    configmap/memory-cleanup-env secret/memory-cleanup-secrets
    --ignore-not-found=true
  changed_when: false
  when: apply_maintenance_jobs | bool

- name: Get restore suspend flag
  ansible.builtin.command: >
    {{ kubectl }} -n {{ ns_database }} get job postgres-restore
    -o jsonpath={% raw %}'{.spec.suspend}'{% endraw %}
  register: restore_suspend
  changed_when: false
  failed_when: false

- name: Check restore is suspended
  ansible.builtin.assert:
    that: restore_suspend.stdout == 'true'
    fail_msg: "postgres-restore is not suspended and will drop a database."
  when: restore_suspend.rc == 0
