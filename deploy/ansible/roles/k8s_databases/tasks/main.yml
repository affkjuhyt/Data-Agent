---
- name: Deploy database tier
  when: (apply_databases | bool)
  block:
    - name: Create database workloads
      ansible.builtin.command: "{{ kubectl }} apply -f {{ k8s_dir }}/database/"
      register: db_apply
      changed_when: "'created' in db_apply.stdout or 'configured' in db_apply.stdout"

    - name: Wait for postgres
      ansible.builtin.command: >
        {{ kubectl }} -n {{ ns_database }} rollout status statefulset/postgres
        --timeout={{ wait_statefulset }}s
      changed_when: false

    - name: Wait for stores
      ansible.builtin.command: >
        {{ kubectl }} -n {{ ns_database }} rollout status statefulset/{{ item }}
        --timeout={{ wait_statefulset }}s
      changed_when: false
      loop: "{{ database_workloads }}"

    - name: Wait for pgbouncer
      ansible.builtin.command: >
        {{ kubectl }} -n {{ ns_database }} rollout status deployment/pgbouncer
        --timeout={{ wait_rollout }}s
      changed_when: false

  rescue:
    - name: Get pod state
      ansible.builtin.command: "{{ kubectl }} -n {{ ns_database }} get pods -o wide"
      register: diag_pods
      changed_when: false

    - name: Get recent events
      ansible.builtin.shell: >
        {{ kubectl }} -n {{ ns_database }} get events --sort-by=.lastTimestamp | tail -20
      args:
        executable: /bin/bash
      register: diag_events
      changed_when: false

    - name: Report diagnosis
      ansible.builtin.debug:
        msg: "{{ diag_pods.stdout_lines + [''] + diag_events.stdout_lines }}"

    - name: Fail database tier
      ansible.builtin.fail:
        msg: >-
          Pending with no StorageClass, FailedScheduling if the node is too small,
          CreateContainerConfigError if Secrets are missing. Nothing was deleted.
