---
- name: Set validation targets
  ansible.builtin.set_fact:
    validate_dirs: >-
      {{ (['database'] if (apply_databases | bool) else [])
       + (['job'] if (apply_jobs | bool) else [])
       + (['service'] if (apply_services | bool) else []) }}

- name: Validate manifests
  ansible.builtin.shell: |
    set -euo pipefail
    stage=$(mktemp -d)
    trap 'rm -rf "$stage"' EXIT
    for f in {{ k8s_dir }}/{{ item }}/*.yaml; do
      {{ k8s_sed }} "$f" > "$stage/$(basename "$f")"
    done
    {{ kubectl }} apply --dry-run=server -f "$stage/" >/dev/null
  args:
    executable: /bin/bash
  loop: "{{ validate_dirs }}"
  register: dryrun
  changed_when: false
  failed_when: false

- name: Fail on invalid manifests
  ansible.builtin.fail:
    msg: |
      deploy/k8s/{{ item.item }}/ was rejected; nothing has been created.
      {{ item.stderr | default('') }}
  loop: "{{ dryrun.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0

- name: Get node allocatable
  ansible.builtin.command: "{{ kubectl }} get nodes -o json"
  register: nodes_json
  changed_when: false

- name: Write node data
  ansible.builtin.copy:
    content: "{{ nodes_json.stdout }}"
    dest: /tmp/dataagent-nodes.json
    mode: "0644"
  changed_when: false

- name: Check cluster capacity
  ansible.builtin.command: >
    {{ ansible_playbook_python }} {{ role_path }}/files/capacity.py
    /tmp/dataagent-nodes.json
    {% for d in validate_dirs %}{{ k8s_dir }}/{{ d }} {% endfor %}
  register: capacity
  changed_when: false
  failed_when: false

- name: Report capacity
  ansible.builtin.debug:
    msg: "{{ capacity.stdout_lines }}"

- name: Fail on insufficient capacity
  ansible.builtin.fail:
    msg: "Cluster is too small for the selected tiers; nothing has been created."
  when: capacity.rc != 0

- name: List required secrets
  ansible.builtin.shell: |
    set -euo pipefail
    grep -oE '\-n dataagent-(service|database) create secret generic [a-z0-9-]+' \
      {{ k8s_dir }}/create-secrets.sh \
      | awk '{print $2"/"$NF}' | sort -u
  args:
    executable: /bin/bash
  register: want_secrets
  changed_when: false

- name: List existing secrets
  ansible.builtin.shell: |
    set -euo pipefail
    for ns in {{ ns_service }} {{ ns_database }}; do
      {{ kubectl }} -n "$ns" get secret -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
        | sed "s|^|$ns/|"
    done | sort -u
  args:
    executable: /bin/bash
  register: have_secrets
  changed_when: false

- name: Check secrets exist
  ansible.builtin.assert:
    that: (want_secrets.stdout_lines | difference(have_secrets.stdout_lines)) | length == 0
    fail_msg: >-
      Missing Secrets: {{ want_secrets.stdout_lines | difference(have_secrets.stdout_lines) | join(', ') }}
    success_msg: "{{ want_secrets.stdout_lines | length }} Secrets present"

- name: Check kafka-jaas secret
  ansible.builtin.command: "{{ kubectl }} -n {{ ns_database }} get secret kafka-jaas -o name"
  register: jaas_present
  changed_when: false
  failed_when: jaas_present.rc != 0
