---
- name: Docker daemon is reachable
  ansible.builtin.command: docker info
  changed_when: false

- name: Docker Compose v2 plugin is present
  ansible.builtin.command: docker compose version
  register: compose_version
  changed_when: false
  failed_when: "'v2' not in compose_version.stdout"

- name: .env exists (bootstrapped from .env.example on first run)
  ansible.builtin.stat:
    path: "{{ project_dir }}/.env"
  register: dotenv

- name: Create .env from .env.example
  ansible.builtin.copy:
    src: "{{ project_dir }}/.env.example"
    dest: "{{ project_dir }}/.env"
    remote_src: true
    mode: "0600"
  when: not dotenv.stat.exists

- name: Host ollama (LLM tier for local/appliance)
  when: llm_backend == 'host_ollama'
  block:
    - name: ollama answers
      ansible.builtin.uri:
        url: "{{ ollama_url }}/api/tags"
        return_content: true
      register: ollama_tags
      failed_when: false

    - name: ollama must be running (brew services start ollama / `ollama serve`)
      ansible.builtin.fail:
        msg: "ollama not reachable at {{ ollama_url }} — start it, or set llm_backend=litellm_config"
      when: ollama_tags.status | default(0) != 200

    - name: Pull {{ ollama_model }} when missing
      ansible.builtin.command: ollama pull {{ ollama_model }}
      when: ollama_model not in (ollama_tags.json.models | map(attribute='name') | list)
      changed_when: true
