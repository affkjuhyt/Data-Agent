---
- name: Docker daemon is reachable
  ansible.builtin.command: docker info
  changed_when: false

- name: Docker Compose v2 plugin is present
  ansible.builtin.command: docker compose version
  register: compose_version
  changed_when: false
  failed_when: "'v2' not in compose_version.stdout"

- name: .env exists (bootstrapped from .env.example on first run)
  ansible.builtin.stat:
    path: "{{ project_dir }}/.env"
  register: dotenv

- name: Create .env from .env.example
  ansible.builtin.copy:
    src: "{{ project_dir }}/.env.example"
    dest: "{{ project_dir }}/.env"
    remote_src: true
    mode: "0600"
  when: not dotenv.stat.exists

- name: deploy/docker/.env -> ../../.env (compose run by hand from deploy/docker sees the same file)
  ansible.builtin.file:
    src: ../../.env
    dest: "{{ compose_dir }}/.env"
    state: link
    force: true

