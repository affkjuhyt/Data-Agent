---
- name: Check existing secrets.env
  ansible.builtin.stat:
    path: "{{ secrets_env_file }}"
  register: existing_env

- name: Fail on existing secrets.env
  ansible.builtin.fail:
    msg: >-
      {{ secrets_env_file }} exists. Edit it with
      ansible-vault edit {{ secrets_env_source }}.
  when: existing_env.stat.exists

- name: Generate values
  ansible.builtin.set_fact:
    postgres_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    runtime_writer_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    postgres_crawler_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    clickhouse_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    clickhouse_crawler_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    minio_root_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    neo4j_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    keycloak_admin_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    grafana_admin_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    snowflake_crawler_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    gateway_key: "{{ lookup('password', '/dev/null length=48 chars=hexdigits') }}"
    service_auth_secret: "{{ lookup('password', '/dev/null length=64 chars=hexdigits') }}"
    kafka_admin_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    audit_consumer_kafka_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    release_worker_kafka_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    workflow_runtime_kafka_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    memory_consumer_kafka_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    schema_crawler_worker_kafka_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    litellm_api_key: "{{ lookup('password', '/dev/null length=64 chars=hexdigits') }}"
    langfuse_encryption_key: "{{ lookup('password', '/dev/null length=64 chars=hexdigits') }}"
    langfuse_nextauth_secret: "{{ lookup('password', '/dev/null length=64 chars=hexdigits') }}"
    langfuse_salt: "{{ lookup('password', '/dev/null length=64 chars=hexdigits') }}"
    langfuse_init_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    langfuse_public_key: "{{ lookup('password', '/dev/null length=64 chars=hexdigits') }}"
    langfuse_secret_key: "{{ lookup('password', '/dev/null length=64 chars=hexdigits') }}"
    openbao_token: ""
    openbao_role_id: ""
    openbao_secret_id: ""
    openai_api_key: ""
    gemini_api_key: ""
    remote_api_key: ""
    remote_llm_key: ""
  no_log: true

- name: Create secrets.env
  ansible.builtin.template:
    src: secrets.env.j2
    dest: "{{ secrets_env_file }}"
    mode: "0600"
  no_log: true

- name: Report next steps
  ansible.builtin.debug:
    msg:
      - "Fill OPENAI_API_KEY, GEMINI_API_KEY, REMOTE_API_KEY, REMOTE_LLM_KEY, OPENBAO_*"
      - "cp {{ secrets_env_file }} {{ secrets_env_source }}"
      - "ansible-vault encrypt {{ secrets_env_source }}"
