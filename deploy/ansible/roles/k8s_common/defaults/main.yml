---

k8s_dir: "{{ project_dir }}/deploy/k8s"
k8s_env: production
k8s_manifests: "{{ k8s_dir }}/{{ k8s_env }}"
docker_dir: "{{ project_dir }}/deploy/docker"

ns_service: dataagent-service
ns_database: dataagent-database

kubectl: kubectl

git_sync_enabled: true
git_remote: origin
git_branch: k8s/ver.0.1
pull_failure_log: "{{ deploy_state_dir }}/last-pull-failure.log"

deploy_state_dir: "{{ lookup('env', 'HOME') | default('/var/lib', true) }}/.dataagent-deploy/{{ env_name }}"
checkpoint_file: "{{ deploy_state_dir }}/last_deployed_sha.txt"
openbao_env_file: "{{ deploy_state_dir }}/openbao.yml"
openbao_keys_file: "{{ deploy_state_dir }}/openbao-keys.json"

deploy_full: false

image_prefix: dataagent
image_tag: latest
images_only: ""
# Optional hard boundary for a staged cutover. When set, the planner never
# builds or pushes an image outside this allowlist, even if its inputs changed.
# The local V3 target uses this so legacy Dockerfiles cannot turn a small deploy
# into a full-stack rebuild.
deploy_image_allowlist: []

image_push: true
image_import: ""

image_registry: ""
image_deploy_prefix: "{{ (image_registry ~ '/') if (image_registry | length) > 0 else '' }}{{ image_prefix }}"

# The third rule also rewrites an image named in a value rather than an `image:` line: left on
# localhost:5000, a pod started from such a value never pulled on a cluster whose registry is
# elsewhere (the retired sandbox pool's runner image did exactly that).
manifest_sed_rewrite: >-
  sed
  -e "s|image: {{ image_prefix }}/\([a-z0-9_-]*\):{{ image_tag }}|image: {{ image_deploy_prefix }}/\1:{{ image_tag }}|g"
  -e "s|image: localhost:5000/{{ image_prefix }}/\([a-z0-9_-]*\):{{ image_tag }}|image: {{ image_deploy_prefix }}/\1:{{ image_tag }}|g"
  -e "s|localhost:5000/{{ image_prefix }}/|{{ image_deploy_prefix }}/|g"
  -e "s|imagePullPolicy: IfNotPresent|imagePullPolicy: Always|g"
manifest_sed_images: >-
  {{ manifest_sed_rewrite if (image_registry | length) > 0
     else 'sed -e "s|localhost:5000/dataagent/|dataagent/|g" -e "s|imagePullPolicy: Always|imagePullPolicy: IfNotPresent|g"' }}
manifest_sed: "{{ manifest_sed_images }}{{ manifest_values_sed }}"

# GEN-06: where this install reaches its models and is reached from. The production manifests
# carry __NAME__ for each (manifest_values), so no pilot address or localhost is baked in; the dev
# manifests keep their LAN values. None is defaulted: k8s_preflight stops a production deploy
# that leaves one empty.
llm_main_base_url: ""        # the main model, OpenAI-style .../v1 (LiteLLM's upstream)
llm_fast_base_url: ""        # the fast model, .../v1
embedding_base_url: ""       # LiteLLM's embedding upstream, .../v1
document_embed_url: ""       # the TEI that embeds document chunks and questions (bge-m3)
document_rerank_url: ""      # the TEI reranker of document answers
gpu_egress_cidr: ""          # where those models run, opened in the NetworkPolicies (a.b.c.d/32)
frontend_origins: []         # the browser origins of the frontend: CORS and OIDC redirects
manifest_values:
  LLM_MAIN_BASE_URL: "{{ llm_main_base_url }}"
  LLM_FAST_BASE_URL: "{{ llm_fast_base_url }}"
  EMBEDDING_BASE_URL: "{{ embedding_base_url }}"
  DOCUMENT_EMBED_URL: "{{ document_embed_url }}"
  DOCUMENT_RERANK_URL: "{{ document_rerank_url }}"
  GPU_EGRESS_CIDR: "{{ gpu_egress_cidr }}"
  FRONTEND_ORIGINS: "{{ frontend_origins | join(',') }}"
manifest_values_sed: >-
  {% for name, value in manifest_values.items() %} -e "s|__{{ name }}__|{{ value }}|g"{% endfor %}

# Built only when images_only names them (k8s_plan): images no Deployment and no
# deploy-run Job uses. eval is the online-eval Job, applied by hand (model/eval/README.md).
images_on_demand: [eval]

image_self_context:
  - frontend

image_name_overrides:
  backend/alembic: migrate

# The frontend: production serves the built app (frontend/Dockerfile: `vite build`, then
# `vite preview` of dist/ with the install's settings written at start, GEN-05); the dev cluster
# keeps the Vite dev server of Dockerfile.dev, which needs the full source.
image_dockerfile_overrides:
  frontend: "{{ 'Dockerfile.dev' if k8s_env == 'dev' else 'Dockerfile' }}"

# What an image is rebuilt for is read from its Dockerfile (k8s_plan): the
# Dockerfile itself, every COPY/ADD source resolved against its build context,
# and that context's .dockerignore. There is no "shared" list any more — a
# backend/libs change rebuilds the images that COPY backend/libs, not keycloak.
build_parallelism: 6
build_log_dir: "{{ deploy_state_dir }}/build-logs"
# Without these BuildKit attaches a provenance attestation stamped with the
# build time, so a fully cached rebuild still gets a new digest, gets pushed,
# and restarts every pod running it. Off, identical inputs give an identical
# digest and the push/restart steps can skip it.
image_build_flags: "--provenance=false --sbom=false"
# Where deploy.yml asks which digest the registry already serves for a tag.
image_registry_url: "http://{{ image_registry }}"

vault_file: "{{ inventory_dir }}/.secrets/vault.yml"
secrets_env_file: "{{ k8s_dir }}/secrets.env"

secret_paths:
  - deploy/k8s/create-secrets.sh
  - deploy/docker/kafka/kafka-broker-jaas.config.example
  - "deploy/ansible/inventories/{{ env_name }}/group_vars"

config_paths:
  - deploy/k8s/create-configmaps.sh
  - deploy/k8s/production/configmap.yaml
  - deploy/k8s/dev/configmap.yaml
  - deploy/k8s/production/service/api.yaml
  - deploy/k8s/dev/service/api.yaml
  - deploy/docker/sql
  - deploy/docker/keycloak
  - deploy/docker/kong
  - deploy/docker/litellm
  - deploy/docker/monitoring

apply_databases: true
apply_jobs: false
apply_services: false
apply_setup: false
apply_maintenance_jobs: true

database_workloads:
  - redis
  - minio
  - kafka
  - openbao
  - qdrant
  - clickhouse

# Empty applies every database manifest. A staged V3 deployment can limit this
# to the stores it actually needs, e.g. postgres, pgbouncer and openbao.
database_manifests: []

service_workloads:
  - api
  - worker-agent
  - worker-ingest
  - worker-document
  - python-sandbox
  - crawler
  - egress-proxy
  - temporal
  - temporal-ui
  - litellm
  - langfuse
  - langfuse-worker
  - prometheus
  - frontend

# Empty means apply every manifest under service/ (the existing full-stack
# behaviour). A cutover or local V3 deployment can name only the manifests it
# is ready to run, without deleting the legacy files from the repository.
service_manifests: []

migration_jobs: [kong-migration, migrate]
job_workloads: [db-init, minio-init, temporal-schema]
# With apply_jobs, a Job reruns only when its own manifest
# (deploy/k8s/<env>/job/<name>.yaml) or one of these changed: a path prefix,
# `image:<name>` (that image is being rebuilt) or `job:<name>` (that Job
# reruns). A full deploy, or jobs_force=true, reruns all of them.
job_inputs:
  kong-migration: ["image:kong"]
  # Not image:migrate: that image COPYs all of backend/, so it is rebuilt for
  # any backend change, while only a new revision needs the Job.
  migrate: [backend/alembic]
  # grant-roles.sql grants on ALL TABLES, so tables a migration adds need it again. Every
  # file of deploy/docker/sql/ is applied by db-init (the db-init-sql ConfigMap): a seed
  # edited there (DS-AW's verified queries) reaches the cluster only if it reruns.
  db-init: [deploy/docker/sql, "job:migrate"]
  # The DS-AW documents it copies to da-raw-docs (the ConfigMaps of create-configmaps.sh).
  minio-init: [deploy/docker/adventureworks-docs]
  # Its manifest pins the admin-tools version; the schema is upgraded when that moves.
  temporal-schema: []
jobs_force: false
# Paths whose change reruns the gateway setup Job without -e apply_setup=true.
setup_inputs:
  - deploy/docker/kong/kong-setup.sh
  - deploy/docker/keycloak/
  - deploy/docker/setup/
  - "{{ k8s_manifests | relpath(project_dir) }}/job/setup.yaml"
seed_demo: false
seed_demo_tenant: a0000000-0000-0000-0000-000000000001

# GEN-07: the organisation this install serves (roles/k8s_org). Every value is required and none
# is defaulted, so an inventory that forgets one stops the deploy instead of installing a guess.
# org_id is the uuid users carry in Keycloak's tenant_id attribute; org_admin_username is the
# first system admin (AC05). When that user is not in Keycloak yet it is created with
# vault_org_admin_password as a temporary password to change at first login.
org_id: ""
org_code: ""
org_name: ""
org_locale: ""
org_time_zone: ""
org_currency: ""
org_admin_username: ""
org_admin_email: ""
keycloak_realm: aeroflow

wait_namespace: 60
wait_statefulset: 600
wait_job: 900
# The Jobs it waits on mostly finish in 3-10 s; a 5 s poll added up to 5 s to each wait.
job_poll: 2
wait_rollout: 600

openbao_allow_reset: false
openbao_rotate_approle: false

pg_host: "postgres.{{ ns_database }}.svc.cluster.local"
pg_port: 8300
pg_db: dataagent
pg_user: admin
minio_host: "minio.{{ ns_database }}.svc.cluster.local"
minio_port: 8360
minio_user: minio

public_api_url: https://dataagent.example.vn
keycloak_public_url: https://sso.example.vn
langfuse_public_url: https://langfuse.example.vn
keycloak_admin_user: admin
clickhouse_user: clickhouse
langfuse_init_email: admin@example.com
eval_agent_id: ""
