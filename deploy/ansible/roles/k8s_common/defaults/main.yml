---

k8s_dir: "{{ project_dir }}/deploy/k8s"
k8s_env: production
k8s_manifests: "{{ k8s_dir }}/{{ k8s_env }}"
docker_dir: "{{ project_dir }}/deploy/docker"

ns_service: dataagent-service
ns_database: dataagent-database

kubectl: kubectl

git_sync_enabled: true
git_remote: origin
git_branch: k8s/ver.0.1
pull_failure_log: "{{ deploy_state_dir }}/last-pull-failure.log"

deploy_state_dir: "{{ lookup('env', 'HOME') | default('/var/lib', true) }}/.dataagent-deploy/{{ env_name }}"
checkpoint_file: "{{ deploy_state_dir }}/last_deployed_sha.txt"
openbao_env_file: "{{ deploy_state_dir }}/openbao.yml"
openbao_keys_file: "{{ deploy_state_dir }}/openbao-keys.json"

deploy_full: false

image_prefix: dataagent
image_tag: latest
images_only: ""

image_push: true
image_import: ""

image_registry: ""
image_deploy_prefix: "{{ (image_registry ~ '/') if (image_registry | length) > 0 else '' }}{{ image_prefix }}"

manifest_sed_rewrite: 'sed -e "s|image: {{ image_prefix }}/\([a-z0-9_-]*\):{{ image_tag }}|image: {{ image_deploy_prefix }}/\1:{{ image_tag }}|g" -e "s|imagePullPolicy: IfNotPresent|imagePullPolicy: Always|g"'
manifest_sed: "{{ manifest_sed_rewrite if (image_registry | length) > 0 else 'cat' }}"

image_self_context:
  - backend/services/model_service
  - backend/services/sandbox_executor
  - backend/services/sandbox_executor/sandbox_runner
  - frontend

image_name_overrides:
  backend/alembic: migrate

# frontend's k8s Deployment runs `npm run dev` (both dev/ and production/
# manifests today — see deploy/k8s/dev/REPORT.md's bug log), which needs the
# full-source layout Dockerfile.dev provides, not plain Dockerfile's
# `vite preview`/dist-only production build. Unconditional (not k8s_env-
# gated): both manifests currently need it. Mirrors what
# deploy/k8s/build-push-images.sh and docker-compose.app.yml's `authoring`
# profile already do — this dict is what let deploy.yml's generic build task
# catch up to them instead of silently rebuilding a broken frontend image.
image_dockerfile_overrides:
  frontend: Dockerfile.dev

shared_paths:
  - backend/libs
  - pyproject.toml
  - uv.lock

vault_file: "{{ inventory_dir }}/.secrets/vault.yml"
secrets_env_file: "{{ k8s_dir }}/secrets.env"

secret_paths:
  - deploy/k8s/create-secrets.sh
  - deploy/docker/kafka/kafka-broker-jaas.config.example
  - "deploy/ansible/inventories/{{ env_name }}/group_vars"

config_paths:
  - deploy/k8s/create-configmaps.sh
  - deploy/k8s/production/configmap.yaml
  - deploy/k8s/dev/configmap.yaml
  - deploy/docker/sql
  - deploy/docker/keycloak
  - deploy/docker/kong
  - deploy/docker/litellm
  - deploy/docker/monitoring
  - backend/services/workflow_runtime/migrations/seed.sql
  - tests/e2e/seed.sql
  - tests/e2e/seed-governance.sql
  - tests/e2e/seed-flow.js

apply_databases: true
apply_jobs: false
apply_services: false
apply_setup: false

database_workloads:
  - redis
  - mongo
  - minio
  - kafka
  - openbao
  - qdrant
  - neo4j
  - clickhouse

service_workloads:
  - litellm
  - auth-api
  - flow-builder
  - workflow-runtime
  - kb-backend
  - model-service
  - release-worker
  - sandbox-executor
  - frontend

migration_jobs: [kong-migration, migrate]
job_workloads: [db-init, minio-init, kafka-topics, seed]
seed_demo: false
seed_demo_tenant: a0000000-0000-0000-0000-000000000001

wait_namespace: 60
wait_statefulset: 600
wait_job: 900
wait_rollout: 600

openbao_allow_reset: false
openbao_rotate_approle: false

pg_host: "postgres.{{ ns_database }}.svc.cluster.local"
pg_port: 8300
pg_db: dataagent
pg_user: admin
minio_host: "minio.{{ ns_database }}.svc.cluster.local"
minio_port: 8360
minio_user: minio

public_api_url: https://dataagent.example.vn
keycloak_public_url: https://sso.example.vn
langfuse_public_url: https://langfuse.example.vn
keycloak_admin_user: admin
clickhouse_user: clickhouse
langfuse_init_email: admin@example.com
eval_agent_id: ""
