[defaults]
inventory = inventories/k8s-local
roles_path = roles
callback_result_format = yaml
retry_files_enabled = False
interpreter_python = auto_silent
forks = 5

# The vault password file is git-ignored (.secrets/ is), so it never reaches a
# commit. ANSIBLE_VAULT_PASSWORD_FILE overrides this when a host keeps it
# elsewhere. The encrypted vault.yml, by contrast, IS committed -- that is what
# lets `git diff` see that a secret changed in a pull.
vault_password_file = inventories/k8s-local/.secrets/vault_pass

[ssh_connection]
pipelining = True
