[defaults]
inventory = inventories/k8s-local
roles_path = roles
callback_result_format = yaml
retry_files_enabled = False
interpreter_python = auto_silent
forks = 5
# Per-task timings, so a slow run says where the time went. profile_tasks is in
# the ansible.posix collection (not in ansible-core): install it once with
# `ansible-galaxy collection install -r requirements.yml`. Without it Ansible
# warns that it cannot load the callback and runs as before.
callbacks_enabled = ansible.posix.profile_tasks
# On the /data disk with everything else this host writes. Ansible does not
# create the directory: if it is missing it warns and logs nothing.
log_path = /data/logs/ansible-deploy.log

# The vault password file is git-ignored (.secrets/ is), so it never reaches a
# commit. ANSIBLE_VAULT_PASSWORD_FILE overrides this when a host keeps it
# elsewhere. The encrypted vault.yml, by contrast, IS committed -- that is what
# lets `git diff` see that a secret changed in a pull.
vault_password_file = inventories/k8s-local/.secrets/vault_pass

[ssh_connection]
pipelining = True
