[defaults]
inventory = inventories/local
roles_path = roles
callback_result_format = yaml
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
forks = 5
# Secrets live in inventories/<env>/group_vars/all/vault.yml (ansible-vault).
# Put the vault password file path in ANSIBLE_VAULT_PASSWORD_FILE or pass --ask-vault-pass.

[ssh_connection]
pipelining = True
