    release_info:
      publication_time: {from: fetch_time}
    release_calendar: {kind: none}   # cập nhật không theo lịch công bố → số lịch sử là first_seen
    freshness_sla: P14D
    extraction_profile:
      kind: xlsx_table
      sheet: Sheet1
      header_row: 1
      locale: en-US
      missing_markers: {}
    mapping:
      time: {column: "DAY", format: "%Y%m%d", frequency: D, market_timezone: UTC}
      values:
        - {column: "GPRD", series_key: "GPR:GPRD:D", measure: value}
        - {column: "GPRD_ACT", series_key: "GPR:GPRD_ACT:D", measure: value}
        - {column: "GPRD_THREAT", series_key: "GPR:GPRD_THREAT:D", measure: value}
    verified: V
    notes: >-
