  # ── Dầu + vàng: tháng, licence rõ hơn ─────────────────────────────────
  - id: wb-pink-sheet-monthly
    publisher: World Bank
    title: Commodity Price Data (Pink Sheet) — monthly
    connector: web-crawl
    format: xlsx
    landing_url: https://www.worldbank.org/en/research/commodity-markets
    follow_link_pattern: 'CMO-Historical-Data-Monthly\.xlsx$'
    schedule: weekly
    purpose: production
    promotion_mode: auto
    licence: "World Bank open data (CC BY 4.0), xác nhận cho file này"
    use_rights: internal_analysis
    release_info:
      publication_time: {from: xls_cell, sheet: "Monthly Prices", label_prefix: "Updated on"}
    release_calendar: {kind: monthly_day, day: 5, time: "12:00", tz: America/New_York}   # ~ngày làm việc thứ 2
    freshness_sla: P40D
    extraction_profile:
      kind: xlsx_table
      sheet: "Monthly Prices"
      header_row: 5
      unit_row: 6
      locale: en-US
      missing_markers: {"…": missing}
    mapping:
      time: {column: 0, format: "%YM%m", frequency: M, market_timezone: UTC}   # '2026M08'
      values:
        - {column: "Crude oil, Brent", series_key: "WB:PINK:BRENT:M", measure: value}
        - {column: "Crude oil, WTI", series_key: "WB:PINK:WTI:M", measure: value}
        - {column: "Crude oil, Dubai", series_key: "WB:PINK:DUBAI:M", measure: value}
        - {column: "Gold", series_key: "WB:PINK:GOLD:M", measure: value}
    verified: V
    notes: >-
      URL file đổi mỗi bản; URL tháng 1/2025 vẫn trả 200 với dữ liệu tới 2024M12.
      Bản 02/09/2026 (URL .../74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/...) có tới 2026M08.
      Sheet 'Monthly Prices': dòng 5 tên cột, dòng 6 đơn vị, kỳ '2026M08', thiếu '…'.
      Cột 'Crude oil, Brent', 'Crude oil, WTI', 'Crude oil, Dubai', 'Gold', 'Rice, Viet Namese 5%'.

  - id: imf-pcps-oil-gold
    publisher: International Monetary Fund
    title: Primary Commodity Price System (PCPS) — Brent, WTI, Dubai, gold, silver
    connector: sdmx
    format: xml
    examples:
      - https://api.imf.org/external/sdmx/2.1/data/PCPS/G001.POILBRE+POILWTI+POILDUB+PGOLD+PSILVER.USD.M?startPeriod=2000-01
    entity: COMMODITY_MONTHLY
    variables: [IMF:PCPS:POILBRE:M, IMF:PCPS:POILWTI:M, IMF:PCPS:POILDUB:M, IMF:PCPS:PGOLD:M, IMF:PCPS:PSILVER:M]
    schedule: weekly
    purpose: production
    promotion_mode: auto
    licence: "© IMF, All Rights Reserved; trích dẫn theo SUGGESTED_CITATION trong message"
    use_rights: pending_review
    release_info:
      publication_time: {from: sdmx_dataset_attr, attr: PUBLICATION_DATE}
    release_calendar: {kind: monthly_day, day: 10, time: "00:00", tz: UTC}
    freshness_sla: P40D
    extraction_profile:
      kind: sdmx
      message: structure_specific     # Series mang chiều là thuộc tính, Obs có TIME_PERIOD, OBS_VALUE
      locale: en-US
      missing_markers: {"NaN": missing}
    mapping:
      time: {field: TIME_PERIOD, format: "%Y-M%m", frequency: M, market_timezone: UTC}
      values:
        - {select: {INDICATOR: POILBRE}, series_key: "IMF:PCPS:POILBRE:M", measure: value}
        - {select: {INDICATOR: POILWTI}, series_key: "IMF:PCPS:POILWTI:M", measure: value}
        - {select: {INDICATOR: POILDUB}, series_key: "IMF:PCPS:POILDUB:M", measure: value}
        - {select: {INDICATOR: PGOLD}, series_key: "IMF:PCPS:PGOLD:M", measure: value}
        - {select: {INDICATOR: PSILVER}, series_key: "IMF:PCPS:PSILVER:M", measure: value}
    verified: V
    notes: >-
      Khoá COUNTRY.INDICATOR.DATA_TRANSFORMATION.FREQUENCY; kỳ dạng '2026-M08'.
      Đã gọi thử G001.PGOLD.USD.M (tháng 8/2026 = 4418.5445). Đọc lại 30/09/2026: cú pháp '+' chạy,
      trả đủ 5 indicator; PUBLICATION_DATE = 2026-09-08T18:42:56Z là thuộc tính của DataSet (không phải Header).

