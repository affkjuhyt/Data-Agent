  - id: lbma-gold-pm-json
    publisher: LBMA (benchmark do ICE Benchmark Administration quản trị)
    title: LBMA Gold Price PM theo ngày (crawl trang giá LBMA bằng trình duyệt)
    connector: web-crawl-headless
    format: json
    landing_url: https://www.lbma.org.uk/prices-and-data/precious-metal-prices
    # trang tự gọi json/today.json khi render; connector lưu phản hồi đó làm bản gốc (NOP-14, NOP-215)
    capture_response: "https://prices.lbma.org.uk/json/today.json"
    entity: GOLD_LBMA_PM
    variables: [LBMA:GOLD_PM:USD:D]
    schedule: daily
    purpose: production
    promotion_mode: auto
    licence: "Website LBMA: lấy/dùng/phân phối lại dữ liệu benchmark cần licence IBA. POC: phân tích nội bộ, ghi rõ trong báo cáo (ADR-V2-25)"
    use_rights: internal_analysis
    release_info:
      publication_time: {from: fetch_time}     # today.json không có năm và giờ PM không tin được
    release_calendar: {kind: none}             # chỉ có phiên gần nhất; lịch sử từ lbma-gold-price-manual
    freshness_sla: P4D
    extraction_profile:
      kind: json_path
      rows: "$.gold.pm"               # {"usd","gbp","eur","timestamp","date": "29/09"}
      locale: en-US
      missing_markers: {}
    mapping:
      # 'date' không có năm → năm lấy theo thời điểm tải (tháng 12 tải ngày 01/01 thì lùi một năm);
      # 'timestamp' của PM ghi 11:00 giống AM nên không dùng; phiên PM chốt 15:00 London
      time: {field: date, format: "%d/%m", year_from: fetch_time, session_time: "15:00", frequency: D, market_timezone: Europe/London}
      values:
        - {field: usd, series_key: "LBMA:GOLD_PM:USD:D", measure: value}
    verified: X
    notes: >-
