# Primary GET(s) each ROUTE_MAP screen loads. Keys are area/page (page "_" = SINGLE_SCREEN).
# needs_id / id_from: detail screens resolve {id} from the list endpoint's first item.
# Screens with no listable API still probe "/v1/me" so the harness records reachability.
screens:
  home/_:
    primary_gets: ["/v1/me", "/v1/inbox"]
  home/HOW_IT_WORKS:
    primary_gets: ["/v1/me"]

  needs-you/_:
    primary_gets: ["/v1/inbox"]
  needs-you/PROPOSAL:
    needs_id: true
    seed_id: a0000000-0000-0000-0000-000000aa1c01
    primary_gets: ["/v1/proposals/{id}"]
  needs-you/CONFLICT:
    needs_id: true
    seed_id: a0000000-0000-0000-0000-000000aa1c03
    primary_gets: ["/v1/hitl-requests/{id}"]
  needs-you/APPROVAL:
    needs_id: true
    seed_id: a0000000-0000-0000-0000-000000aa1c01
    primary_gets: ["/v1/proposals/{id}"]

  agents/TEAM:
    primary_gets: ["/v1/agents"]
  agents/BUILDER:
    primary_gets: ["/v1/agents"]
  agents/AGENT:
    needs_id: true
    id_from: "/v1/agents"
    primary_gets: ["/v1/agents/{id}"]
  agents/RUNS:
    primary_gets: ["/v1/runs"]
  agents/RUN:
    needs_id: true
    id_from: "/v1/runs"
    primary_gets: ["/v1/runs/{id}"]
  agents/EVALUATE:
    primary_gets: ["/v1/eval-sets", "/v1/agents"]
  agents/ORCHESTRATION:
    primary_gets: ["/v1/agents", "/v1/runs"]
  agents/OPERATIONS:
    primary_gets: ["/v1/admin/agent-usage"]
  agents/SKILLS:
    primary_gets: ["/v1/skills"]
  agents/SKILL_SUGGESTIONS:
    primary_gets: ["/v1/skill-suggestions"]
  agents/SKILL_VERSIONS:
    primary_gets: ["/v1/skills"]
  agents/TOOLS:
    primary_gets: ["/v1/tools"]
  agents/SKILL_EDITOR:
    needs_id: true
    id_from: "/v1/skills"
    primary_gets: ["/v1/skills/{id}"]
  agents/SKILL_FROM_SESSION:
    needs_id: true
    id_from: "/v1/workspaces"
    primary_gets: ["/v1/workspaces/{id}"]
  agents/SKILL_TESTS:
    needs_id: true
    id_from: "/v1/skills"
    primary_gets: ["/v1/skills/{id}"]
  agents/SKILL_RUN:
    needs_id: true
    id_from: "/v1/skills"
    primary_gets: ["/v1/skills/{id}"]

  analysis/_:
    primary_gets: ["/v1/conversations", "/v1/datasets"]
  analysis/ASK:
    primary_gets: ["/v1/conversations"]
  analysis/SESSIONS:
    primary_gets: ["/v1/workspaces"]
  analysis/REPORT:
    needs_id: true
    id_from: "/v1/session-reports"
    primary_gets: ["/v1/session-reports/{id}"]
  analysis/VAULT:
    primary_gets: ["/v1/me"]
  analysis/EXPLORE:
    primary_gets: ["/v1/metrics", "/v1/entities"]
  analysis/ARTIFACT:
    # No list endpoint for answers; stays no_seed_id until a conversation leaves one.
    needs_id: true
    primary_gets: ["/v1/answers/{id}"]
  analysis/FORECAST:
    primary_gets: ["/v1/forecast-models"]
  analysis/FORECAST_JOB:
    needs_id: true
    id_from: "/v1/forecasts"
    primary_gets: ["/v1/forecasts/{id}"]
  analysis/FORECAST_STUDIO:
    primary_gets: ["/v1/forecast-models"]
  analysis/FORECAST_MODEL:
