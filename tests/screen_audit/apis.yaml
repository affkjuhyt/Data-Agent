  analysis/REPORTS:
    primary_gets: ["/v1/monitors"]
  analysis/DIGEST:
    # UI uses GET /v1/me/digests (404 → notifications?kind=digest); PUT /v1/me/digest is prefs.
    primary_gets: ["/v1/me/notifications?kind=digest"]

