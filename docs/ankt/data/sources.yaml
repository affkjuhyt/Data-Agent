# Source registry seed for the ANKT prototype (checked 2026-09-15).
# verified: V = fetched/called successfully, S = seen via search/official page only, U = unverified.
# tier: S (smoke) | M (functional) | L (load). See ../DATA-SOURCES.md for context and licenses.
sources:
  # ── Vietnam official ────────────────────────────────────────────────
  - id: vn-mof-debt-bulletin
    publisher: Bộ Tài chính — Cục Quản lý nợ và Tài chính đối ngoại
    title: Bản tin nợ công
    connector: http-file
    format: pdf
    landing_url: https://qln.mof.gov.vn/ban-tin-no-cong.htm
    sample_urls:
      - https://static1.vietstock.vn/edocs/14237/document_2_.pdf   # issue 17 mirror
    variables: [public_debt, government_debt, external_debt_national, debt_service, interest_payments]
    schedule: yearly
    tier: S
    verified: V
    notes: Official landing DNS-failed from server; use mirror + manual upload with metadata.

  - id: vn-nso-monthly-report
    publisher: Cục Thống kê (NSO)
    title: Báo cáo tình hình kinh tế - xã hội tháng
    connector: http-file
    format: [docx, xlsx]
    landing_url: https://www.nso.gov.vn/bai-top/2026/09/bao-cao-tinh-hinh-kinh-te-xa-hoi-thang-tam-va-8-thang-nam-2026/
    sample_urls:
      - https://www.nso.gov.vn/wp-content/uploads/2026/09/01-Loi-van-T8.2026-final.docx
      - https://www.nso.gov.vn/wp-content/uploads/2026/09/02-Bieu-T8.2026.xlsx
    variables: [gdp_quarterly, budget_revenue, budget_expenditure, exports]
    schedule: monthly (day 3-6)
    tier: S
    verified: V

  - id: vn-nso-trade-monthly
    publisher: Cục Thống kê (NSO)
    title: Exports and imports value by months
    connector: http-file
    format: xls
    landing_url: https://www.nso.gov.vn/en/data-and-statistics/2025/03/exports-and-imports-value-by-months-of-2025/
    sample_urls:
      - https://www.nso.gov.vn/wp-content/uploads/2025/03/E01-2025-10.xls
    variables: [exports_goods, imports_goods]
    schedule: monthly
    tier: S
    verified: V

  - id: vn-nso-yearbook
    publisher: Cục Thống kê (NSO)
    title: Niên giám thống kê
    connector: http-file
    format: pdf
    sample_urls:
      - https://www.nso.gov.vn/wp-content/uploads/2026/07/NG-TOAN-QUOC-2025_WM.pdf
    variables: [gdp_current_prices, budget_revenue]
    schedule: yearly
    tier: S
    verified: V

  - id: vn-nso-pxweb
    publisher: Cục Thống kê (NSO)
    title: PX-Web
    connector: rest-api
    format: json
    landing_url: https://pxweb.nso.gov.vn/pxweb/vi/
    api_base: https://pxweb.nso.gov.vn/api/v1/vi/
    schedule: yearly
    tier: M
    verified: V
    notes: API lists 8 databases only; national accounts 404 via API.

  - id: vn-mof-budget-disclosure
    publisher: Bộ Tài chính
    title: Công khai ngân sách nhà nước
    connector: web-crawl
    format: [html, attachment]
    landing_url: https://ckns.mof.gov.vn/SitePages/home.aspx
    variables: [budget_estimate, budget_execution, budget_final_accounts]
    schedule: quarterly
    tier: M
    verified: V

  - id: vn-sbv-central-rate
    publisher: Ngân hàng Nhà nước
    title: Tỷ giá trung tâm
    connector: web-crawl
    format: html
    landing_url: https://sbv.gov.vn/vi/t%E1%BB%B7-gi%C3%A1
    variables: [usd_vnd_central_rate]
    schedule: daily
    tier: S
    verified: V

  - id: vn-sbv-bop
    publisher: Ngân hàng Nhà nước
    title: Cán cân thanh toán quốc tế
    connector: web-crawl
    format: html
    landing_url: https://sbv.gov.vn/en/balance-of-international-payment
    variables: [current_account, financial_account]
    schedule: quarterly
    tier: M
    verified: V

  - id: vn-customs-trade
    publisher: Cục Hải quan
    title: Thống kê xuất nhập khẩu
    connector: web-crawl-headless
    format: [html, xlsx]
    landing_url: https://www.customs.gov.vn/index.jsp?pageId=3521
    variables: [exports_goods, imports_goods]
    schedule: semi-monthly
    tier: M
    verified: V

  - id: vn-hnx-gov-bond-auction
    publisher: Sở Giao dịch Chứng khoán Hà Nội
    title: Kết quả đấu thầu trái phiếu Chính phủ
    connector: rest-api
    format: html-fragment
    landing_url: https://hnx.vn/vi-vn/trai-phieu/lich-dau-thau.html
    api_base: https://hnx.vn/ModuleReportBonds/Bond_DauThau/Bond_KetQua_DauThau
    variables: [gov_bond_issuance, gov_bond_yield]
    schedule: daily
    tier: M
    verified: V
    notes: Incomplete TLS chain; configure CA bundle.

  - id: vn-vcb-fx-xml
    publisher: Vietcombank
    title: Tỷ giá ngoại tệ
    connector: rest-api
    format: xml
    api_base: https://portal.vietcombank.com.vn/Usercontrols/TVPortal.TyGia/pXML.aspx
    variables: [fx_buy, fx_transfer, fx_sell]
    schedule: hourly
    tier: S
    verified: V

  - id: vn-law-public-debt-vbhn59
    publisher: Văn phòng Quốc hội
    title: Luật Quản lý nợ công — VBHN 59/VBHN-VPQH (23/03/2026)
    connector: http-file
    format: pdf
    sample_urls:
      - https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/59-vbhn-vpqh.pdf
    doc_type: law
    tier: S
    verified: V

  - id: vn-resolution-26-2026
    publisher: Quốc hội
    title: Nghị quyết 26/2026/QH16 — Kế hoạch tài chính quốc gia và vay, trả nợ công 2026–2030
    connector: manual-upload
    format: pdf
    doc_type: resolution
    tier: S
    verified: U
    notes: No official full-text URL found; upload with metadata.

  - id: vn-congbao
    publisher: Văn phòng Chính phủ
    title: Công báo
    connector: web-crawl
    format: [html, pdf]
    landing_url: https://congbao.chinhphu.vn/
    tier: M
    verified: S

  - id: vn-baochinhphu-rss
    publisher: Báo Điện tử Chính phủ
    title: RSS Kinh tế
    connector: rss
    format: rss
    api_base: https://baochinhphu.vn/kinh-te.rss
    schedule: every 15 min
    tier: S
    verified: V
    notes: Non-RFC-822 pubDate.

  # ── International ──────────────────────────────────────────────────
  - id: intl-imf-weo
    publisher: IMF
    title: World Economic Outlook — general government gross debt
    connector: sdmx
    format: [sdmx-json, sdmx-csv]
    api_base: https://api.imf.org/external/sdmx/3.0
    example: https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.RES/WEO/+/VNM.GGXWDG_NGDP.A
    perimeter: IMF_general_government
    schedule: semi-annual
    tier: S
    verified: V

  - id: intl-imf-gdd
    publisher: IMF
    title: Global Debt Database
    connector: sdmx
    format: [sdmx-json, sdmx-csv]
    example: https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.FAD/GDD/+/VNM.*.*
    perimeter: IMF_general_government
    tier: S
    verified: V

  - id: intl-imf-il
    publisher: IMF
    title: International Liquidity (reserves)
    connector: sdmx
    format: sdmx-csv
    example: https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.STA/IL/+/VNM.*.*.A
    tier: S
    verified: V

  - id: intl-wb-wdi
    publisher: World Bank
    title: World Development Indicators
    connector: rest-api
    format: json
    example: https://api.worldbank.org/v2/country/VNM/indicator/NY.GDP.MKTP.CN?format=json&mrv=3
    bulk_url: https://databankfiles.worldbank.org/public/ddpext_download/WDI_CSV.zip
    license: CC BY 4.0
    tier: S
    verified: V
    notes: GC.DOD.TOTL.GD.ZS is null for VNM.

  - id: intl-wb-ids
    publisher: World Bank
    title: International Debt Statistics
    connector: rest-api
    format: json
    example: https://api.worldbank.org/v2/sources/6/country/VNM/series/DT.TDS.DECT.CD/counterpart-area/WLD/time/YR2023?format=json
    tier: S
    verified: V

  - id: intl-wb-jedh
    publisher: World Bank
    title: Joint External Debt Hub
    connector: rest-api
    format: json
    example: https://api.worldbank.org/v2/sources/54/country/VNM/series/Q.1C0.1C0.C.9A.MOA.RXGT.1.ALL.MV.TO1.ALL/time/all?format=json
    tier: M
    verified: V

  - id: intl-bis
    publisher: BIS
    title: Exchange rates and international debt securities
    connector: sdmx
    format: csv
    examples:
      - https://stats.bis.org/api/v1/data/WS_XRU/M.VN.VND.A?startPeriod=2024-01&format=csv
      - https://stats.bis.org/api/v1/data/WS_DEBT_SEC2_PUB/Q.VN.3P.1.1.C.A.F.TO1.A.A.A.A.A.I?format=csv
    bulk_url: https://data.bis.org/bulkdownload
    tier: S
    verified: V

  - id: intl-oecd-revenue
    publisher: OECD
    title: Revenue Statistics Asia-Pacific
    connector: sdmx
    format: csv
    example: https://sdmx.oecd.org/public/rest/data/OECD.CTP.TPS,DSD_REV_COMP_ASAP@DF_RSASAP,/VNM..S13.T_5000..PT_B1GQ.A?startPeriod=2018&format=csvfile
    tier: M
    verified: V

  - id: intl-un-comtrade
    publisher: UN
    title: Comtrade
    connector: rest-api
    format: json
    example: https://comtradeapi.un.org/public/v1/preview/C/A/HS?reporterCode=704&period=2023&partnerCode=0&flowCode=X&cmdCode=TOTAL
    tier: M
    verified: V
    notes: Free key 500 calls/day; bulk files are paid.

  - id: intl-aseanstats
    publisher: ASEAN Secretariat
    title: ASEANstats
    connector: rest-api
    format: json
    example: https://data.aseanstats.org/api/indicator/FDI.AMS.TOT.INF
    license: CC BY 4.0
    tier: M
    verified: V

  - id: intl-fred
    publisher: Federal Reserve Bank of St. Louis
    title: FRED
    connector: rest-api
    format: json
    example: https://api.stlouisfed.org/fred/series/observations?series_id=VNMGGXWDGG01GDPPT&api_key=${FRED_API_KEY}&file_type=json
    auth: api_key
    rate_limit: 120/min
    tier: M
    verified: V

