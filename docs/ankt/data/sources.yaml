    verified: V
  - id: rpt-amro-fiscal-review-2025
    publisher: AMRO
    connector: http-file
    format: pdf
    sample_urls: [https://amro-asia.org/wp-content/uploads/2025/02/Country-Fiscal-Review_Vietnam_final.pdf]
