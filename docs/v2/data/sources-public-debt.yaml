  - id: bench-bird-text2sql
    publisher: BIRD-bench
    title: BIRD — 95 CSDL lớn, 12.751 câu hỏi
    connector: benchmark
    url: https://bird-bench.github.io/
    tests: [text-to-sql-accuracy, schema-selection-catalog-lon]
    tier: L
    verified: V
    checked: 2026-09-16

  - id: wh-ankt-derived
    publisher: Tự dựng từ IN1/IN5/IN8/IN9 trong `sources`
    title: Warehouse chỉ số kinh tế (WDI + IMF WEO + BIS nạp vào Postgres/ClickHouse)
    connector: db-readonly
    engine: postgres | clickhouse
    tests: [text-to-sql-postgres, semantic-layer, freshness, classification, rls, tien-than-observation-store]
