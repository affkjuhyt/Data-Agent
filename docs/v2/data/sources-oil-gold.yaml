  - id: lbma-gold-pm-json
    publisher: LBMA (benchmark do ICE Benchmark Administration quản trị)
    title: LBMA Gold Price PM theo ngày (JSON công khai trên website LBMA)
    connector: http-file
    format: json
    sample_urls:
      - https://prices.lbma.org.uk/json/gold_pm.json
    entity: GOLD_LBMA_PM
    variables: [LBMA:GOLD_PM:USD:D, LBMA:GOLD_PM:GBP:D, LBMA:GOLD_PM:EUR:D]
    schedule: daily
    purpose: production
    promotion_mode: auto
    licence: "Website LBMA: lấy/dùng/phân phối lại dữ liệu benchmark cần licence IBA. POC: phân tích nội bộ, ghi rõ trong báo cáo (ADR-V2-25)"
    use_rights: internal_analysis
    release_info:
      publication_time: {from: json_max_date, field: d, time: "23:59", tz: Europe/London}
    release_calendar: {kind: daily_lag, lag: PT0S, tz: Europe/London}   # kỳ kết thúc = nửa đêm London
    freshness_sla: P4D
    extraction_profile:
      kind: json_path
      rows: "$[*]"
      locale: en-US
      missing_markers: {}
    mapping:
      time: {field: d, format: "%Y-%m-%d", frequency: D, market_timezone: Europe/London}
      values:
        - {field: "v[0]", series_key: "LBMA:GOLD_PM:USD:D", measure: value}
    verified: X
    notes: >-
      27/09/2026: 200, 915 KB, 14.691 ngày từ 1968-04-01 tới 2026-09-25; dòng {"is_cms_locked", "d", "v": [USD, GBP, EUR]}.
      30/09/2026: từ máy chủ 10.10.55.101 trả 403 Cloudflare "Attention Required" (cả gold_am, silver,
      platinum, palladium; www.lbma.org.uk 503) → đang dùng dự phòng lbma-gold-price-manual.
      Toàn bộ lịch sử mỗi lần tải, chỉ ghi giá trị mới/đổi. Mapping chỉ lấy USD; GBP/EUR (v[1], v[2]) chờ chốt.

