# Seed nguồn cho POC V2 dầu/vàng. Kiểm tra từ máy chủ 10.10.55.101 ngày 27/09/2026.
# Nhập qua Add Data → Bulk Import (kb_backend/router/knowledge/sources.py: _parse_bulk_yaml). Giải thích từng nguồn: ../04-sources-oil-gold.md
#
# verified: V = tải được và đã đọc nội dung · S = tồn tại, cần key/đăng nhập · X = máy chủ bị chặn
#           U = chưa thử
# Khoá V2 (Pydantic SourceConfigV2, NOP-122; Bulk Import hiện chưa đọc, bỏ qua mà không lỗi):
#   licence, use_rights, entity, follow_link_pattern, freshness_sla, rate_limit {min_interval_s},
#   release_info (có cấu trúc), release_calendar, extraction_profile, mapping. `id` là source_key.
# Tách cách đọc khỏi nghĩa (ADR-V2-44, ../14-input-data-db.md mục 3, 6):
#   extraction_profile = đọc file thế nào (vật lý) → lưu vào KBSourceConfig.config
#   mapping            = cột nào là thời gian, cột nào thành series nào → Bulk Import tạo
#                        ingest.mapping_version v1 (proposed_by = seed), không lưu vào config
# release_calendar suy ngày công bố cho số lịch sử của lần nạp đầu (ADR-V2-43).
# `locale` ở cấp nguồn chỉ còn cho nguồn chưa có profile (văn bản, HTML); có profile thì nằm trong profile.
# Nguồn có profile + mapping (cấu trúc đã đọc từ file thật trên máy chủ ngày 30/09/2026): EIA x4, GPR,
# IMF PCPS, LBMA, Vietcombank, Pink Sheet (theo 04 mục 3). Còn lại: CFTC, JODI (NOP-127),
# HTML vàng/tỷ giá Việt Nam (NOP-47, NOP-68), FRED (cần key).
# Lịch "weekly" của Bulk Import là thứ Hai 03:00; nguồn công bố thứ Tư/thứ Sáu phải chỉnh cron ở tab Edit.
# connector: manual-upload bị Bulk Import bỏ qua có lý do (đúng ý đồ): nguồn đó tải tay qua Document Hub.
sources:
  # ── Dầu: giá spot ngày (công bố theo TUẦN) ─────────────────────────────
  - id: eia-brent-spot-daily
    publisher: U.S. Energy Information Administration
    title: Europe Brent Spot Price FOB (daily)
    connector: http-file
    format: xls
    sample_urls:
      - https://www.eia.gov/dnav/pet/hist_xls/RBRTEd.xls
    entity: BRENT_SPOT
    variables: [EIA:RBRTE:D]
    schedule: daily
    purpose: production
    promotion_mode: auto
    licence: "US government data (EIA), ghi nguồn"
    use_rights: internal_analysis
    release_info:
      publication_time: {from: xls_cell, sheet: Contents, label: "Release Date:", time: "10:30", tz: America/New_York}
      next_release_time: {from: xls_cell, sheet: Contents, label: "Next Release Date:", time: "10:30", tz: America/New_York}
    release_calendar: {kind: weekly_after, weekday: WED, time: "10:30", tz: America/New_York}
    freshness_sla: P8D
    extraction_profile:
      kind: xlsx_table
      sheet: "Data 1"
      header_row: 3
      locale: en-US
      missing_markers: {"-": missing, "--": missing, "NA": not_published, "W": withheld}
    mapping:
      time: {column: "Date", format: excel_serial, frequency: D, market_timezone: America/New_York}
      values:
        - {column: "Europe Brent Spot Price FOB (Dollars per Barrel)", series_key: "EIA:RBRTE:D", measure: value}
    verified: V
    notes: >-
      Toàn bộ lịch sử từ 20/05/1987 trong một file; chỉ ghi giá trị mới/đổi.
      Sheet 'Data 1', dòng 3 là header ('Date', 'Europe Brent Spot Price FOB (Dollars per Barrel)'),
      cột A là ngày Excel. Sheet 'Contents': 'Release Date:' 9/23/2026, 'Next Release Date:' 9/30/2026
      (đọc lại 30/09/2026). Crawl hằng ngày nhưng hash chỉ đổi khi EIA công bố (thứ Tư).

