  # ── Tỷ giá ─────────────────────────────────────────────────────────────
  - id: vn-vcb-fx-xml
    publisher: Vietcombank
    title: Tỷ giá ngoại tệ (XML, USD/VND mua tiền mặt, mua chuyển khoản, bán)
    connector: rest-api
    format: xml
    api_base: https://portal.vietcombank.com.vn/Usercontrols/TVPortal.TyGia/pXML.aspx
    entity: USDVND_VCB
    variables: [VCB:USDVND:BUY:I, VCB:USDVND:SELL:I]
    schedule: hourly
    purpose: production
    licence: cần xác nhận; tỷ giá niêm yết công khai
    use_rights: pending_review
    rate_limit: {min_interval_s: 300}
    release_info:
      publication_time: {from: xml_text, path: "/ExrateList/DateTime", format: "%m/%d/%Y %I:%M:%S %p", tz: Asia/Ho_Chi_Minh}
    release_calendar: {kind: none}
    freshness_sla: P2D
    extraction_profile:
      kind: xml_path
      rows: "/ExrateList/Exrate[@CurrencyCode='USD']"
      locale: en-US                   # '25,760.00' (T7)
      missing_markers: {"-": missing}
    mapping:
      time: {from: release_publication_time, frequency: I, market_timezone: Asia/Ho_Chi_Minh}
      values:
        - {attr: Buy, series_key: "VCB:USDVND:BUY:I", measure: value}
        - {attr: Sell, series_key: "VCB:USDVND:SELL:I", measure: value}
      side_columns: [Transfer]
    verified: V
    notes: >-
      Số kiểu Mỹ '25,760.00' dù là nguồn Việt Nam (locale en-US, bẫy T7). Giới hạn 1 request/5 phút
      nên lịch 'hourly' là đủ. Nhiều lần công bố trong ngày: chênh vàng lấy tỷ giá đúng thời điểm và
      đúng phía (mua hoặc bán), VN-03.
