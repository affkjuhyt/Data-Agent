  - id: cftc-cot-disaggregated
    publisher: U.S. Commodity Futures Trading Commission
    title: Commitments of Traders — Disaggregated (tuần hiện tại)
    connector: http-file
    format: txt
    sample_urls:
      - https://www.cftc.gov/dea/newcot/f_disagg.txt
    entity: POSITIONING
    schedule: weekly
    purpose: production
    promotion_mode: auto
    licence: "US government data (CFTC)"
    use_rights: internal_analysis
    # file không ghi ngày công bố; vị thế thứ Ba, công bố thứ Sáu 15:30 ET (chỉnh cron sang thứ Bảy)
    release_info:
      publication_time: {from: fetch_time}
    release_calendar: {kind: weekly_after, weekday: FRI, time: "15:30", tz: America/New_York}
    freshness_sla: P8D
    verified: V
    notes: >-
      Có 'CRUDE OIL, LIGHT SWEET-WTI', 'BRENT LAST DAY - NEW YORK MERCANTILE EXCHANGE',
      'GOLD - COMMODITY EXCHANGE INC.' (mã 088691). Lịch sử năm: files/dea/history/fut_disagg_txt_2026.zip.
      f_disagg.txt KHÔNG có dòng tên cột (đọc lại 30/09/2026: 191–193 trường, tên thị trường có dấu phẩy
      trong ngoặc kép); profile phải khai báo danh sách cột theo tài liệu định dạng của CFTC (NOP-127).

  - id: gpr-daily
