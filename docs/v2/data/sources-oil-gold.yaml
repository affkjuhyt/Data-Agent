    sample_urls:
      - https://www.matteoiacoviello.com/gpr_files/data_gpr_daily_recent.xls
    entity: GEOPOLITICAL_RISK
    variables: [GPR:GPRD:D, GPR:GPRD_ACT:D, GPR:GPRD_THREAT:D]
    schedule: weekly
    purpose: production
    licence: "chỉ số nghiên cứu; trích Caldara & Iacoviello (2022), AER"
    use_rights: pending_review
    release_info:
      publication_time: {from: fetch_time}
    release_calendar: {kind: none}   # cập nhật không theo lịch công bố → số lịch sử là first_seen
    freshness_sla: P14D
    extraction_profile:
      kind: xlsx_table
      sheet: Sheet1
      header_row: 1
      locale: en-US
      missing_markers: {}
    mapping:
      time: {column: "DAY", format: "%Y%m%d", frequency: D, market_timezone: UTC}
      values:
        - {column: "GPRD", series_key: "GPR:GPRD:D", measure: value}
        - {column: "GPRD_ACT", series_key: "GPR:GPRD_ACT:D", measure: value}
        - {column: "GPRD_THREAT", series_key: "GPR:GPRD_THREAT:D", measure: value}
    verified: V
    notes: >-
      Cột DAY (chuỗi '20260928'), N10D, GPRD, GPRD_ACT, GPRD_THREAT, date (ngày Excel), GPRD_MA30, GPRD_MA7;
      đọc lại 30/09/2026: 15.246 ngày, mới nhất 28/09/2026.

