[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "data-agent"
version = "0.1.0"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    # httpx mocking for the model_service / workflow_runtime HTTP clients.
    "respx>=0.21",
    "testcontainers[postgres,redis,kafka]>=4.7",
    "httpx>=0.27",
    "requests>=2.31",
    # kb_backend router imports File/Form routes during unit collection.
    "python-multipart>=0.0.9",
    # Unit tests import the shared Kafka connector; service images install it,
    # so the test extra should too.
    "aiokafka>=0.10.0",
    "pyaml",
    # Ships the generated OpenAPI models the API server validates against —
    # tests/unit/workflow_runtime/test_k8s_manifests.py checks deploy/k8s/*.yaml field names offline
    # (no cluster, so kubectl cannot). Skipped when absent.
    "kubernetes>=31.0",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "import-linter>=2.0",   # Dependency Rule arch test (.importlinter)
    "vulture>=2.14",        # dead-code detection (SRS §7.2)
]

# Python import root is backend/ — `import libs…`, `import services…` resolve there.
[tool.setuptools.packages.find]
where = ["backend"]
exclude = ["tests*", "node_modules*", "dist*"]

# ─── Pytest ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = [".", "backend"]   # "." for tests.*, backend for libs.* / services.*
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "unit: fast pure-Python tests, no external services or Docker",
    "integration: tests that spin up Docker containers via testcontainers",
    "e2e: tests that drive the deployed cluster through its gateway (LIVE_STACK=1, `make e2e`)",
    # Kinds and requirement IDs sit on top of exactly one level above (docs/v2/15-test-strategy.md §4).
    "contract: pins a published contract (OpenAPI, event envelope, agent frames, ObservationStore port)",
    "security: authorization, tenant isolation or untrusted input",
    "resilience: behaviour under a failing dependency (retry, redelivery, restart, timeout)",
    "performance: measures latency or throughput against a budget",
    "ai_eval: scores model output against a labelled set",
    "req(*ids): requirements this test proves: UCnn, NOP-n, plan ID (S6-03), SC27-nn, SCVN-n",
]
filterwarnings = [
    "error",
    # Upstream deprecation noise is not our bug — only fail on Deprecation
    # warnings that point back at our own code. Once `services.*` and
    # `basemodel.*` are clean, switch to scoped-error like:
    #     "error::DeprecationWarning:services.*"
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # FastAPI TestClient + anyio MemoryStream: __exit__ closes the client
    # synchronously but anyio's async streams are GC'd later and surface a
    # benign ResourceWarning. pytest 8's unraisableexception plugin wraps it
    # as PytestUnraisableExceptionWarning. Real resource leaks from OUR code
    # still raise (filter scope is the pytest wrapper, not the underlying
    # ResourceWarning class). Drop this once anyio ships a sync __del__.
    "ignore::pytest.PytestUnraisableExceptionWarning",
    # basemodel Pydantic models use `model_name` / `model_id` fields, which collide
    # with pydantic's protected `model_` namespace and emit a UserWarning at import.
    # It's a naming choice in basemodel, not a bug — ignore so importing the ORM in
    # tests doesn't error under `filterwarnings = error`. (Real fix: set
    # `model_config['protected_namespaces'] = ()` on those basemodel classes.)
    "ignore:Field .* has conflict with protected namespace:UserWarning",
    # Same story for `schema` fields on warehouse request/response models — the
    # name shadows BaseModel's deprecated `.schema()` classmethod, not a bug.
    "ignore:Field name .* shadows an attribute in parent:UserWarning",
    # litellm's own pydantic models still use V1 config keys and warn at import.
    # Whichever test imported litellm first used to decide whether collection
    # died on it, so a file passed or failed depending on what ran before it.
    "ignore:Valid config keys have changed in V2:UserWarning",
]

# ─── Coverage ──────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["backend/services", "backend/libs", "model"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/alembic/*",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
# Coverage gate, applied to the COMBINED unit report (CI: python-coverage job,
# which merges the per-suite data files). A single suite covers one service's
# share of the tree, so its own run passes --cov-fail-under=0.
# Measured 53.2% combined on 2026-09-27 (six unit suites, before the flow_builder
# and model_service suites existed); set to measured − 5.
# RATCHET: raise it as the number rises. Target trajectory: 50 → 70. Never lower it.
fail_under = 48
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# ─── Vulture (dead code) ───────────────────────────────────────────────────
# SRS §7.2: dead code must be removed without changing runtime behaviour.
# Vulture finds unused functions/classes/vars (Ruff F401 only covers imports).
# 60 is where vulture reports unused functions and classes at all (80 only
# reaches imports and unreachable code, so it said nothing useful). The noise
# that comes with 60 is removed structurally rather than name by name:
#   * route handlers, validators and REGISTRY entries are reached through a
#     decorator, never by name — ignore_decorators;
#   * Pydantic/ORM/TypedDict modules are field declarations read by the
#     framework — excluded (a dead model class there is found by grepping for
#     its name, as the 2026-09 sweep did);
# What is left is either dead or a real dynamic reference; vet it, then delete
# it or add it to backend/.vulture_whitelist.py with the reason. Run: `make deadcode`.
[tool.vulture]
paths = ["backend/services", "backend/libs", "backend/.vulture_whitelist.py"]
min_confidence = 60
ignore_decorators = [
    "@router.*",
    "@*_router.*",
    "@app.*",
    "@register",
    "@*validator",
]
exclude = [
    "*/migrations/*",
    "*/alembic/*",
    "*/__pycache__/*",
    "*/tests/*",
    "*/node_modules/*",
    "*/basemodel/*",
    "*/schemas/*",
    "*/schemas.py",
    "*/state.py",
]

# ─── Ruff (lint + format) ──────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "backend"]   # libs/ and services/ are first-party for isort — they live under backend/
extend-exclude = [
    "backend/alembic/versions",
    "node_modules",
    "dist",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear (common pitfalls)
    "BLE",      # blind except (one of the audit findings)
    "C4",       # comprehensions
    "SIM",      # simplifications
    "UP",       # pyupgrade
    "RUF",      # ruff-specific
    "ASYNC",    # async pitfalls (blocking call in async def)
]
ignore = [
    "E501",     # line too long — let formatter handle
    "B008",     # do not perform function calls in default args — fastapi Depends() needs this
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "BLE001"]   # asserts + broad except OK in tests
"backend/alembic/**" = ["E", "F", "I"]    # alembic-generated

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── mypy ──────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "backend/alembic/versions/",
    "node_modules/",
    "dist/",
    "build/",
]

# Strict per-module: the innermost, most-reused layers are held to
# `disallow_untyped_defs` + `disallow_any_generics` and are kept green (0 errors)
# — enforced BLOCKING by the CI "Strict typecheck · core libs" step, not just
# reported. Expand this list as each service is cleaned up (see the burn-down in
# docs/SECURITY.md / docs/RUNBOOK.md: database_connector, kb_backend, orchestrator next).
#
# NOTE: these globs only match real importable packages. Hyphenated service dirs
# (`backend/services/auth_api`, …) are NOT importable as `services.auth_api.*`, so such a
# glob is a no-op ("unused section"); enforce those by invoking mypy on the dir
# directly in CI instead.
[[tool.mypy.overrides]]
module = [
    "libs.basemodel.*",
    "libs.database_connector.*",
    "libs.shared.*",
]
disallow_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
