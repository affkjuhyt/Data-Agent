// Go↔Python boundary contract for the CPU-bound compute kernels (see
// M3-CAPACITY.md §5). kb-compute (Go) owns deterministic ranking/text work;
// Python calls it instead of doing RRF/BM25/entity-dedup in-process.
//
// The scaffold currently serves these as HTTP+JSON (see services/kb-compute) so
// it builds with the Go stdlib alone. This .proto is the target gRPC contract —
// generate stubs when the seam graduates from HTTP to gRPC:
//   protoc --go_out=. --go-grpc_out=. libs/proto/kbcompute.proto
syntax = "proto3";

package kbcompute.v1;
option go_package = "github.com/dataagent/kb-compute/gen/kbcomputev1";

service KbCompute {
  // Reciprocal Rank Fusion — fuse N ranked hit-lists into one.
  // Mirrors services/kb_backend/pipeline/light_rag/pipeline.py:rrf_merge.
  rpc RrfFuse(RrfFuseRequest) returns (RrfFuseResponse);
}

message Hit {
  string point_id = 1;
  // Opaque pass-through payload (JSON), preserved on the fused hit.
  bytes payload = 2;
}

message RankedList { repeated Hit hits = 1; }

message RrfFuseRequest {
  repeated RankedList lists = 1;
  int32 top_n = 2;
  int32 k = 3;         // RRF constant; 0 → default 60
}

message FusedHit {
  string point_id = 1;
  bytes payload = 2;
  double rrf_score = 3;
  int32 rrf_rank = 4;  // 1-indexed
}

message RrfFuseResponse { repeated FusedHit hits = 1; }
